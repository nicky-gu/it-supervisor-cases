（如电线、空调、地板等）等，在灾难发生时都必须运送到站点，同时从基础开始安装，因此故障恢复时间可能会很长。温站（Warm Site）指用于信息处理的网络连接和一些外围设备只是部分进行了配置，如磁盘、磁带，但主要的计算机系统没有备份，在灾难发生时，能够加快系统可以投入使用的速度，但比热站的费用低。参考答案 （1）C （2）A （3）B （4）A【问题2】（6分）试题分析 本题考查信息网络系统过程控制常用的监理方法。评估（评审）：指依据信息系统工程项目的总体需求和网络设备的指标，判断网络设备是否能够满足信息系统工程的建设需求。由于通常情况下，网络设备提供商提供的技术指标比较准确，可信度较高，因此，评估的方法适用于网络设备的选型和采购。当然对于某些关键的网络设备也可以通过测试的手段保证其质量。网络仿真：使用网络仿真的方法，可以对网络设计方案进行必要的评估，验证承建方的网络设计方案是否能够满足业主方的需要。现场旁站：即在网络施工的过程中，采用旁站的方式进行监理，主要目的在于保证项目实施过程中工程标准的符合性，尽可能保证施工过程符合国家或国际相关标准。现场旁站比较适合于网络综合布线的质量控制。抽查测试：对于网络的连通性和通信质量要进行一定比率的抽查测试。抽查测试比较适合于综合布线，结合现场旁站的手段，根据手持式网络测试仪抽测的结果，能够分析网络综合布线的效果，可以有效保证网络综合布线的质量。网络性能测试：为了保证多媒体应用的性能，需要对网络进行全面的性能测试，主要是通过必要的网络测试工具，对网络的性能进行测试。参考答案 （1）评估\t（2）抽查测试 （3）现场旁站（旁站）（4）网络仿真【问题3】试题分析（1）依据《电子信息系统机房设计规范（GB 50174-2008）》，单台设备面积为\t3.5~4.5㎡\t，则20台设备的面积最大为\t4.5*20=90㎡<100㎡（2）开机时主机房夏季设计室内适宜温度为21℃-25℃、相对湿度为45％-65％。（3）光缆拐弯处的曲率半径不能小于30cm。（4）由于作业地点的条件限制（例如沼泽地或土壤不稳固等）而不适于安装预制入孔时，可以选择现场浇灌水泥管道。（5）共用接地装置的接地电阻应按所有设备中的最小值要求确定，即如果单个设备接地电阻是1Ω．那么整个系统的接地电阻不能大于1Ω。V(2)x(3)✓(4)✓(5)x试题分析（1）试题四 答案及解析【问题1】（4分）试题分析 本题考查质量控制常用的工具和技术。常用的质量控制和改进的工具或技术有以下几种。流程图，也称过程图。它常被用于将一个过程（如测试过程、检验过程、质量改进过程等）的步骤用图的形式表示出来。检查表，又称计数表、核查表。它是一种利用统计表对数据进行统计分析，从而找出整体和初步原因的表格型工具，如缺陷位置调查表、不合格品原因调查表、不合格品项目分类调查表等。因果图，也称特性要因图、树枝图或鱼骨图。它常被用于系统整理和分析某个质量问题（结果）与其产生原因之间的关系。因果分析图由质量特性（质量结果）、要因（产生质量问题的主要原因）、枝干（指表示不同层次的原因的箭线）、主干（指较粗的直接指向质量结果的水平箭线）等组成。排列图，又称主次因素分析、Pareto图。主要功能是帮助人们确定那些相对少数但重要的问题，以使人们把精力集中于这些问题的改进上。对于过程质量控制，排列图常用于不合格品或缺陷的分类分析。散点图，又称相关图。在质量控制中它常用来显示两种质量数据之间的关系。质量数据之间的关系多为相关关系，一般有三种类型：质量特性和影响因素间的关系；质量特性和质量特性间的关系：影响因素和影响因素间的关系。直方图，又称频数分布直方图。它将收集到的质量数据进行分组整理，绘制成频数分布直方图，以描述质量分布状态，所以又称质量分布图法。直方图用横坐标标注质量特性值，纵坐标标注频数或频率值，各组的频数或频率的大小用直方柱的高度来表示。控制图又称管理图。它是一种对生产过程中的产品质量状况进行实时控制的统计工具。控制图较直方图最大的特点是引入了时间序列，通过观察样本点相关统计值是否在控制限内以判断过程是否受控，通过观察样本点排列是否随机从而及时发现异常。与直方图相比，控制图在质量预防和过程控制方面的能力大为改进。控制图的主要用途有：分析判断生产过程是否稳定；及时发现生产中异常情况，预防不合格品产生；趋势分析，又称趋势预测法。它根据历史的数据使用数学技术来预测项目未来的发展，趋势分析通常被用来监控质量和进度，包括趋势平均法、指数平滑法、直线趋势法、非直线趋势法。参考答案 B\tE\tF\tH【问题2】（7分）参考答案（1）不合理，应该由总监理工程师下达停工令。因为承建方需求调研没有完成，且未经评审及三方确认，所以不得进入系统开发工作。（2）A单位想法不可行。监理单位不能参与除监理以外的与本项目有关的业务，而且，监理单位不得从事任何的具体的信息系统工程业务，监理单位应该是完全独立于甲乙双方的第三方机构。（3）监理的责任范围包括：①应按照“守法、公平、公正、独立”的原则，开展信息系统工程监理工作，维护业主单位与承建单位的合法权益；②只能按照监理合同取得监理收入；③不得承包信息系统工程；④不得与被监理项目的承建单位存在隶属关系和利益关系；⑤不得以任何形式侵害业主单位和承建单位的知识产权：⑥在监理过程中违犯国家法律、法规，造成重大质量、安全事故的，应承担相应的经济责任和法律责任。【问题3】（4分）参考答案 监理工作的主要内容概括来说就是“四控”、“三管”、“一协调”。四控，指信息系统工程质量控制、信息系统进度控制、信息系统投资控制、信息系统变更控制。三管，指信息系统工程合同管理、信息系统信息管理、信息系统安全管理。一协调，指在信息系统工程实施过程中协调有关单位及人员间的工作关系。试题五 答案及解析【问题1】（4分）试题分析关于（3），监理监督承建单位根据项目定义的软件过程，对软件测试进行开发、维护、建立文档和验证。关于（4），监理监督承建单位依据项目定义的软件过程、计划实施软件的确认测试。关于（5），监理人员不能参与到监理工作职责范围外的与项目有关的工作。参考答案（1）✓\t(2)✓\t(3)x\t\t(4)x\t\t(5)x\t\t(6)✓【问题2】（4分）试题分析 本题考查软件测试阶段的划分。根据测试所处的不同阶段，软件测试一般分为四个阶段。单元测试：测试对象为任一计算机软件单元。集成测试：测试对象为由软件单元组装而得到的软件部件。确认测试：也称为验收测试（验收不一定是仅在项目完成后才进行），测试对象为完整的软件，目的是确认软件的有效性。系统测试：测试对象为整个计算机系统，包括硬件系统和软件系统。参考答案 （1）单元测试 （2）集成测试 （3）确认测试／验收测试 （4）系统测试\n全国计算机技术与软件专业技术资格考试2019年上半年 信息系统监理师 下午试卷解析试题一 答案及解析【问题1】（6分）答案：疏漏之处及正确做法分别如下：①监理工程师抽检。正确做法：应该由承建方进行抽检操作，监理工程师签字确认。②疏漏之处：抽取了其中50个逐一检查。正确做法：应该针对三家厂商不同型号的电子标签分别进行抽检。③疏漏之处：监理工程师检查合格后入库。正确做法：经监理方审查后，报业主方审查、批准、同意后入库。试题分析 本题可以从设备采购要点、抽样规定、监理常识等角度解答。1．设备采购监理的重点1）设备是否与工程量清单所规定的设备（系统）规格相符。2）设备是否与合同所规定的设备（系统）清单相符。3）设备合格证明、规格、供应商保证等证明文件是否齐全。4）设备（系统）要按照合同规定准时到货。5）配套软件包（系统）是否是成熟的、满足规范的。2．设备采购监理的流程1）承建商提前三天通知业主和监理方设备到达时间和地点，并提交交货清单。2）监理方协助业主做好设备到货验收准备。3）监理方协助业主进行设备验收，并做好记录，包括对规格、数量、质量进行核实，以及检查合格证、出厂证、供应商保证书及规定需要的各种证明文件是否齐全，在必要时利用测试工具进行评估和测试，评估上述设备能否满足信息网络建设的需求。4）发现短缺或破损，要求设备提供商补发或免费更换。5）提交设备到货验收监理报告。【问题2】（4分）答案：（1）监理工程师采用的进度控制方法是香蕉图曲线法。七月时的项目进展情况为：网络工程实际进度稍有超前，软件开发实际进度稍有滞后。（2）监理工程师补充完善措施如下：·分析现状，分析超前滞后的主客观原因及对工期的影响程度。检查作业计划执行中的问题，找出原因，采取措施予以解决。检查分析进度计划，如果进度偏离计划不十分严重，便可以通过解决矛盾，排除障碍，继续执行原计划的顺序和时间安排。当项目确实不能按原计划实现时，应该考虑对计划进行必要的调整，适当延长工期，或改变实施速度。试题分析 本题考察了“香蕉”曲线图法，曲线A是最早时间计划，曲线B是最迟时间计划，曲线N为实际进度。曲线N处在A、B两曲线之中，表示进度正常，处于曲线A之上，表示提前，处于曲线B之下为延期。补充完善措施可以从进度控制的进度计划实施调度以及进度计划检查与调整方面进行解答。调度工作的内容包括：检查作业计划执行中的问题，找出原因，采取措施予以解决；督促供应商按照进度计划的要求供应资源；控制实施现场临时设施等正常使用，搞好平面管理，发布调度令，检查决议执行情况等。通过进度计划的检查分析，如果进度偏离计划不十分严重，便可以通过解决矛盾及排除障碍，继续执行原计划的顺序和时间安排。当项目确实不能按原计划实现时，应该考虑对计划进行必要的调整，适当延长工期，或改变实施速度【问题3】（5分）答案：（1）监理在投资控制过程中应遵循的基本原则如下：投资最优化原则。全面成本控制原则。动态控制原则。目标管理原则。责、权、利相结合的原则。(2)承建单位违反了投资最优化原则。建设单位违反了动态控制原则。监理单位违反了全面成本控制原则。试题分析 本题考察的是投资控制原则，第一问答出小标题即可。第二问需要理解每条小标题的含义。【问题4】（5分）答案：作为项目监理工程师，应该严格按照变更控制工作流程进行变更控制，变更控制工作流程如下：①了解变化；②接受变更申请；③变更的初审；④变更分析；⑤确定变更的方法；⑥监控变更的实施；⑦变更效果评估。试题分析 本题考察的是变更控制的工作程序，变更应该按照变更管理流程来执行。试题二 答案及解析【问题1】（5分）答案：（1）承建单位的做法不合理。因为：软件没有通过计算机软件确认测试评审。软件没有通过系统测试评审。合同或合同附件规定的各类文档不齐全。软件产品未置于配置管理之下。未进行验收测试和配置审计。没有向建设单位及监理单位提交正式的软件验收申请报告，且报告应该有承建单位技术负责人的签字。（2）验收准备工作前，承建单位需要补充提交给建设单位和监理单位的资料有：提供与验收相关的文档。提供与验收相关的软件配置内容。提供软件源代码及编译配置说明。·同时满足《国家电子政务工程建设项目验收大纲》中规定的验收条件。试题分析 本题考察的是信息应用系统验收阶段的监理内容和电子政务项目相关法律法规的内容。第一条可以从验收的前提和验收过程来解答。第二条可以从验收的准备工作内容来解答。1．提交验收的软件项目必须具备以下条件：1）已通过计算机软件确认测试评审。2）已通过系统测试评审。试题五 答案及解析【问题1】（5分）答案：（1）✓（2）x（3）✓（4）✓（5）x试题分析 本题考察的是软件测试监理的内容。1．监理单位在软件测试阶段主要检查承建单位是否按照设计中制定的规范与计划进行测试。但切忌由监理单位进行单元、集成或确认测试而取代开发方的内部测试，这种方法并不能保证工程的质量。2．可与客户和最终用户一同参与开发和评审测试准则。3．每当被测试软件或软件环境发生变化时，则在各有关的测试级别上适当进行回归测试。4．由一个独立于软件开发者的测试小组来计划和准备所需的测试用例和测试规程。【问题2】（5分）答案：系统测试阶段监理的主要活动包括：（1）审查系统测试环境。（2）监控系统测试过程及系统测试活动。（3）审查系统测试报告。（4）审查、确认系统测试过程中的软件问题报告和软件变更报告。（5）审查回归测试的测试记录。试题分析 本题考察的是系统测试阶段监理的主要活动。\n监理规划主要内容 | 监理细则主要内容工程项目概况、监理范围、内容与目标、监理项目部的组织形式、监理项目部的人员配备计划、监理项目部的人员岗位职责、监理依据、监理工作程序、监理工作方法及措施、监理工作制度、监理工具和设施等 | 工程专业的特点、监理流程、监理的控制要点及目标、监理方法及措施级别项目 | A级 | A级 | B级级别项目 | 夏季 | 冬季 | 全年温度 | 23±2℃ | 20±2℃ | 1828℃相对湿度 | 45%65% | 45%65% | 40%70%温度变化率 | ＜5℃／h并不得结露 | ＜5℃／h并不得结露 | ＜10℃／h并不得结露品种 | 卡片 | 纸带 | 磁带 | 磁带 | 磁盘 | 磁盘品种 | 卡片 | 纸带 | 长期保存并记录的 | 未记录的 | 已记录的 | 未记录的温度 | 540℃ |  | 1828℃ | 040℃ | 1828℃ | 040℃相对湿度 | 3070% | 40%~70% | 20%~80% | 20%~80% | 20%~80% | 20%~80%磁场强度 |  |  | <3200A/m | <4000A/m | <3200A/m | <4000A/m测试阶段开发阶段 | 单元测试 | 集成测试 | 确认测试 | 系统测试软件需求分析 | 无 | 无 | 完成确认测试计划 | 完成系统测试计划软件概要分析 | 无 | 完成软件集成测试计划 | 开始设计确认试用例、编写确认测试说明 | 开始设计系统测试用例、编写系统测试说明软件详细分析 | 完成软件单元测试计划 | 开始设计集成测试用例、编写集成测试说明 |  |软件编码 | 编写软件单元测试说明、执行软件单元测试、编写软件单元测试报告 |  |  |软件测试 | 无 | 完成集成测试说明、执行集成测试、进行测试分析、编写软件集成测试报告 | 完成软件确认测试说明、执行软件确认测试、进行测试分析、编写确认测试报告 | 完成系统测试说明、执行系统测试、进行测试分析、编写系统测试报告完成的工作 | 是否满足验收条件 | 原因项目大部分建设项目按照批准设计方案要 包合同既可以用一个总合同的形式，也可以用若干合同的形式来签订，例如业主单位分别与同一个承包人签订项目咨询、论证、硬件、网络和软件建设合同等。单项承包合同1.单项承包合同：指合同业主单位将不同的工作任务，单项承包分别发包给不同的承建单位，并与其签订相应的信合多人分蛋糕同。2.单项项目承包方式有利于吸引较多的承包商参与投标竞争，使业主单位有更大的选择余地，也有利于业主单位对信息系统工程的各个环节、各个阶段实施直接的监督管理。3.单项承包合同较适用于那些对项目建设有较强管理能力的业主单位(发包人)。4.在管理直接承包合同时应注意相应的禁止性规定，包括：①直接承包合同签订总承包合同，还是签订单项项目承郑房新包合同，可以由业主单位根据情况自行确定。但无论采取哪种形式，都不得签订支解承包合同。②民法典规定:发包人不得将应当由一个承包人完成的建设工程支解成若干部分发包给数个承包人。分包合同1.分包合同是指信息系统工程总承建单位承包某个信分包合同息系统项目以后，将其承包的某一部分或某几部分项总承包吃剩下的分出一块给其他人目，再发包给分包单位，与其签订承包合同项下的分包合同。2.民法典规定：总承包人或者勘察、设计、施工承包人经发包人同意，可以将自己承包的部分工作交由第三人完成。3.第三人就其完成的工作成果与总承包人或者勘察、设计、施工承包人向发包人承担连带责任。4.这里有两个合同法律关系，一个是业主单位与总承建单位的承包合同关系，另一个是总承分包合同关系。11\n监理案例专题监理Q群423649123高项Q群1136743739中项Q群2128629405.总承建单位在原承包合同范围内向业主单位负责，分责任包单位与总承建单位在分包合同范围内向业主单位承担连带责任。因分包的项目出现问题，业主单位既可以要求总承建单位承担责任，也可以直接要求分包单位承担责任。①不正确（1分）。理由：因为承建单位应对分包单位的工程质量问题承担连带责任（1分）。6.签订分包合同应当同时具备两个条件：重要性☆☆☆①总承建单位只能将自己承包的部分项目分包给具有资质相应资质条件的分包单位;②分包项目必须经过业主单位同意分包合同有一些禁止性规定，具体如下:重要性☆☆☆☆①禁止转包（甩手掌柜②禁止承包人将工程分包给不具备相应资质条件的单禁止转包位。（②和③感觉重了）③禁止将项目分包给不具备相应资质条件的单位。（②和③感觉重了）④禁止再分包③禁止分包主体结构。\n①禁止转包（甩手掌柜所谓转包，是指承建单位将其承包的全部信息系统工程建设倒手转让给第三人，使该第三人实际上成为该建设项目新的承建单位的行为。民法典规定:承包人不得将其承包的全部建设工程转包给第三人或者将其承包的全部建设工程支解以后以分包的名义分别转包给第三人。②禁止承包人将工程分包给不具备相应资质条件的单位。③禁止将项目分包给不具备相应资质条件的单位。所谓郑房新相应的资质条件是指:有符合国家规定的民事主体;有相应的专业技术人员;有相应的技术装备;符合法律法规规定的其他条件。①禁止再分包。民法典规定：禁止分包单位将其承包的工程再分包。即承建单位只能在其承包项目的范围内分包一次，分包人不得再次向他人分包。5禁止分包主体结构。民法典规定:建设工程主体结构的施工必须由承包人自行完成。信息系统工程主体结构的实施必须由承建单位自行完成，不得向他人分包，否则签订的合同属于无效合同。12\n监理Q群423649123高项Q群1136743739中项Q群212862940监理案例专题案例专题课-02（郑房新老师今晚20：45开播","content_length":28358},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"2021年11月试题一","score":null,"content":"题目一(改编自2021年11月试题一)阅读下列说明，回答问愿1至问题3，将解管填入答题纸的对应栏内·【说明】为推进“互联网+政务\"工作,高效便捷地服务全国各类企业及公众,国家某部拟开发一套称动版APP.大实时推送企业信息，方便公众快速了解。建设单位将开发及上线交给系统集成公司A，委托监理单位B监理全部过程，并分别签订了建设合同及监理合同。项目于2021年10月建成，组织了竣工验收工作。【事件1】项目批复概算总投资招资4300万，验收时尚有部分设备节余、部分款项待收付。B单位（监理单位）郑房新老师汇编了项目竣工结算系列报表。竣工结算金额为5000万。监理工程师对该项目进行了质量控制，进度控制和投资控制。【问题1】（3分答对1点得1分，答错多答不扣分，最多得3分)最基础的监理内容被概括为“三控、两管、一协调”，请补充说明，监理工程师工作内容还有 容和种类符合相关标准。（1分验收阶段 万金油)(验收阶段监理内容：初试终其)④项目初验的监理。（1分验收阶段万金油）③系统试运行的监理。（1分验收阶段万金油)③项目终验的监理。（1分验收阶段万金油）验收阶段其他监理内容。（1分验收阶段万金油）③初验条件的检查。（1分初验万金油）③初验前的监理准备工作。（1分初验万金油）初验中的监理工作。（（1分初验万金油）①初验验收会议的监理工作（1分初验万金油）②试运行结束后，建议用户出具用户使用意见，要求承建单位出具试运行报告和试运行期间的问题总结报告(若有问题未解决，可作为试运行时间延长的依据）。（1分试运行万金油)③如果符合如下终验条件，在终验申请中予以签认，并报业主单位签认：（1分终验万金油）④协助业主单位审核承建单位提交的终验计划及其方案，明确验收目标、各方责任、验收内容、验收标准、验收方式和验收结果等内容，并签署审核意见。（1分 终验万金油)第2版》（郑房新老师点评）《信息系统监理师教程第464页【知识点出处】第2版》20.5 验收阶段监理基础工作监理流程《信息系统监理师教程第464页20.5.1验收阶段监理要求《信息系统监理师教程第2版》第464页序号内容 2345608901234561892例子验收阶段1.验收阶段的监理要求具体包括：【知识点出处】\n监理案例专题监理Q群423649123高项Q群1136743739中项Q群212862940监理要求①应审核项目测试验收方案(验收目标、双方责任、验收提交清单、验收标准、验收方式、验收环境等)的符合性及可行性;②应协调承建单位配合第三方测试机构进行项目系统测评；③应促使项目的最终功能和性能符合承建合同、法律法规和标准的要求④应促使承建单位所提供的项目各阶段形成的技术、管理文档的内容和种类符合相关标准。《信息系统监理师教程 第2版》20.5.2 验收阶段监理内容第464页序号监理内容内容 0234560890123456192例子管理工作1.一般情况下，项目验收中的管理工作包括项目初验、系统试运行和项目终验。：【知识点出处】①项目初验的监理②系统试运行的监理③项目终验的监理④验收阶段其他监理内容项目初验的监理1.项目初验，即初步验收，是指项目完成合同要求的全部内容后，对该项目是否符合设计要求、施工和设备安装是否符合质量要求等进行全面检测的过程。项目初验的监理基础内容包括：：【知识点出处】①初验条件的检查②初验前的监理准备工作。③初验中的监理工作。①初验验收会议的监理工作：协助业主单位安排会场(例如签到表、会签等);按会议议程执行;做好记录;会议纪要和验收报告落实签字。系统试运行的监1.系统试运行的监理基础内容包括:①要求业主单位、承建单位以初验合格报告作为启动试运行的依据。②审核承建单位的试运行申请，若符合条件，协调三方允许系统进入试运行阶段。③有计划地监督系统的试运行，督促承建单位解决试运行中出现的问题。④跟踪承建单位现场人员是否到位并正常工作。③定时或不定时了解用户对现场人员是否满意，若有问题，核实后可房新对承建单位提出要求。③抽查承建单位现场人员的工作记录(解决用户问题），对问题比较集中、有未解决的问题、有部分工作量调整的情况做好记录，根据实际情况可召开三方会议讨论解决方法、时间等。③督促承建单位及时解决出现的问题③根据初验前备忘录的内容，核实承建单位落实情况。③试运行结束后，建议用户出具用户使用意见，要求承建单位出具试运行报告和试运行期间的问题总结报告（若有问题未解决，可作为试运行时间延长的依据）。项目终验的监理1.项目终验也称工验收，是指在通过初验并试运行合格后，对项目的总体进行检测和认证、综合评价和鉴定的活动。项目终验的监理基础内容包括【知识点出处】（1）协助业主单位审核承建单位提交的终验计划及其方案，明确验收目标、各方责任、验收内容、验收标准、验收方式和验收结果等内容，并签署审核意见。(2）及时处理承建单位提交的终验申请，根据承建合同有关条款，核\n监理案例专题监理Q群423649123高项Q群1136743739中项Q群212862940实实际情况是否满足终验要求。(3）如果符合如下终验条件，在终验申请中予以签认，并报业主单位签认：●项目建设内容按照合同要求全部完成：各种技术文档和验收资料完备;系统的功能和性能满足设计要求;系统已通过初验、试运行，用户出具了初验和试运行意见；初验和试运行中出现的问题已经得到解决；试运行时间符合承建合同的要求；完成了约定的培训工作，培训效果符合要求；承建单位提交了符合要求的终验方案和计划，并且已通过审核；业主单位同意进行终验。(4）如果不符合上述终验条件，向承建单位提出整改意见（若此时由于某些客观原因还有未完成的事项，需协调三方事先做好沟通，承建单位签好承诺书）。(5）协调项目相关方确定终验方案（含承建单位总结报告）及终验形式(三方会议或专家会议)、参与人员、议程等(6）协助业主单位做好终验准备、组织项目终验;对于大型或重要信息系统工程建设项目，应业主单位要求，可以聘请有关专家参与终验评审，以评估项目完成情况。(7）准备好监理的发言材料（监理总结报告）。(8）根据已定的验收议程召开会议，做好记录，会议纪要和验收报告落实签字。(9）三方签订终验合格报告，要求业主单位和承建单位以终验合格报告作为项目验收结束的依据。（10）项目终验后，审核承建单位的项目结算，可协助业主单位进行项目决算。（11）整理与项目有关的全部监理文档,并提交业主单位。(12）协助业主单位和承建单位完成项目移交工作。验收阶段其他监1.验收阶段的其他监理内容包括：：【知识点出处】理内容①对验收各阶段进度安排提出监理意见。②审核承建单位初验、终验和项目整改计划的可行性。③由总监理工程师审核承建单位提交的付款申请，根据承建合同规定的付款条件，签发工程款支付意见。①及时向业主单位、承建单位通报承建合同、协议及相关变更所规定项目内容的执行情况，提出监理意见，③协助业主单位与承建单位签署其他补充协议。③对于项目中的关键性技术指标，应要求承建单位出具第三方测试机构的测试报告。第三方测试机构应经业主单位和监理机构同意。③协助业主单位和承建单位做好对知识产权的管理工作。在项目终验前，监理机构应检查所完成的信息系统中，承建单位是否提供了非正版软件。如果提供了非正版软件，监理机构应要求承建单位进行整改并跟踪落实。③管理项目验收阶段的文档，例如验收方案、验收申请、验收报告等。③敦促业主单位、承建单位，按照约定编制、签署和保存验收阶段项目文档。督促业主单位、承建单位及时整理项目文档①督促承建单位完成承建合同及项目实施方案中确定的培训。34\n监理Q群423649123高项Q群1136743739中项Q群212862940监理案例专题案例专题课-03（郑房新老师今晚20：45开播","content_length":11511},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题四","score":null,"content":"题目四(改编自2016 年5月试题四)阅读下列说明，回答问题1至问题4，将解答填入答题纸的对应栏内。【说明】某事业单位需要在新建办公楼内建设办公网络系统，内容主要包括综合布线系统、网络机房建设等。建设方通过公开招标与承建单位签订合同。同时为了规范管理，建设方聘请了监理单位参与项目管理工作。【事件1】监理方协助开展了项目准备工作，审核了承建方提交的开工报审文档。监理工程师尤其重视通用布缆系统，因为通用布缆系统能支持广泛应用范围的结构化信息布缆系统，一般由双绞线、光缆、同轴电缆、无线等传输媒体组成。【问题1】（6分默写题答对1个得1分，最多得6分）针对【事件1】，请说出通用布缆系统工程实施阶段的监理内容包含哪些？【参考答案】通用布缆系统工程实施阶段的监理内容，如下：（背：实分准质验过1.工程实施组织设计方案的审核。（1分实施阶段 万金油）2.工程分包的审核。（1分实施阶段万金油)3.施工准备的审核。（1分实施阶段万金油)4.承建单位质量保证措施的审核。（1分 实施阶段万金油）5.线材、连接硬件验收。（1分实施阶段万金油）6.施工过程的监理。（1分实施阶段万金油）【郑房新老师点评】第2版》《信息系统监理师教程第485页【知识点出处】通用布缆系统工程《信息系统监理师教程 第2版》21.6.1 j第485页内容02345678901134561192序号通用布缆系统工程例子实施阶段监理内容.通用布缆系统工程实施阶段的监理内容具体如下：背：实分准质验1.工程实施组织设计方案的审核。2.工程分包的审核3.施工准备的审核。4.承建单位质量保证措施的审核5.线材、连接硬件验收6.施工过程的监理【事件2】项目施工过程中，监理方重点对综合布线系统施工工艺和质量进行把控，进行了隐蔽工程检查。为保证项目验收顺利进行，施工完成后，监理方要求进行网络布线测试工作。【问题2】（11分判断题答对1个得1分，最多得11分）针对（事件2，关于通用布缆系统工程，请判断以下说法是否正确，若正确打／，错误打×。35\n监理案例专题监理Q群423649123高项Q群1136743739中项Q群212862940①每个无线点的天线增益、高度、方位及信道的选择符合设计规范。（②天线架设位置应合适，接收发射信号方向上应无遮挡物，所有天线位置应距离避雷针超过200米，避免受避雷针影响。（③架设天线的支架或铁塔应与接地系统良好连接，天线接地电阻满足标准要求（④机架、配线箱等设备的规格、容 程序设计来创建测试用例，以确保程序能够按预期处理各种输入和边界条件。②黑盒测试又称为功能测试、数据驱动测试或规格测试。在这种测试中，测试人员不关心软件内部的实现细节，而是只关注程序的输入和输出结果。63\n监理案例专题监理Q群423649123高项Q群1136743739中项Q群212862940黑盒X=2y=4白盒y=2xX=2y=4房新10.4.2 测试《信息系统监理师教程第2版》第248页测试内容（例子测试1.测试是信息系统工程质量控制最重要的手段之一，这是由测试最直接依据信息系统工程的特点所决定的，信息系统工程一般由信息网你TM在代码络系统、信息资源系统、信息应用系统组成，而这些系统的里下了毒质量到底如何，往往需要通过实际的测试才能知道，因此测试结果是判断信息系统工程质量最直接的依据。2.在整个质量控制过程中，可能需要业主单位、承建单位、监理单位和第三方测试机构对工程进行测试。3.业主单位的测试是为了验证系统是否满足业务需求，承建单位的测试是为了保证工程质量和进度，监理单位的测试是为了检查和确认工程质量，第三方测试是对工程做出客观的质量评价。虽然各自的工作重点不同，但都是为了更好地控制项目质量。4.在测试过程中，监理工程师应关注以下内容:【知识点出①测试依据。②监督承建单位的测试工作。③亲自测试重要环节。④①第三方测试的监理测试依据测试依据根据不同的测试阶段和测试对象有所不同，主要包①需求说明书;②设计说明书；③行业和团体标准；④国家标准。监督承建1.监理工程师应监督评审承建单位的测试计划、测试方案、单位的测测试实施以及测试结果，主要包括以下内容：试工作①督促承建单位建立项目测试体系，成立独立的测试小组；②督促承建单位制订全过程的测试计划，从项目需求分析阶段开始，直到项目结束，要进行不间断地测试，并且随着项目进展，还要制订分系统的测试计划和详细测试方案;③对测试方案和测试计划进行审核，对承建单位选择的测试工具的有效性进行确认;④对测试结果的正确性进行审查;③对测试问题改进过程进行跟踪。64\n监理案例专题监理Q群423649123高项Q群1136743739中项Q群212862940亲自测试对重要环节，监理单位要亲自进行测试，主要包括以下内容：重要环节①现场抽查测试。当现场监理工程师发现质量疑点时，要进行现场抽查测试。例如，对于综合布线阶段，监理工程师除了在隐蔽工程实施过程中要旁站外，还要通过网络测试仪对布线质量进行抽测，以便能够分析网络综合布线的效果，可以有效保证网络综合布线的质量。另外，对于设备进货也要进行现场抽检。②对于软件开发项目，监理单位要对重要的功能、性能、安全性等进行模拟测试，判断阶段性开发成果是否满足质量要求，并且作为进度控制和成本控制的依据。第三方测1.在重要的里程碑阶段或验收阶段，往往要聘请专业的第三试的监理方测试机构对项目进行全面或专项测试。在此期间，监理单位的主要工作包括：①协助业主单位选择权威的第三方测试机构，一般应审查第三方测试机构的资质、测试经验以及承担该项目的测试工程师情况;②对第三方测试机构提交的测试计划进行确认;③协调承建单位、业主单位以及第三方测试机构的工作关系，并为第三方测试机构的工作提供必要的帮助①对测试问题和测试结果进行评估。【事件3】单位丙监督单位乙严格按照工程设计阶段所制定的进度计划、质量保证计划等进行开发工作。由于工期紧张，开发完成后，单位丙进行了集成和确认测试。【问题3】（3分）针对事件3，监理单位的做法是否正确（1分）？若不正确，请说明理由？（2分，答对1点得1分，最多得2分)【参考答案】(1）不正确。(1分）(2）理由:①测试工作不应该由监理单位执行，应由承建方完成。(1分）②缺少单元测试。（1分）③没有编制测试计划。（1分）①没有监督承建单位的测试工作。（1分)③没有亲自测试重要环节。（1分）③没有第三方测试的监理。（1分）应督促承建单位建立项目测试体系，成立独立的测试小组；（1分）③应督促承建单位制订全过程的测试计划（1分）③应对测试结果的正确性进行审查（1分）应对测试问题改进过程进行跟踪（1分）①应对测试方案和测试计划进行审核，对承建单位选择的测试工具的有效性进行确认；(1分)②应现场抽查测试（1分）③应对测试问题和测试结果进行评估。（1分）①应以需求说明书作为测试依据。（1分）应以设计说明书作为测试依据。（1分）应以合同要求作为测试依据。（1分）65\n监理Q群423649123高项Q群1136743739监理案例专题中项Q群212862940《信息系统监理师教程 第2版》（郑房新老师点评）第P248页【知识点出处】10.4.2 测试《信息系统监理师教程第2版》第248页测试内容023466089012134567892例子测试1.测试是信息系统工程质量控 投标文件及合同要求一致等。（4）设备经加电测试合格，并满足合同设备验收条款后，承建单位可以申请设备验收。案例专题课-07（郑房新老师今晚19：30开播题目七-02（改编自2014年11月 试题一)【说明】某企业信息系统工程项目，包含综合布线工程、网络工程、主机系统工程、企业业务软件开发工程等4个子项目。建设单位甲通过公开招标方式确定承建单位，某知名集团公司丁的全资子公司乙经过竞标，赢得工程合同。建设单位甲委托监理公司丙承担项目的监理工作，在项目实施过程中发生了如下事件：【事件1】工程正式开工之前，乙方项目经理对综合布线工程、网络工程、主机系统工程等子项目制订了详细的实施计划，由于工期较紧，计划安排综合布线工程与网络工程、主机系统工程并行实施，同时完成安装工作并进行加电联调达到要求后，报监理方签字认可。【事件2】在项目业务软件开发实施过程中，由于乙方未按要求投人所需的主要技术人员等原因，导致项目进度滞后,甲、丙方多次要求乙方尽快补齐所缺人员。迫于甲、丙方的一再督促,乙方在甲、丙方不知情的情况下，从母公司丁抽调多名资深技术人员加人到本项目的现场开发工作中。丙方在巡查中发现后向乙方发“停工令”，要求新加入人员所承担的工作暂时停工。乙方认为监理方的做法错误并影响了工程进度,并应该补偿由此造成的工期损失。【事件3】为了确保项目质量、及时发现问题，项目总体设计方案完成后，进入评审过程。甲、丙方对此非常重视，聘请了数位资深业务专家和信息化专家参加评审会。评审会由信息化专家主持，对总体设计方案进行讨论，得出了评审结论。会后，参会的几位监理工程师经过讨论，形成最终的监理意见。【事件1】工程正式开工之前，乙方项目经理对综合布线工程、网络工程、主机系统工程等子项目制订了详细的实施计划，由于工期较紧，计划安排综合布线工程与网络工程、主机系统工程并行实施，72\n监理案例专题‧郑房新老师监理Q群423649123高项Q群1136743739中项Q群212862940同时完成安装工作并进行加电联调达到要求后，报监理方签字认可。【问题1】作为监理工程师，你认为事件1中的安排合适吗？请说明理由。（2分是否合理1分，理由1分)【参考答案】①合理。（1分）②理由：三个子项目可以并行实施，并不存在严格的先后执行顺序。（1分）【事件2】①在项目业务软件开发实施过程中，由于乙方未按要求投人所需的主要技术人员等原因，导致项目进度滞后,甲、丙方（监理）多次要求乙方尽快补齐所缺人员。②迫于甲、丙方（监理）的一再督促,乙方在甲、丙方不知情的情况下，从母公司丁抽调多名资深技术人员加人到本项目的现场开发工作中。③丙方（监理）在巡查中发现后向乙方发“停工令”，要求新加入人员所承担的工作时停工④乙方认为监理方的做法错误并影响了工程进度,并应该补偿由此造成的工期损失。【问题2】在事件2中，作为监理工程师，请回答:（1）监理方的做法是错误的吗？请说出理由。（正确是否1分，理由1分）（2）乙方抽调人员的资质有问题吗？请说出理由。（是否有问题1分，理由1分）（3）应该给乙方相应的工期补偿吗？请说出理由。（是否1分，理由1分）【参考答案】(1)正确。理由:未经监理方审查的技术人员以及未持证上岗的技术人员不得进入现场进行开发工作。(2)有问题。理由:相关技术人员资格、资质未经监理方审查。(3)不应该【事件3】为了确保项目质量、及时发现问题，项目总体设计方案完成后，进入评审过程。甲、丙方对此非常重视，聘请了数位资深业务专家和信息化专家参加评审会。评审会由信息化专家主持，对总体设计方案进行讨论，得出了评审结论。会后，参会的几位监理工程师经过讨论，形成最终的监理意见。【问题3】请指出事件3中评审过程中存在的错误做法。【参考答案】（1）评审会应由总监理工程师主持（2）应由总监理工程师根据会审的结论，组织各专业监理工程师讨论，形成最终的监理意见，然后提交给建设单位和承建单位;（3）建设单位和承建单位根据监理意见进行处理，处理结果由监理工程师确认，报总监签发【事件4】在专题监理会议上，甲方现场负责人发言指出：由于甲方业务及其流程发生变化，要求在实施的应用软件功能方面做相应的变更。会后，乙方经过镇密的研究认为功能有增有减，总的工作量与原来差别不大，同意了甲方的变更要求并付诸实施。【问题4】73\n监理Q群423649123高项Q群1136743739中项Q群212862940监理案例专题（1）变更控制程序包括哪些步骤？（8分答对1点得1分 最多得8分）（2）通常监理在处理变更时应遵循哪些原则？（7分答对1点得1分最多得7分）【参考答案】背：了接初分（1）一般来说，变更控制程序包括以下步骤。确签监效①及时了解变化②接受变更申请③变更初审④变更分析与评估③确定变更方案郑房新③签发工程变更单并公布变更监控变更实施③ 的经验，自己独自一人编制了招标文件。然后，选定供应商后，就直接签订了合同。在实施阶段，监理工程师小郑认为只要做好质量控的监理即可。在评估阶段，监理工程师小郑只进行了服务验收方案的监理。由于之前合同签订，相关条款比较模糊，供应商就验收方案扯皮。表25-4 运维服务级别协议(SLA)示例代码服务项目服务内容服务频度交付方式交付成果001机房温湿度监控和管理机房温度和湿度巡检监控巡检：2 次/天现场《巡检报告》异常情况应急处理发生异常情况时《服务事件记录》《故障报告》002机房强电线路监控和管理机房强电线路巡检监控巡检：2 次/天现场《巡检报告》异常情况应急处理发生异常情况时《服务事件记录》《故障报告》强电线路定期维护，包括线路检查、线路梳理等定期维护：2 次/年《强电线路定期维护报告》003机房空调运行监控和管理空调运行情况巡检监控巡检：2 次/天现场《巡检报告》空调定期维护，包括健康检查、主机除尘、更换清洗过滤网加湿罐等定期维护：1 次/月《空调定期维护报告》故障应急处理发生故障时《服务事件记录》《故障报告》【事件1】通过研究和实践，在信息化建设监理规范约定的“三控、两管、一协调”的基础上，结合运行维护监理服务的实际工作，总结出了“四控、五管、一协调”的运行维护监理方法论。\n监理案例专题监理Q 群423649123 高项Q 群1136743739中项Q 群2128629402【问题1】请写出“四控、五管、一协调”的运行维护监理方法论包含哪些。（5 分答对1 个得1分，不超过200 字）【参考答案】①质量控制②进度控制③投资控制④安全控制⑤合同管理⑥文档资料管理⑦配置管理⑧应急管理⑨效能管理⑩组织协调。【郑房新老师点评】《信息系统监理师教程第2 版》第579 页小郑口诀：至今投案何文佩姬萧条：质量-进度-投资-安全-合同-文档-配置-应急-效能-协调）【问题2】请问监理工程师小郑的在信息系统运行维护监理工作中，存在哪些问题或者缺失的地方？（5 分答对1 个得1 分，不超过400 字）【参考答案】1.招标阶段，独自一人编制招标文件存在问题，应该先沟通，做需求调研2.实施阶段，只要做好质量控的监理即可存在问题，应涵盖“四控、五管、一协调”。3.评估阶段，只进行了服务验收方案的监理，存在问题，还应该服务验收过程的监理，运行维护服务评估报告的监理。4.合同的签订过程存在问题，相关条款比较模糊，供应商就验收方案扯皮。5.招标阶段，应明确运行维护需求。6.招标阶段，应协助业主单位招标7.招标阶段，合同及SLA 监理8. 实施阶段，投资控制存在问题/缺失。9.实施阶段，合同管理存在问题/缺失。10.实施阶段，信息管理存在问题/缺失。11.实施阶段，组织协调存在问题/缺失。12.实施阶段，变更控制存在问题/缺失。13 合同谈判存在问题/缺失14.合同的签订过程存在问题/缺失15.评估阶段，还应该有服务验收过程的监理16.评估阶段，还应该有运行维护服务评估报告的监理。的监理【郑房新老师点评】《信息系统监理师教程第2 版》第579 页- 第600 页找错改错，优先在原文中找，然后再无中生有找确定的一些补充，最后再用万能答案。\n监理案例专题监理Q 群423649123 高项Q 群1136743739中项Q 群2128629403【问题3】判断题。（5 分答对1 个得1 分）请判断以下基础设施类运行维护服务的监理要点说法是否正确，若正确打√，错误打×。（1）例行操作监理，要对设施监控的不间断性、问题汇报和分析的及时性进行监督。（）（2）响应支持监理，检查运维服务提供方的响应支持服务与运行维护SLA 的符合性;（）（3）响应支持监理，对服务商响应支持服务中存在的问题，应该在服务结束时提出。（）（4）优化改善监理，宜对优化改善建议报告进行审核，报告无需区分不同的优化改善类型，只需要完整罗列，评估报告内容的合理性并向用户提出合理建议。（）（5）调研评估监理，持续跟踪调研评估的执行和评估结果的改进情况;（）【郑房新老师点评】《信息系统监理师教程第2 版》第579 页- 第600 页（1）√（2）√（3）× 存在的问题及时提出纠正和改进建议（4）× 报告应区分不同的优化改善类型(适应性改进、纠正性改进、改善性改进、预防性改进)（5）√\n案例专题003（V1.1）\n监理Q群423649123高项Q群1136743739中项Q群212862940监理案例专题郑房新老师寄语：由于时间仓促，精力有限，很多时候，要备课，要讲课，每天只能睡6个小时，难免有不足之处，如有发现有错误，请联系我，我后续也会补充和修正。苦心人，天不负，三千越甲可吞吴！加油！一切皆有可能！只要能坚持学习的，一定都能考过！---作者：郑房新老师2025年广东清远案例专题课-14（郑房新老师今晚2 function escapeHtml(t) { return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function highlight(t, q) { if(!q) return escapeHtml(t); const r = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")","gi"); return escapeHtml(t).replace(r,'<mark>$1</mark>'); }

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();

  list.innerHTML = '';
  let count = 0;
  data.forEach((item, idx) => {
