分）\n请指出老黄对软件编码规范提出的整改要求中的不当之处，并说明原因。\n对软件编码规范提出的整改要求的不当之处如下：\n（1）名称不是越长越好，应当选择精炼的、意义明确的名称，必要时可使用缩写名称，但这时要注意缩写规则要一致，并且要给每一个名称加注释。\n（2）程序中的注释是程序员与日后的程序读者之间的重要沟通桥梁。一些正规的程序文本中注释行的数量占到整个源程序的三分之一或更多。注释分为序言性注释和功能性注释。\n（3）除非对效率有特殊的要求，程序编写要清晰第一，效率第二。\n【问题3】（4分）\n软件配置管理监理的目标包括哪些？\n软件配置管理监理的目标包括：①确保软件配置管理活动是有计划的；②确保所选择的软件工作产品（各阶段成果）是经过标识、受到控制并具有可用性的；③所标识的软件工作产品的更改是受控的；④可及时了解软件基线的状态和内容。\n【问题4】（4分）\n编制良好的需求规格说明书应满足一定的原则，请判断下列需求规格说明书的编制原则或相关描述是否正确。（正确打✓，错误打X）\n需求规格说明书中的“实现”应与“功能”分离，描述“怎样实现”而不是“做什么”。（）\n（1）需求规格说明书中的功能与实现分离，是指描述要“做什么”，而不是“怎样实现”。\n需求规格说明书应使用面向对象的规格说明语言。（ ）\n（2）需求规格说明书中就使用面向处理的规格说明语言，来说明来自环境的各种输入有可能会导致系统做出什么样的功能性反应，以此来定义出行为模型，从而得到“做什么”的规格说明。\n（3）对某信息系统的子系统，需要描述与其他子系统交互的方式。（）\n（4）需求规格说明书是对系统自身的需求描述，不需要包括系统运行的环境。（）\n（4）需求规格说明书中必须包括系统运行的环境。\n（5）需求规格说明书必须是一个认识的模型，而不是设计的模型。（）\n（6）需求规格说明书必须是可操作的，能够用它来判定已提出的实现方案是否能够满足规格说明（）\n（7）需求规格说明书应考虑周全，不允许存在不完备性。（）\n（7）需求规格说明书中必须容许不完备性并允许扩充。\n（8）需求规格说明书应松散地构造，以便能很容易地加入和删去一些段落。（）","content_length":1470},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题三","score":14,"content":"试题三（14分）\n阅读下列说明，回答【问题1】至【问题3】，将解答填入答题纸的对应栏内。\n【说明】\n某炼油化工厂计划建设一套智能监控系统。期望实现：按需智能巡视场所安全；智能识别仪器读数和开关位置；提升巡视频率和质量。由于系统对网络传输、数据仓库、数据挖掘要求较高，该厂准备先搭建一个性能卓越的信息网络系统。\n该厂选择A公司作为承建单位，委托监理单位B监理全部建设过程，在项目实施过程中，发生如下事件：\n【事件1】A公司在应用服务器选型时，考虑了如下内容：①服务器产品成熟，应以最低价中标方式招标：②应用系统的运算模型以OLAP为主；③应用服务器应支持串行数据库；可以采用MTBF值衡量系统可靠性；④主要参考服务器的TPC-C指标。\n【事件2】在机房电源系统设计时，监理工程师小刘建议电源规格应满足电压 180-264V，AC，频率47-63Hz，其他单一谐波不得高于5％。在计算电源稳压器的容量时，应为各设备总容量之和。为减少布线量和电源节点，机房电源与窗型冷气机、复印机等小型用电设备应共用同一地线，机房内设置的供维修人员使用的普通插座可以与机房电源系统共用电源。配电箱的位置应当注意安全，远离机房。\n【问题1】（4分）\n针对事件1，请指出A单位在应用服务器选型时考虑的内容中，哪两项是正确的（答案多于两项不得分）。\n应用系统的运算模型以OLAP为主；可以采用MTBF值衡量系统可靠性\n【问题2】（5分）\n针对事件2，请指出小刘对机房电源系统设计建议中的不当之处，并给出正确的做法。\n小刘对机房电源系统设计建议中的不正确之处有：①其他单一谐波不得高于5％，错误。应不得高于3％：②电源稳压器容量计算时应为各设备总容量之和，错误。应再加30％安全容量：③机房电源与窗型冷气机、复印机等小型用电设备应共用同一地线，错误。这些设备不得共用同一地线，以免互相干扰：④机房内设置的供维修人员使用的普通插座可以与机房电源系统共用电源，错误。维修用插座应该单独设置：⑤配电箱的位置应当注意安全，远离机房，错误。配电箱应尽量靠近机房，并且便于操作。\n【问题3】（5分）\n在进行信息网络系统的整体规划及设计评审时，小刘根据实际情况考虑了以下内容，请判断其是否正确。（正确打的✓，错误打的x）\n（1）网络设计方案应符合安全性原则，安全性是指设备、技术层次的安全。（）\n（2）网络设计方案的设计、规划、设备选型符合当前的需求即可。（）\n（3）网络系统设计和设备选型要兼顾先进性和实用性。（）\n（4）网络路由和交换设备兼容性是否良好，骨干网是否具备自愈能力。（\t)\n（5）IP地址规划应符合业主的组织结构，并能反映出组织上的从属关系。（）","content_length":1109},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题一","score":13,"content":"试题一（13分）\n阅读下列说明，回答【问题1】至【问题3】，将解答填入答题纸的对应栏内。\n【说明】某企业计划新建一个异地备份机房，用于备份企业的业务运营数据、信息资源服务数据、历史记录等信息，以确保业务的连续性。\n【问题1】（5分）\n除机房装修、机房屏蔽及防静电系统、机房安保／安防系统外，机房建设还应包括哪些子系统？\n【问题2】（5分）\n以下关于A级机房内温湿度控制要求的描述，请判断是否正确（正确打✓，错误打x）。\n（1）夏季开机温度应控制在21～25℃之间。\t\t\t\t( )\n（2）开机时湿度应控制在40％～80％之间。\t\t\t\t\t( )\n（3）温度变化率＜5℃／h并不得结露。\t\t\t\t\t\t\t()\n（4）常用记录介质库的温、湿度应与基本工作间相同。\t\t( )\n（5）主机房内的空气含尘浓度，在静态条件下测试，每升空气中大于或等于0.5μm的尘粒数应少于18000粒。\t\t\t\t\t\t\t\t\t\t\t\t\t\t( )\n【问题3】（3分）\n请将（1）～（3）的正确选项填写在答题纸的对应栏内。\n（1）当主机房与备份机房两地间距1500公里时，实现业务运营系统数据的实时复制，宜采用（）模式。\nA.同步数据复制\nB.异步数据复制\nC.定期复制\n（2）成本最低、系统恢复时间最长的灾难恢复方式是（）。\nC.数据备份系统\n（3）为进一步降低成本，监理工程师建议历史记录系统的灾备机房只设置用于信息处理的基础物理环境（如电线、空调、地板等），灾难发生时其它设备再运送到站点上，从基础开始安装。这种灾备站点的类型是（）。\nA.热站\nB.冷站\nC.温站","content_length":662},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题二","score":16,"content":"试题二（16分）\n阅读下列说明，回答【问题1】至【问题4】，将解答填入答题纸的对应栏内。\n【说明】某石油公司A拟建设高性能勘探计算管理平台，包括大数据智能分析、集群任务调度管理和并行文件管理等子系统，平台的功能、业务性能、存储方式等关键需求不明确，且数据分析子系统运用人工智能技术，预估采购活动相当复杂，A公司委托监理公司B协助招标，在招标阶段陆续发生如下事件：\n【事件1】A公司聘请专业咨询公司详细梳理并确定需求后，决定先对并行文件管理子系统进行招标，并编制了可行性研究报告作为招标依据。\n【事件2】B公司监理工程师根据招投标法，推荐了招标方式。\n【事件3】B公司建议招标审核资质时，重点审核投标单位是否具有质量管理体系、软件能力成熟度是否达到优化级（即能够持续不断地改进过程）。\n【事件4】A公司发布了招标公告，声明：项目于4月1日开标，开标地点为A公司总部，开标当日确定中标候选人。招标文件公示了投标资格、评标标准、评标委员会名单等内容。评标委员会共7人，包括A公司代表2人、B公司代表2人，其余为经济、技术专家。评标完成后，评标委员会确定C公司中标，4月4日发出了中标通知书。5月15日，A公司与中标人订立了书面合同。中标人经A公司同意，将其中部分功能模块分包给另一家单位，中标人告知分包单位务必保证开发质量，出了问题由分包单位向招标人负全责。\n【问题1】（4分）\n针对事件1，请说明可行性研究主要包含哪几个方面？\n【问题2】（5分）\n针对事件2，请给出监理工程师可以推荐的招标方式，并说明理由。\n【问题3】（2分）\n请将（1）、（2）的正确选项填写在答题纸的对应栏内。\n针对事件3，中标单位应具备质量管理体系（1）要求的认证，应达到软件能力成熟度（2）级别。\nA. ISO9001\nE. CMMI2\nB. ISO14001\nF. CMMI3\nC. ISO20001\nG. CMMI4\nD. ISO27001\nH. CMMI5\n【问题4】（5分）\n针对事件4，请指出招标过程中存在的问题。","content_length":848},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题四","score":17,"content":"试题四（17分）\n阅读下列说明，回答【问题1】至【问题3】，将解答填入答题纸的对应栏内。\n【说明】某大型物流公司A为优化实物快递网络，拟建立专业仿真系统，提供快递处理中心仿真服务。企业通过招标确定了监理公司B和软件公司C，要求B公司对软件生命周期进行全过程监理，帮助用户建设一个高质量的、具有可持续生命力的软件系统。\n【事件1】在软件开发进行前，C公司编制了《质量保证计划》，内容如下：\n（1）工程必要的背景说明，包括编写目的、背景、定义、参考资料等。\n（2）规定了所要进行的技术和管理两方面的评审和检查工作，编制了评审和检查规程，制定了通过与否的检查标准。\n（3）指明了用以支持特定软件项目质量保证工作的工具、技术、方法。\n（4）包含了对子项目承建单位的控制说明。\nB公司监理工程师审查《质量保证计划》后，认为其符合ISO／IEC20000-1的要求，内容充分详实，判定审查通过。\n【事件2】在软件开发阶段后期，C公司申请系统验收，监理工程师收到C公司提交的验收标准、验收方案后，立即着手实施验收工作。验收完成后，监理工程师收集了测试报告、系统验收报告，完成\n了本阶段的监理工作。\n【事件3】进入项目验收阶段，A公司与B公司协调成立了专门的验收委员会及验收测试组。验收测试组的验收原则如下：\n（1）原有测试和审核结果凡可用的就利用，不必重做该项测试或审核。\n（2）B公司负责制定验收测试计划，验收测试组负责测试实施。\n（3）验收测试组的任务是验证软件功能和接口与设计文档具有一致性。\n（4）验收测试和配置审核是验收评审前必须完成的两项主要检查工作。\n【问题1】（8分）\n（1）针对事件1，请判断监理工程师针对质量保证计划“内容充分详实”的审查结论是否正确，如不正确请补充说明。\n（2）针对事件1，请判断监理工程师审查过程是否合理，并说明理由。\n【问题2】（5分）\n针对事件2，请指出监理工程师的监理工作是否完整，并说明理由。\n【问题3】（4分）\n针对事件3，请判断验收测试组的验收原则是否正确。（正确打✓，错误打x）","content_length":859},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题五","score":15,"content":"试题五（15分）\n阅读下列说明，回答【问题1】至【问题3】，将解答填入答题纸的对应栏内。\n【说明】某天体物理中心A委托承建单位C建立分布式高性能计算系统，对宇宙辐射进行大规模数值模拟及分析，要求监理公司B在各测试阶段务必加强监理力度，确保系统性能。\n【问题1】（4分）\n网络铺设完成后，在光纤测试中C单位选择的测试方法可以包括（）。（将正确的4个选项填写在答题纸的对应栏内）\nA.连通性测试\nE.端-端损耗测试\nB.特性阻抗\nF.反射损耗测试\nC.收发功率测试\nG.回波损耗\nD.接线图\nH.电缆近端串扰\n【问题2】（6分）\n考虑到系统需要采用可靠、稳定的高性能服务器，B公司的监理工程师小李在服务器安装时全程旁站，重点监理了以下内容，请判断该监理做法是否正确。（正确打、错误打x）\n（1）机架、服务器的排列位置和设备朝向都应按机房管理员要求安装。\t\t\t\t( )\n（2）机架和设备前应预留1米的过道，以便施工和维护。\n( )\n（3）金属钢管、槽道与地线连接处的接地垫圈必须一次装好，不得将已装过的垫圈取下重复使用。\n（4）接线头必须进行焊锡处理，保证接线端接触良好，不易氧化。\n( )\n( )\n（5）监视器安装位置应保证屏幕获得充分光照，便于管理员查看。\t\t\t\t\t( )\n（6）采用屏蔽结构的缆线时，应剥除屏蔽层，按设计做好接地。\n【问题3】（5分）\n软件测试穿插在软件开发全过程中，请将下列（1）～（5）对应的所属开发阶段选项填入答题纸对应栏内。\n（1）完成软件集成测试计划\t\t\t( )\n（2）完成软件单元测试计划\n( )\n（3）完成确认测试计划\t\t\t\t( )\n（4）完成系统测试计划\t\t\t\t( )\n（5）执行软件单元测试\t\t\t)\nA.需求分析阶段\nD.编码阶段\nB.概要设计阶段\nE.测试阶段\nC.详细设计阶段\n2020年11月份下午真题","content_length":771},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题一","score":20,"content":"试题一（20分）\n阅读下列说明，回答【问题1】至【问题4】，将解答填入答题纸的对应栏内。\n【说明】某国有企业集团公司希望进行XX信息系统项目工程建设，包括网络建设、机房系统建设、软件开发等多个项目，为此通过公开招标的方式与承建单位签订了项目建设合同，并发生了如下事件。\n【事件1】为了方便沟通并且节省资金，总公司领导直接指定了本企业下属某监理公司来担任本次项目的监理工作，同时，安排了该公司老王担任本次监理单位的总监理工程师，在施工过程中老王将系统开发单位的商业秘密在饭桌上谈论，认为都是本单位同事，相互交流更有利于工作的开展。\n为了体现自己的价值，保证项目质量，同时得到公司领导的赏识，老王亲自带领监理人员开展测试工作，并在系统实施过程中多次偏袒甲方单位，引起系统集成承建商的不满，最终项目在多种冲突中完成。\n【事件2】在系统设计过程中，老王组织现场监理工程师对系统集成承建单位编制的工程项目总进度计划进行了评审，对系统设计方案进行了签认，承建单位将主要设备，材料清单报于监理单位进行审核。\n【事件3】下表为施工过程中，承建方提交的截止到6月时的绩效报告。\n【事件4】由于集团公司的要求，项目实施过程中，软件开发需求一变再变，为了保证项目的顺利开展，三方一致决定严格按照变更流程来进行控制。\n【问题1】（5分）\n针对【事件1】，从监理单位和监理人员的权利和义务两方面分别指出信息系统实施过程中存在的问题有哪些？\n【问题2】（6分）\n请根据【事件2】说明在设计阶段监理工作的主要内容有哪些？\n【问题3】（4分）\n请根据【事件3】的绩效报告中的CPI数据，分析项目当前的绩效情况，并说出原因。\n【问题4】（5分）\n根据【事件4】，请写出变更控制的原则有哪些？","content_length":728},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题二","score":15,"content":"试题二（15分）\n某建设单位为了提高公司整体运行效率，拟进行XX服务平台的升级改造工作，通过公开招标的方式选择了监理方与承建方，在项目开发的过程中发生了如下事件：\n【事件1】在准备验收时，承建单位完成了如下工作后进行验收：\n·项目大部分建设项目按照批准的设计方案的要求建成并可以使用。\n·部分分项工程初验合格。\n·技术文档和相关资料基本完备。\n·采购的操作系统、数据库、应用软件等符合相关政策的要求。\n·各种设备加电试运行正常。\n【事件2】在项目开发的过程中监理方与承建方对确认验收的内容出现了分歧，双方各执一词，争论不休。\n【事件3】因本项目实施时间非常紧张，为了追赶进度，建设方与监理方多次讨论验收方案，并最终确认了大致能满足项目要求的验收方案，按这个方案执行可以大幅减少返工率，达到快速完成项目的要求。\n【问题1】（5分）\n请根据上述内容，填写下表，承建单位是否满足网络系统验收的条件，并简要写出原因。\n【问题2】（4分）\n作为监理工程师的你请写出确认验收的基本条件具体包括哪些内容？\n【问题3】（3分）\n针对【事件3】，请指出在验收方案的制定方面存在哪些问题？\n【问题4】（3分）\n请写出验收阶段监理需要审核的内容有哪些？","content_length":515},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题一","score":20,"content":"试题一（20分）\n阅读下列说明，回答问题1至问题4，将解答填入答题纸的对应栏内。\n【说明】\n为提升金融机构现金处理效率，降低现金综合运营成本，某省级银行拟建设区域现金中心管理系统，以实现现金处理集约化、数据集中化和监管全程化。建设单位与承建单位A签订了建设合同，与监理单位B签订了监理合同。在项目建设过程中发生了如下事件：\n【事件1】系统需求分析阶段结束后，承建单位A向监理工程师提交了项目需求小组编制并签章的《应用软件系统开发计划（初稿）》、《软件需求规格说明（初稿）》、《软件质量保证计划》、《软件配置管理计划》、《测试计划（初步）》、《用户使用说明（初稿）》，申请进入系统设计阶段。\n【事件2】建设单位对项目的成本控制特别关心，要求在成本、技术、进度三者之间综合平衡，保证各项工作在各自的预算范围内进行。\n【事件3】为提高代码质量，承建单位A的开发小组编制了《软件编码规范》，内容包括：\n（1）变量名称应完全体现变量用途，需使用英文完整单词，不得缩写。\n（2）为提高程序运行效率，不要在程序中写注释。\n（3）程序中数据说明的次序与语法无关，可以是任意的。\n（4）为了体现项目的编程水平，程序编写要做到效率第一，清晰第二。\n（5）输入输出的方式、格式应尽可能方便用户使用。\n（6）对所有的输入数据都要进行检验，保证每个数据的有效性。\n【事件4】数据报表子系统预计代码规模500000行。开发人员完成250000行代码时，承建单位A项目负责人上报该子系统开发进度完成50％。\n【问题1】（3分）对事件1，如果你是监理工程师，请依据分析阶段的监理控制要点，向承建单位提出你在监理过程中发现的问题。\n【问题2】（6分）针对事件2，作为监理工程师，你认为成本控制内容包括哪些方面？\n【问题3】（6分）针对事件3，作为监理工程师，请逐一指出这份《软件编码规范》的要求是否正确，不正确的请写出正确的做法。\n【问题4】（5分）针对事件4，作为监理工程师，你认为A单位的进度评估是否合理，为什么？","content_length":842},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题二","score":15,"content":"试题二（15分）\n阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。\n【说明】\n为推进“互联网＋政务服务”，某建设单位拟建设省级政务服务平台，要求平台能够支撑一网通办、汇聚数据信息、实现交换共享、强化动态监管。该单位通过公开招标，确定了承建单位和监理单位。\n在准备验收时，承建单位完成了如下工作：\n（1）采购了操作系统、数据库、应用软件等，均符合相关政策法规要求。\n（2）采购的设备已全部到货，经加电运行，状态正常。\n（3）项目大部分建设内容已按照批准的设计方案建设完成。\n（4）技术文档和验收资料基本完备。\n在项目验收阶段：\n（1）建设单位和监理单位共同确定了项目的验收方案。\n（2）建设单位和监理单位根据验收方案组建了验收组。\n（3）验收组按照验收工作程序完成初步验收，提交了正式的竣工验收申请。\n（4）验收组按照分项工程成立了测试（复核）小组、资料文档评审小组和工程质量鉴定小组。\n【问题1】（6分）针对案例中承建单位已完成的工作内容，请指出其不满足验收前提条件的地方。\n【问题2】（3分）基于以上案例，请问验收过程中的哪些做法是不正确的？\n【问题3】（6分）作为监理工程师，请指出各验收小组的具体工作内容。","content_length":513},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题三","score":15,"content":"试题三（15分）\n阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。\n【说明】\n某市拟建设城市供水全过程监管大数据平台，利用城市供水行业各企业及机构现存的海量信息，通过大数据手段进行分析预测、辅助决策，帮助政府部门实现城市供水全过程智慧化监管。建设单位委托承建单位A负责该系统的建设，委托监理单位B负责监理工作。\n【问题1】（4分）为了安全高效地存储、备份海量数据，请根据建设单位的系统需求（如下表所示），选择合适的存储及恢复技术类型（请将正确选项填写在答题纸的对应栏内）。\n【问题2】（6分）针对下列工作内容，请填写适合的监理方法（请将下面1～4处的答案填写在答题纸的对应栏内）。\n【问题3】（5分）作为监理工程师，请判断下列内容是否正确（填写在答题纸的对应栏内，正确的选项填写“✓”，不正确的选项填写“x”）\n（1）主机房设计容纳设备20台，设备尚未选型，主机房的面积是100平米。\n（2）开机时，主机房夏季设计适宜温度为26℃，湿度是50。\n（3）敷设的光缆在室内布线时要走线槽，拐弯半径35cm。\n（4）有一处管道设计在沼泽地处，设计方法选择是现场浇灌水泥管道。\n（5）管理间、设备间的接地设计为：单个设备接地是1Ω，整个系统接地小于4Ω。","content_length":530},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题四","score":15,"content":"试题四（15分）\n阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。\n【说明】\n某省计划2020年初步建成信息共享的生态环境监测网络。通过招标，建设单位确认了A单位为承建单位，B单位为监理单位。\n随着项目建设任务的推进，B单位根据项目建设的总体进度计划，要求A单位在合同规定的时间节点，按监理要求提交正式的文档或软件，并根据相关标准审查文件。\n在项目实施过程中，发生了如下事件：\n【事件1】由于项目工期比较紧，A单位在需求调研没有全部完成且未与用户进行确认的情况下，开始了系统开发工作。监理工程师给A单位发了监理通知单，要求A单位尽快整改。\n【事件2】为了实现项目建设目标，当发现事件1所述的问题后，A单位邀请监理工程师担任工程承保人或保证人帮助监督实施质量。\n【问题1】（4分）在项目实施过程中，质量控制的方法包含哪些（请选择4个正确选项填写在答题纸的对应栏内）？\nA.挣值\nE.控制图\nB.帕累托图\nF.趋势分析\nC.香蕉图\nG.网络图\nD.决策树\nH.统计分析\n【问题2】（7分）\n（1）针对事件1，监理单位的做法是否合理？为什么？\n（2）针对世界2，A单位的想法是否可行，为什么？\n（3）结合事件2，你认为在项目中监理的责任范围是什么？\n【问题3】（4分）写出监理工作的主要内容。","content_length":550},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题五","score":10,"content":"试题五（10分）\n阅读下列说明，回答问题1至问题2，将解答填入答题纸的对应栏内。\n【说明】\n为了保证某信息化平台建设项目的实施质量，通过招标，建设单位确定了监理单位和承建单位。在实施过程中，监理单位配合完成了相关工作。\n【问题1】（6分）请判断如下监理相关工作是否合理。（填写在答题纸的对应栏内，正确的选项填写“✓”，不正确的选项填写“x”）\n（1）部分设备的配件不合格，监理督促承建单位与供货厂商联系更换。（）\n（2）监理在测试阶段对承建单位进行检查，确认承建单位是否按照设计中规定的测试规范与计划进行测试。（）\n（3）监理监督承建单位根据项目需求，对软件测试进行开发、维护、建立文档等。（）\n（4）监理监督承建单位依据项目定义的软件过程、计划确认测试。（）\n（5）从承建单位抽调开发人员与监理人员共同组成测试小组，共同计划和准备所需的测试用例和测试规程。（）\n（6）根据实际工作需要，监理对软件测试活动进行跟踪、审查和评估。（）\n【问题2】（4分）按照测试阶段的划分，软件测试由（1）测试、\t（2）测试、（3）测试、（4）测试组成。（请将（1）～（4）处的答案填写在答题纸的对应栏内）。\n2019年5月下午真题","content_length":507},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题一","score":20,"content":"试题一（20分）\n阅读下列说明，回答问题1至问题4，将解答填入答题纸（答题纸略）的对应栏内。\n【说明】南方X省试点建设重大自然灾害监测预警信息系统，计划部署50个PC监控终端和500个电子标签（RFID）。建设单位与承建单位签订了项目建设合同，与监理单位签订了项目监理合同。项目要求次年八月结束，在项目实施过程中发生如下事件：\n【事件1】由于项目的试点试验性，承建单位从3个厂商采购了不同型号的电子标签。电子标签全部到货后，监理工程师抽取了其中50个逐一检查，抽检比例、检查内容符合质量控制计划。监理工程师检查合格，在进货清单上签署“同意”后设备入库。一周后，承建单位又补充采购了10个电子标签。监理工程师按照抽检比例抽查了其中1个，检查合格后同意入库。\n【事件2】为有效掌握工程的实际进度，及时发现计划与实际的偏差，监理工程师小周在项目建设过程中绘制了下图。其中，曲线A是最早时间计划，曲线B是最迟时间计划，曲线N1是网络工程实际进度，曲线N2是软件开发实际进度。整个项目建设期间，小周始终严格记录并保管监理日志。\n【事件3】由于经费紧张，该项目要求严格控制成本。建设单位提出可以裁剪设计评审活动、减少专家支出、设备采购采取最低价中标策略；承建单位提出可以减少人员投入，延长工期到次年九月：监理单位提出谁实施谁负责，投资控制应由承建单位负全责。三方各执己见。\n【事件4】该项目完成系统设计后，南方几省突然发生严重冰灾。承建单位发现需要增加“极端气候”预警监控子系统，项目经理马上通过电话向监理工程师小周提出需求变更。小周感到事态严重，当即同意变更。项目经理立即组织人马加班加点全力投入研发工作。项目出现新增子系统与其他几个子系统不兼容的问题，最终超支并延期。\n【问题1】（6分）\n请指出事件1中监理工程师工作的疏漏之处，并给出正确做法。\n【问题2】（4分）\n针对事件2：（1）请给出监理工程师采用的进度控制方法，并分析七月时的项目进展情况。\n（2）如果你是监理工程师，请在小周的工作基础上进行补充完善。\n【问题3】（5分）\n针对事件3：（1）请写出监理在投资控制过程中应遵循的基本原则。\n（2）结合以上原则，三方的投资控制建议分别违反了哪一项？\n【问题4】（5分）\n作为项目监理工程师，如何对事件4进行变更控制？","content_length":957},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题二","score":15,"content":"试题二（15分）\n阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。\n【说明】某单位进行大型电子政务信息系统工程建设，总投资5000万元。建设单位分别与承建单位、监理单位签订了实施合同和监理合同。\n【事件1】承建单位在合同时间范围内完成了业务应用系统的代码开发工作，将软件源代码及编译\n配置说明文档提交建设单位和监理单位，准备验收工作。\n【事件2】承建单位向监理单位提交了验收申请。监理单位首先需要对其验收计划和验收方案进行审查。\n【事件3】建设单位准备组织验收委员会进行测试、验收。\n【问题1】（5分）\n针对事件1：（1）承建单位的做法是否合理？为什么？\n（2）验收准备工作前，承建单位需要补充提交给建设单位和监理单位的资料有哪些？\n【问题2】（5分）\n针对事件2，请指出监理单位对承建单位验收计划和验收方案进行审查的主要内容。\n【问题3】（5分）\n针对事件3，请从候选答案中选择一个正确选项，将该选项编号填入答题纸（答题纸略）对应栏内。\nD.控制流分析\n（2）软件集成测试由＿组织，软件开发组和软件测试组联合实施测试。\nD.第三方测试单位\nD.第三方测试单位\nD.验收测试\n（5）＿的目的在于通过与系统的需求定义做比较，发现软件与系统定义不符合的地方。\nA.单元测试\nB.集成测试\nC.系统测试\nD.验收测试","content_length":562},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题三","score":15,"content":"试题三（15分）\n阅读下列说明，回答问题1至问题3，蒋解答填入答题纸的对应栏内。\n【说明】某市卫生部门拟建立“基于人工智能的医学影像诊断云平台”。该平台每天从10家三级甲等医院获取病人的临床数据，智能分析后生成医学影像诊断知识库，共享给本市所有医疗机构。因病例数据涉及患者隐私，建设单位委托承建单位A为云平台搭建一个星型拓扑结构的专有信息网络系统，委托监理单位B承担信息网络系统的监理工作。\n【事件1】在对信息网络系统进行招标时，监理工程师协助建设单位制定了技术方案投标评分标准。\n【事件2】监理工程师应当了解《智能建筑设计标准》的要求，并据此监理综合布线系统的设计方案。\n【事件3】信息网络系统实施完成后，监理工程师协助建设单位对网络安全和网络管理平台组织了严格的测试验收。\n【问题1】（6分）\n针对事件1，请判断监理工程师设置的下列评分项或评分方法是否正确（正确的选项填写“✓”，不正确的选项填写“x”）\n（1）选用的技术路线（包括网络架构、网络安全体系、服务器）应当是主流的。（）\n（2）主要设备的价格应与当前的市场行情相符。（）\n（3）防火墙和入侵检测系统应相互独立，不具有联动性。（）\n（4）应重点考虑总体技术方案的适用性，把实际需求放第一位。（）\n（5）应当提供定性化的系统规划方法，确保网络交换机、服务器、存储系统、备份系统的配置规划合理。（）\n（6）对于某些新技术领域，选择的产品应当得到实践验证。（）\n【问题2】（3分）\n针对事件2，请将下列综合布线设计要点补充完整（请从候选答案中选择一个正确选项，将该选项编号填入答题纸对应栏内）。\n（1）工作区子系统设计的基本链路长度设计为＿是合理的。\nC．96米\n（2）工作区子系统中共设计了60个信息点，需要＿个RJ45。\nD．100米\nD.300\n（3）系统中心机房的室外电缆采用直埋＋架空方式连接到建设单位的另一楼字。当＿情况存在时，电缆一般不会遭到雷击。\nA．本地区年平均雷暴日为5天，且大地电阻率约为90Ω·m\nB．本地区年平均雷暴日为6天，且大地电阻率约为80Ω·m\nC．建筑物的直埋电缆为50米，且电缆的连续屏蔽层两端都接地\nD．建筑物的直埋电缆为45米，且电缆的连续屏蔽层近地端接地\n【问题3】（6分）\n针对事件3，请问网络安全平台验收主要针对哪些设备或系统？","content_length":967},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题四","score":15,"content":"试题四（15分）\n阅读下列说明，回答问题1至问题3，将解答填入答题纸（答题纸略）的对应栏内。\n【说明】某制造集团制定了智能制造战略目标，要求2019年9月之前上线“高品制造信息应用系统”，协助集团实现汽车生产线的工况在线感知、智能决策控制和装备自律执行，以达到提升装备性能、提高复杂零件制造品质的目的。集团委托监理单位A承担监理工作。项目建设过程中，发生如下事件。\n【事件1】在软件工程招标过程中，集团要求投标方拥有完善的质量管理体系，能够对产品和过程建立起定量的质量目标，同时在开发过程中具备明确的连续度量能力。评标过程要特别关注投标方质量能力及按时交付能力。监理单位据此在招标书中要求投标单位拥有CMMI 2级资质、通过GB／T27001认证。由集团战略总监、集团项目总监、总监理工程师、质量体系认证专家、技术专家、经济专家各1人组成评标小组，其中3名专家从事相关领域工作满6年，均具有高级职称。\n【事件2】软件公司B与集团签订了建设合同，承诺保证质量、按时交付。B的需求小组进行了认真细致的需求调研与分析工作，编制的需求说明书内容完善，将系统分为3个功能子系统和1个工作流子系统，既包含了充分的功能点也细致描述了实现方法。需求说明书通过评审后，项目经理安排设计小组制定系统运行环境方案，以便及时交付建设单位进行采购；安排测试小组制定软件检验标准，务必满足建设单位的严格要求。经建设单位和监理单位同意后，B将1个功能子系统分包给了软件公司C，要求C在2019年底前完成开发及测试。C要求了解系统总体及其他子系统情况，以便编写需求说明书，B以保密为由拒绝了。\n【事件3】软件研发进入实施阶段的尾声，各软件单元分别完成开发，B公司准备进行集成测试。\n【问题1】（5分）针对事件1，请指出监理单位在招标过程中的不正确之处。\n【问题2】（5分）针对事件2，作为监理工程师，请指出存在的问题并说明理由。\n【问题3】（5分）针对事件3，作为监理工程师，请给出集成测试的进入条件。","content_length":835},{"source":"2019-2022案例真题合集.docx","category":"真题","time_label":"2019-2022年","title":"试题五","score":10,"content":"试题五（10分）\n阅读下列说明，回答问题1至问题2，将解答填入答题纸（答题纸略）的对应栏内。\n【说明】某省政府根据整体战略规划部署，拟建设统一身份认证系统。该系统为用户提供注册、实名验证、身份鉴别等服务，实现可信注册、实名验证以及安全登录等功能，支撑政务服务的有序运行。\n完成开发任务后，项目进入系统测试阶段。\n【问题1】（5分）\n请判断如下说法是否正确（正确的选项填写“✓”，不正确的选项填写“x”）。\n（1）监理单位在测试阶段检查了承建单位是否按照设计中制定的规范与计划进行测试。（）\n（2）监理单位组织进行了单元测试、集成测试，并取代了开发方的内部测试。（）\n（3）可与客户和最终用户一同参与开发和评审测试准则。（）\n（4）每当被测试软件或软件环境发生变化时，则在各有关的测试级别上适当进行回归测试。（）\n（5）由软件开发小组兼职系统测试工作，计划和准备所需的测试用例和测试规程。（）\n【问题2】（5分）\n请简述系统测试阶段监理的主要活动。\n设备名称 | 系统安全功能及要求\n(1) | 需要部署在市局内部办公网中，用于自动检测远程或本地主机的安全性弱点，发现所维护的系统所存在的\n安全隐患\n(2) | 需要部署在市局内部办公网中，对关键网络节点进行信息收集并分析，以便从中发现网络或系统中是否有\n违反安全策略的行为和被攻击的迹象\n(3) | 需要部署在视频专网和市局内部办公网的边界处，作为不同网络安全域之间信息的唯一出入口，根据市局\n的安全策略控制出入网络的信息流，且应当具有较强的抗攻击能力\n场景 | 软件测试技术\n测试负责人根据软件需求规格说明书设计测试用例，并按照测试用例的要求测试相应程序，验证软\n件功能和性能的正确性 | (1)\n测试组长按照程序内部的逻辑结构和编码结构设计并执行测试用例，使程序中每个语句、条件分支、\n控制路径都在测试中受到检验 | (2)\n软件开发人员完成了编码，在编译前，开发负责人根据软件设计文档，检查源程序和设计的一致性 | (3)\n开发工程师不使用专门的测试工具和设备，自行检查代码逻辑表达的正确性和完整性 | (4)\n资深开发工程师通过计算机辅助程序对开发完的计算机程序进行控制流分析、数据流分析、接口分\n析、表达式分析 | (5)\n3月时的CPI | 6月时的CPI\n机房工程 | 1.0 | 0.7\n系统集成 | 0.89 | 1.03\n软件开发 | 0.7 | 1.0\n完成的工作 | 是否满足验收条件 | 原因\n项目大部分建设项目按照批准设计方案要求\n建成并可以使用\n部分分项工程初验合格\n技术文档和相关资料基本完备\n采购的操作系统、数据库、应用软件等符合相\n关政策的要求\n各种设备加电试运行正常\n序号 | 测试内容 | 测试类别\n(1) | 频谱带宽\n(2) | 电缆接地是否良好\n(3) | 误码率\n(4) | 电缆交调干扰情况\n(5) | 电缆有无开路或短路\n(6) | 电缆衰减情况\n序号 | 网络安全措施 | 安全层次编号\n(1) | 保障动力系统可靠运行\n(2) | 人员培训及身份验证\n(3) | 业务软件的程序安全性测试\n(4) | 操作系统漏洞监测\n序号 | 选型内容 | 系统需求 | 可选范围（单选）\n(1) | 存储技术 | 需要将分布、独立的供水机构数据整合为大型集中化管理的数据中心，采用TCP／IP协议，支持长距离的小数据块传输，对距离的限制少，易于部署和管理。 | A. SAN\nB. SAS\nC. NAS\nD. DAS\n(2) | 灾后恢复的数据复制模式 | 要求主站点数据能够迅速实时地复制到第二站点，需要达到秒级或微秒级，适应长距离写操作密集的系统，且不需要附加的存储。 | A.同步数据复制\nB.异步数据复制\nC.定期复制\nD.人工复制\n(3) | 灾难恢复方式 | 要求恢复系统安全性非常好，不会因为服务器损坏而发生误切换，恢复时间不能太长，可以接受一段时间的应用中断。 | A.全自动恢复方式B.手动恢复方式\nC.数据备份系统\nD.磁盘备份系统\n(4) | 灾难恢复站点类型 | 要求服务器数据应用程序与主服务器随时同步进行，恢复过程快到难以令人察觉。 | A.热站\nB.冷站\nC.温站\nD.寒站\n监理内容 | 监理方法\n依据信息系统工程项目的总体需求和网络设备的指标，判断网络设备是否能够满足信息系统工程建\n设要求。 | (1)\n网络工程涉及范围较大，检查部分网络综合布线的连通性和通信质量。 | (2)\n在网络施工过程中，对网络综合布线现场施工方式进行质量控制。 | (3)\n模拟真实网络应用场景，验证承建单位的网络设计方案是否满足业主方的要求。 | (4)","content_length":1932},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"","score":null,"content":"信息系统监理师_案例分析合集\n说明：24-25年内容为重点，按时间倒序排列，已去重备考建议：先做最新真题 → 再做历年真题 → 最后看案例专题提示：点击右上角 📋 目录图标可快速导航\n一、2024年11月 案例分析真题\n⭐ 最新真题 · 主要考察20-25章\n一、实施阶段，监理的主要输出文件：（第14章教材P340）参考答案：工程变更监理文档、工程进度监理文档、工程质量监理文档、监理报告(监理日报、监理周报、监理月报、专题报告、工程验收监理报告、监理总结报告)等。\n💡 解析：可以到14章监理主要文档中，找到实施类的写上去。监理在信息管理中的主要文档：\n1、总控类文档：(正式实施前的文档。关键字：合同，方案，计划，规划，细则)承建合同、设计方案、技术方案、项目组织实施方案、项目进度计划、质量保证计划、采购计划、监理大纲、监理规划及监理实施细则等文档。2、监理实施类文档：(P340-342,正式实施后的文档。关键字：变更，报告)工程变更监理文档、工程进度监理文档、工程质量监理文档、监理报告(监理日报、监理周报、监理月报、专题报告、工程验收监理报告、监理总结报告)等。3、监理回复(批复)类：总体监理意见、工程监理意见、培训监理意见、专题监理意见、其他监理意见、提交资料回复单等。4、监理日志及内部文档\n二、监理单位应坚持的行为准则是？（第8章教材P224）\n参考答案：\n监理单位应坚持的行为准则包括：坚持守法、公正、独立、科学、保密。口诀:公(攻)守独保科。\n三、问答题。等级测评过程：（第24章教材P562）现场测评准备属于()活动，测评对象确定属于()活动，信息收集和分析属于()活动，单项测评结果判定属于()活动，结果确认资料归还属于()活动。参考答案：现场测评、方案编制、测评准备、报告编制、现场测评\n💡 解析：等级测评过程包括四个基本测评活动：测评准备活动、方案编制活动、现场测评活动、报告编制活动(背口诀：测编现报)。每一项测评活动都有一组确定的工作任务，如表24-2所示。\n四、软件类响应支持的监理工作要点：（第25章教材P601）\n参考答案：\n响应支持监理要点。主要包括：①检查运维服务提供方的响应支持服务与运行维护SLA的符合性；②依据运行维护SLA、维护手册或维护规程，监督、检查运维服务提供方的响应支持服务，包括处理的及时性、处理过程的严谨性及准确性、文档提交的准确性等；③对运维服务提供方响应支持服务中存在的问题及时提出纠正和改进建议；④宜要求运维服务提供方建立故障诊断知识库，应包括常见故障的原因与现象、故障排除步骤、故障诊断方法、故障诊断与修复原则等。五、能源集团聘请A单位作为监理单位，在设计阶段，A公司实施的主要监理活动包括：1、要求业主单位提交项目计划，并进行审核2、主持需求调研工作：撰写调研记录3、监督承建单位的系统需求分析过程4、组织对设计文档的合法合规性进行评审后，宣布设计文档审核通过5、代表承建单位提出变更申请后，对变更进行了记录和控制在设计阶段，承建单位对系统需求进行了认真管理，主要包括需求获取，需求分析，需求规格编写和需求验证\n问题1:请指出A公司在设计阶段的监理存在哪些问题?（找茬题）\n参考答案：\n应要求承建单位提交项目计划，并进行审核。应由承建单位撰写调研记录，而不是监理。监督承建单位的系统需求分析过程，并组织评审系统说明书。组织对设计文档的合法合规性进行评审后，应上报业主单位审定通过。不能代表承建单位提出变更申请，谁提出的变更由谁提交变更申请。监理对变更过程要进行变更控制。\n问题2:A公司依据哪些准则审核项目计划，并提出监理意见?（第22章教材P507）\n参考答案：\n应根据下列准则审核项目计划，并提出监理意见：(1)与承建合同的一致性、可追溯性；(2)系统范围及工作任务分解的完整性；(3)项目过程及主要里程碑划分的合理性，包括适宜的软件生存周期模型；(4)项目规模估算方法的正确性，包括项目任务和工作产品规模、时间安排、资源使用等；(5)项目进度的合理性，包括项目质量保证计划、配置管理计划等；(6)项目计划中部署全部可用产品(软件和硬件)的可行性；(7)对项目风险有必要的识别、分析、处理和跟踪。\n💡 解析：项目计划、需求分析、概要(结构)设计、详细设计编制好后都需要评审，监理在评审时应遵守的准则：可测试性、完整性、一致性、可行性、适用性、符合性、可追溯性。(口诀：测完一行适符追)\n问题3:作为A公司的监理工程师，在设计阶段可以采取哪些方式验证需求（第22章教材P510-511）\n参考答案：\n验证需求可采用以下方式进行：(1)审查需求文档(2)依据需求编写监理验证用的测试用例(3)敦促编写用户手册(4)确定合格的标准\n六、规划阶段的监理活动包括?（第20章教材P439-440）\n参考答案：\n(1)协助业主单位构建信息系统架构(2)可以为业主单位提供项目的规划相关服务(3)对项目需求、项目计划和初步设计方案进行审查(4)协助业主单位策划招标方法，适时提出咨询意见。\n七、填空。（第25章教材P601）对软件例行巡检、( )、变更管理、补丁程序管理、( )、版本管理、( )等运行维护活动实施监督管理。参考答案：缺陷管理、发布管理、文档管理\n八、某数据中心已经请人做了软件在使用了，请来了监理，在可行性研究报告内容-项目影响的资源利用效率分析中，包括：碳排放与“双碳”目标影响分析、环保措施及方案。请问监理在这个可行性报告的资源利用效率分析中还需要增加什么内容?（第20章教材P441）\n参考答案：\n还需要增加：资源利用效率分析、节能效果分析、环境和生态影响分析、经济影响评价、社会影响评价、消防措施、职业安全和卫生措施等。\n📌 总结：此次2024年案例真题非常的偏，主要考察20-25章内容，8-19章考察内容较少。\n2025年案例备考建议：重点背诵20-25章，8-19章次重点。\n二、2023年5月 案例分析真题\n完整真题+详细解析\n二、2023年5月 案例分析真题\n2023年5月下午-案例题","content_length":2495},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"2023年05月-试题一","score":null,"content":"【2023年05月-试题一】 第23章实施阶段监理试题 一 (15 分)阅读下列说明 ， 回答问题1至问题3,将解答填入答题纸的对应栏内 【说明 】为提高农业生产效率和农产品质量，某省农垦集团开展智慧农业项目，采用人工智能端边云协同解决方案，在端 侧进行环境参数、作物长势等数据特征的提取和分析，在边缘侧对端侧回传的农田或种植区大量采集的数据进行推理 分析、大数据分析应用，在云侧进行海量农作物数据的模型训练。农垦集团选择某人工智能应用系统开发公司A作为承建单位  ，选择某农业信息化监理公司B作为监理单位。在软 件编码阶段，发生如下事件。【事件一】A单位项目经理在选择编码方法和工具时，不知如何下手，咨询B单位监理工程师。【事件二】A 单位遵循开发流程，在设计文档的指导下进行代码编写， 以实现设计的功能和性能为目标，具有良好的 程序结构，而且在不降低程序可读性的情况下，尽量提高了代码的执行效率。出于安全的考虑，程序不保留注释，避 免被人破解或重用； 由于云侧训练模型庞大、端侧AI 算法先进， 占用大量系统资源，不方便调试和测试；模块之间关联 度过高；使用流程也很复杂。但A 公司认为技术先进性是项目亮点，其他都是细节可以忽略。\n【 问题1】 (5分)-默写 (策略： 厚着脸皮多写即可)-第23章实施阶段监理针对事件一，如果你是监理工程师，应建议项目经理依据什么选择软件编码方法和工具。 【郑帅哥老师提示】①按序号多答， N+1 条，5分最起码要答6条。②策略：厚着脸皮多写，写了改卷老师都能酌情给分。\n【 问题1】 参考答案：对备选方法和工具进行选择的依据是：①机构标准软件过程②项目定义的软件过程③现有的技术基础④可得到的培训⑤合同需求⑥工具的能力⑦使用的方便性和提供的服务\n【郑帅哥老师点评】 P582-P5832. 软件编码监理的活动1))监督承建单位将合适的软件编码工程方法和工具集成到项目定义的软件过程中(1)依据项目定义的软件过程对软件 编码任务进行综合。(2)选择软件编码可用的方法和工具，并将选择专用工具或方法的理由写成文档。 对备选方法和工具进行选择的依据 是 ：①机构标准软件过程②项目定义的软件过程③现有的技术基础④可得到的培训⑤合同需求⑥ 工具的能力⑦使用的方便性和提供的服务(3)选择和使用适合于软件编码的配置管理模型。配置管理模型可能是；\n①入库出库模型②组合模型③事务处理模型④更改处理模型(4)将用于软件编码的软件产品和工具置于配置管理之下。\n【事件二】A 单位遵循开发流程，  在设计文档的指导下进行代码编写  ， 以实现设计的功能和性能为目标，具有良好的 程序结构，而且在不降低程序可读性的情况下，尽量提高了代码的执行效率。  出于安全的考虑，程序不保留注释，避 免被人破解或重用：由于云侧训练模型庞大、端侧AI 算 法 先 进  ， 占用大量系统资源，不方便调试和测试：模块之间关联 度过高；使用流程也很复杂。但A 公司认为技术先进性是项目亮点，其他都是细节可以忽略。【 问题2】 (5分)找错改错题(策略：鸡蛋里面挑骨头+无中生有)--第23章实施阶段监理 针对事件二，请指出该项目存在哪些问题，分别违反了哪项软件编码原则。【郑帅哥老师提示】①按序号多答，N+1 条，5分最起码要答6条。②策略：厚着脸皮多写，写了改卷老师都能酌情给分。 【 问题2】 参考答案：(1)   错误：A 单位遵循开发流程，  在设计文档的指导下进行代码编写 纠正：遵循开发流程，在设计的指导下进行代码编写(2)   错误：出于安全的考虑，程序不保留注释，避免被人破解或重用 纠正：程序可读性强，易于理解(3)错误： 占用大量系统资源纠正：软件占用资源少，以低代价完成任务。软件方便调试和测试，可测试性 (4)错误：不方便调试和测试纠正：软件方便调试和测试，可测试性好(5)使用流程 也很 复杂纠正：软件易于使用和维护(6)错误：但A 公司认为技术先进性是项目亮点，其他都是细节可以忽略 纠正：软件具有良好的修改性、扩充性【郑帅哥老师点评】P577-P5784. 软件编码要遵循的一般原则①遵循开发流程，在设计的指导下进行代码编写；②代码的编写以实现设计的功能和性能为目标，要求正确完成设计要求的功能，达到设计的性能；③程序具有良好的程序结构，提高程序的封装性好，减低程序的耦合程度；④程序可读性强，易于理解；⑤软件方便调试和测试，可测试性好：⑥软件易于使用和维护：⑦软件具有良好的修改性、扩充性：⑧软件可重用性强/移植性好；⑨软件占用资源少，以低代价完成任务；⑩ 软件在不降低程序的可读性的情况下，尽量提高代码的执行效率。\n【 问题3】 (5分) 判断题--第23章实施阶段监理关于软件编码监理目标的描述，请判断正误。 (请将答案填写在答题纸的对应栏内，正确的填写“V ”,错误的填写“×”)。(1)监督建设单位定义软件编码任务，监督承建单位始终如一执行这些任务。 (   )(2)监督软件编码与设计文档保持一致性。 (   )(3)监督软件编码的工作进度与计划保持一致性。 (  )(4)监督软件编码的工作质量达到项目经理的要求。 (  )(5)监督软件编码与需求规格说明保持一致性。 (  )\n【郑帅哥老师提示】①要求写“ √ ”“ × ”不要写成‘对 ’‘错 ’,不然可能会没分或者扣分。\n【 问题3】 参考答案：(1)×(2)V (3)V (4)× (5)V\n【郑帅哥老师点评】 P582 1.软件编码监理的目标① 监  督承建单位定义和综合软件编码任务 ，并在生产软件的过程中始终如一地执行这些任务 。 -(1)×不是建设单位②  监督使得软件工作产品彼此间保持一致性 。 -- (3) √ (5) √ 设计 ， 需求规格说明书 ，编码都是产品③ 监督使得软件编码的工作进度与计划保持一致性。-- (2) √④ 监督使得 软件编码的工作质量达到计划的要求。 --(4)×\n【2023年05月 -试题二】  第22章分析设计阶段监理试题二 (15分)阅读下列说明 ， 回答问题1至问题3,将解答填入答题纸的对应栏内 【 说明 】某能源科学研究院拟建设科研管理信息系统 ，用于科研成果的全过程管理 、科技产品转化和科研管理 。研究院 选 择A公司作为承建单位；  选择B 公司作为监理单位 ，进行全过程的跟踪和监督管理 ， 以确保项 目顺利实施。在系统建设过程中 ，发生了如下事件【事件 一 】本项 目建设需求非常明确 ， A 公司选择了瀑布模型开发系统 。为保证系统快速上线 ，研究院信息中心张主 任 要  求A公司边调研 、边设计 、边编码 、边修改  。A  公司项 目  经理小朱表示反对  ，  提出编写软件需求规格说明书后立 即开展设计工作  。B 公 司  监理工程师老李认为虽然进入设计阶段应当满足一定条件  ，  但监理单位应当采纳建设单位的意 见 ，仍然要求A公司按照建设单位的要求开展工作。【事件二】 本系统如被破坏 ，会对公共利益造成严重损害 ，张主任要求 B  公司协助规划信息安全等级保护定级及测评 工作，老李表示需要研究研究。\n【 问题 1 】 (6 分) 找错 改错题第22 章分 析 设计 阶段监 理   针对事件一 ，请指出各方意见中存在的问题，并说明原因。【郑帅哥老师提示】①按序号多答， N+1  条，2分一条 。不会也要学会抄题干，只要不是空白，改卷老师会酌情给分。② 策略： 鸡蛋里面挑骨头+无中生有.\n【 问 题 1】 参 考答案：1 、 错误：研究院信息中心张主任要求A  公 司边调研、边设计、边编码、边修改。 原因： 不符合瀑布模型 。应当完成一个阶段的工作后，再进行下一阶段工作。2 、 错误：A公司项目经理小朱表示反对，提  出编写软件需求规格说明书后立即开展设计工作。原因： 不满足设计阶段进入的前提条件 。还缺少项 目开发计划、软件质量保证计划、软件配置管理计划、软件初步确认测试计划 、用户使用说明书初稿等3 、 错误： B公司监理工程师老李认为虽然进入设计阶段应当满足一定条件  ，  但监理单位应当采纳建设单位的意见，仍然要求A公司按照建设单位的要求开展工作。 纠正：监理应该客观公正，进行沟通协调。\n【郑帅哥老师点评】P553 设计阶段的进人条件\n软件概要设计进入条件(1)项目开发计划、质量保证计划、配置管理计划等配套计划通过评审并正式批准；(2)软件需求规格说明书通过评审：\n(3)以软件需求规格说明书为核心的配置管理分配基线建立。2. 软件详细设计进入条件(4)软件概要设计说明通过评审；(5)软件概要设计说明，外部接口设计已纳入配置管理受控库。\n【 问 题2】 ( 4 分)默写题第22章分析设计阶段监理 请简述本项 目进入设计阶段需满足的条件。【郑帅哥老师提示】① 按序号多答 ，N+1 条 ，4分最起码要答5条 ，有道理的都能酌情给分。②送分题 ，拿满分是没问题的 。 只要您脸皮够厚。\n【 问题2】 参考答案：\n软件概要设计进入条件(1)项目开发计划、质量保证计划、配置管理计划等配套计划通过评审并正式批准；(2)软件需求规格说明书通过评审：(3)以软件需求规格说明书为核心的配置管理分配基线建立。\n软件详细设计进入条件(4)软件概要设计说明通过评审；(5)软件概要设计说明，外部接口设计已纳入配置管理受控库。\n【郑帅哥老师点评】P553 设计阶段的进人条件\n软件概要设计进入条件(1)项目开发计划、质量保证计划、配置管理计划等配套计划通过评审并正式批准；(2)软件需求规格说明书通过评审：(3)以软件需求规格说明书为核心的配置管理分配基线建立。\n软件详细设计进入条件(4)软件概要设计说明通过评审；(5)软件概要设计说明，外部接口设计已纳入配置管理受控库。\n【 问题3】 (5分)判断题有点超纲针对事件二，经过研究，老李告知张主任如下内容，请判断正误。 (请将答案填写在答题纸的对应栏内，正确的填写“V ”, 错误的填写“ × ”.(1)信息系统的安全保护等级分为五级 ，第一级级别最低 。 (    )(2)本系统建议定为三级 ，且需要每半年至少进行一次自查 。 (    )(3)在安全保护等级确定后30 日 内 ，应由研究院到公安机关办理备案手续 。 (    )(4)本系统定级需要请国家信息安全等级保护专家评审委员会评审 。 (    )(5)协助进行信息安全规划不属于监理的工作职责，建议请专业机构协助 。 (    )\n【郑帅哥老师提示】①要求写“V”“ ×”不要写成‘对’ ‘ 错 ’,不然可能会没分或者扣分。\n【 问题3】 参考答案：(1)v  (2)×(3)×  (4)×  (5)×\n【郑帅哥老师点评】\n等级划分第一级： 信息系统受到破坏后 ，会对公民 、法人和其他组织的合法权益造成损害 ，但不损害国家安全 、社会秩序和 公共利益。  - ( 2 ) × 应 该 是 第 二 级第二级： 信息系统受到破坏后 ，会对公民 、法人和其他组织的合法权益产生严重损害 ，或者对社会秩序和公共利益 造成损害 ，但不损害国家安全。第三级： 信息系统受到破坏后 ，会对社会秩序和公共利益造成严重损害 ，或者对国家安全造成损害。第四级： 信息系统受到破坏后 ，会对社会秩序和公共利益造成特别严重损害 ，或者对国家安全造成严重损害。第五级： 信息系统受到破坏后 ，会对国家安全造成特别严重损害 。信息系统安全等级保护的定级准则和等级划分 一级最低，五级最高。  ---(1) √《信息安全等级保护管理办法》 (公通字 [2007]43号)第十五条规定 ， 已运营 (运行)的第二级以上信息系统 ，应 当在安全保护等级确定后30日 内 ， 由甚运营 、使用单位到所在地设区的市级以上公安机关办理备案手续 。  -(3)×    运 营 、使用单位都要备案  ，新建第二级以上信息系统 ，应当在投入运行后30 日 内 ， 由其运营 、使用单位到所在地设区的 市级以上公安机关办理备案手续。《信息安全等级保护管理办法》对 拟确定为第四级以上信息系统的，运营、使用单位或者主管部门应当请国家信息安全保护等级专家评审委员会评审。 -- (4) ×本系统应该是第二级。P220      11.2.2  监理督促建设单位进行信息安全规划监理工程师有义务建议建设单位在信息系统安全管理上有应对的措施和规划 ，在制定信息安全规划方面 ，应建议 建设单位从以下几个方面进行 。-(5)×\n【 2023 年05月 - 试题三 】\n第 19章信息应用系统建设基础知识","content_length":5185},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题三","score":15,"content":"试题三(15分)阅读下列说明 ， 回答问题1至问题3,将解答填入答题纸的对应栏内 【 说明 】某高职院校为开展学生实训课程 ，拟建设跨境电商运营实战平台 ，全仿真模拟跨境电商B2B 交易平台 ，帮助学 生熟悉交易规则和店铺运营要点 ， 同时提高教学效率和教学质量 ，增加实战教学的可控性和趣味性 。该平台包括实战 平台子系统 、资源库学习子系统 、案例分析子系统 、考试子系统 、在线交流子系统学校选择某教育软件提供商A 作为承建单位 ，选择某资深监理公司B 作为监理单位 。在软件测试阶段 ，发生如下 事件 。【事件一】 项 目经理小崔认为测试的 目 的是证明软件没有错误 ， 以便顺利获得学校的初验报告 ，监理工程师小张认为 测试的 目 的是验证软件符合学校的投资 目标 ，双方争执不下。【事件二】为有效开展相应测试工作，小崔使用了多种测试技术，如下表所示。\n【事件三】 小张抽查了平台中案例分析子系统的测试用例 ，发现该测试用例只描述了测试过程和测试输入数据 。其中， 测试规程只描述了运行测试用例的准备、初始化、 中间步骤 ，测试用例的输入数据也只包含了该用例所需的合理的值。\n【 问题1】 (6分)\n默写题-第 19章信息应用系统建设基础知识\n事件一中 ，小崔和小张对测试 目 的的理解都不正确 ，请写出正确的软件测试 目的。 【郑帅哥老师提示】\n① 按序号多答 ， N+1 条 ，6分 ，这边是2分一条 ，最起码要答3-4条 ，有道理的都能酌情给分。②送分题 ，拿满分是没问题的 。 只要您脸皮够厚。 【 问题 1 】参考答案：(1)通过测试 ，发现软件错误。(2)验证软件是否满足软件需求规格说明和软件设计所规定的功能 、性能及其软件质量特性的要求。(3)为软件质量的评价提供依据。【郑帅哥老师点评】 P44619.4. 1测试目的(小郑口诀： 发验评) ( 1 ) 通 过 测 试 ，发现软件错误。(2) 验证软件是否满足软件需求规格说明和软件设计所规定的功能、性能及其软件质量特性的要求。(3)为软件质量的评价提供依据。\n【 问题2】 ( 4 分 ) 填空题-第19章信息应用系统建设基础知识针对事件二 ，请根据不同的测试工作写出最适合的测试技术 ，并将(1)~ (4)适合的测试技术名称填写在答题纸的对应栏 内。【 问题2】 参考答案：(1)代码审查(2)黑盒测试   (3)白盒测试   (4)黑盒测试【郑帅哥老师点评】 P446-P44719.4.2软件测试技术按使用的测试技术不同可以将测试分为静态测试和动态测试  ，进一步地可以将静态测试分成静态分析和代码审查，  将 动态测试分成白盒测试和黑盒测试。代码审查(包括代码评审和走查)主要依靠有经验的程序设计人员根据软件设计文档 ，通过阅读程序 ，发现软件错 误和缺陷 。代码审查一般按代码审查单阅读程序，查找错误。代码审查的内容包括：检查代码和设计的一致性；检查代码 的标准性、可读性；检查代码逻辑表达的正确性和完整性；检查代码结构的合理性等。代码审查虽然在发现程序错误上有 一定的局限性 ，但它不需要专门的测试工具和设备 ，且有一旦发现错误就能定位错误和一次发现一批错误等优点。静态分析主要对程序进行控制流分析 、数据流分析 、接口分析和表达式分析等 。  静态分析一般由计算机辅助完成 。静 态分析的对象是计算机程序 ，程序设计语言不同 ，相应的静态分析工具也就不同 。 目前具备静态分析功能的软件测试 工 具 有 很 多 ， 如 Purify、 Macabe等。白盒测试是一种按照程序内部的逻辑结构和编码结构设计并执行测试用例的测试方法 。采用这种测试方法 ，测试 者需要掌握被测程序的内部结构 。 白盒测试通常根据覆盖准则设计测试用例 ，使程序中的每个语句 、每个条件分支 、 每个控制路径都在程序测试中受到检验 。 白盒测试需要运行程序 ，并能在运行过程中跟踪程序的执行路径。黑盒测试是一种从软件需求出发 ，根据软件需求规格说明设计测试用例 ，并按照测试用例的要求运行被测程序的 测试方法 。它较少关心程序内部的实现过程 ，侧重于程序的执行结果 ，将被测程序看成是不可见的黑盒子 ， 因此被称 为黑盒测试。黑盒测试着重于验证软件功能和性能的正确性 ，它的典型测试项 目包括功能测试 、性能测试 、边界测试 、余量测 试和强度测试等。\n【 问题3】 (5分)默写题-第 19章信息应用系统建设基础知识针对事件三 ，请补充完整案例分析子系统测试用例中缺失的内容。【郑帅哥老师提示】① 按序号多答 ，N+1 条 ，4分最起码要答5条 ，有道理的都能酌情给分。②送分题 ，拿满分是没问题的 。 只要您脸皮够厚。 【 问题3】 参考答案：(1)测试用例的设计应包括该测试用例的测试过程、测试输入数据、期望测试结果和评价测试结果的标准等。(2)测试用例的输入应包括合理的 (有效等价类)值 、 不合理的 (无效等价类)值和边界值输入。(3)为每个测试用例规定测试规程 ，包括运行测试用例的准备、初始化、 中间步骤、前提和约束。(4)把全部测试用例写入“软件测试说明 ”。【郑帅哥老师点评】 P447-P448\n19.4.3软件测试工作规程测试用例设计要求： ( 小郑口诀：(1)测试用例的设计应包括该测试用例的测试过程、测试输入数据、期望测试结果和评价测试结果的标准等。(2)测试用例的输入应包括合理的(有效等价类)值、不合理的(无效等价类)值和边界值输入。(3)为每个测试用例规定测试规程 ，包括运行测试用例的准备、初始化、 中间步骤、前提和约束。(4)把全部测试用例写入“软件测试说明 ”。\n【2023 年05月-试题四】 第20章信息应用系统监理工作试题四(15 分)阅读下列说明，回答问题1至问题3,将解答填入答题纸的对应栏内 【 说明 】某省信息化工程项 目 ，包括建设新的智能机房和数据中台 。通过对数据进行清洗加工建模处理 、挖掘分析 ，将数 据变成有价值的数据资产 。其中数据中台通过招标 ，选择A公司为承建单位  ，专做软件业务监理的B公司为监理单位，\t 并在监理合同中明确了B 公司的服务内容是承担数据中台软件开发全过程的监理工作。在项 目实施过程中 ，发生了如下事件【事件 一 】 由于和 A 公司首次合作 ，加上对数据中台不熟悉，建设单位对项 目质量有所担忧 。 B 公司派出的监理工程 师老赵是软件监理资深专家 ， 建设单位要求B公司承担设计任务  ， 以保证项 目质量 。 并  要求B公司担任A公司的质量 担保人 ，保证实现项目 目标 。  老赵表示接受  ，并积极对智能机房的选址提供了咨询意见。【事件二】 作为应用软件的专业监理单位 ， B 公司建立了相应的质量控制体系，体系中包括质量管理组织和设计质量控 制程序 。但项 目建设过程中还是出现了开发的程序不是跑不通就是效率低 、测试的 bug 改完一处却新增两处 、系统验 收时质量没有过关等问题。\n【 问题1】 (8分) 找错改错-第13章信息系统工程建设的组织协调 针对事件一 ，请指出各方做法中的不当之处 ，并说明原因。【郑帅哥老师提示】①按序号多答 ，有道理的都能酌情给分。②送分题 ，拿满分是没问题的 。 只要您脸皮够厚。 【 问题 1 】参考答案：1 、 建设方不当之处：并要求B公司担任A公司的质量担保人，保证实现项目目标原 因 ：监理单位应是独立的第三方，不能同时既做信息系统工程的监理，又做系统集成业务2、 建设方不当之处：建设单位要求B 公司承担设计任务，以保证项目质量原 因 ：监理合同中明确了B 公司的服务内容是承担数据中台软件开发全过程的监理工作3 、 承建方不当之处：由于和A公司首次合作，加上对数据中台不熟悉，建设单位对项目质量有所担忧原因：  承建单位要满足建设单位的使用功能要求  ，并符合质量标准、技术规范及现行法规 。质量保证体系要满足建 设单位和承建单位双方的需要4、 监理方不当之处：老赵表示接受，并积极对智能机房的选址提供了咨询意见原因：  监理单位在处理事务时 ，敢于坚持正确观点  ，实事求是，不惟上级领导和建设单位的意见是从\n【郑帅哥老师点评】 P280-P281公平、公正、独立原则体现在：(1)  监理单位应是独立的第三方 ，不能同时既做信息系统工程的监理，又做系统集成业务 。否则 ，在做监理工作时， 可以很方便地获得其他承建单位的关键技术或思路 ，若在其他的项 目集成中得到应用 ，显然是不公平的 ，甚至可能是 违法的： 如果是做系统.集成未果，转而做监理，用 自 己的集成思路和技术水平要求承建单位做这做那，显然不合理，更 也是不公平的。(2)  监理单位在处理事务时 ，敢于坚持正确观点，实事求是，不惟上级领导和建设单位的意见是从  。 同时也要坚持对 问题的分析 ，敢于亮明观点 ，对承建单位的不合理或不科学的要求 ，坚决提出改进意见。(3)  监理单位在处理实际监理事务中，要有大局观，要全面地分析和思考，保持对问题的综合分析能力，不要被表面现\n(4)信息系统工程涉及的技术一日千里、变化快，监理工程师要在不断提高个人的专业技能并在实践中不断丰富个人 的从业经验的同时，也要不断提高对相关知识的综合应用能力，对事物熟练的判断能力和处理能力，更要学会把专业 知识和相关的技术规范、法规、法律等运用到监理实践活动中。\n【问题2】 (3分)--默写题-第20查信息应用系统监理工作针对事件二，项 目出现的各种问题是由于 B公司质量控制体系内容不全。请补充缺失的内容。【郑帅哥老师提示】①按序号多答，有道理的都能酌情给分。②送分题，拿满分是没问题的。只要您脸皮够厚。\n【 问题2】 参考答案：①质量管理组织②项目质量控制③设计质量控制程序④开发质量控制程序⑤测试质量控制程序⑥系统验收质量控制程序\n【郑帅哥老师点评】P49620.3.2 监理的质量控制体系在应用软件项目监理工作中，为了有效地实施监理工作，提高监理质量，监理单位必须建立起完善的质量控制体系， 主要内容包括：①质量管理组织②项目质量控制③设计质量控制程序④开发质量控制程序⑤测试质量控制程序⑥系统验收质量控制程序\n【 问题3】 (4分) 选择题-第20章信息应用系统监理工作在项目建设过程中，可以采取哪些质量控制的方法?(请将正确选项填写在答题纸的解答栏内).A.帕累托图    B.挣值分析     C.趋势分析     D.决策树E.控制图      F.统计分析      G.网络图      H.香蕉图\n【 问题3】 参考答案：ACEF\n【郑帅哥老师点评】P498-P5003.质量控制的方法和技术( 小郑口诀：怕插孔通标六区)(1)帕累托分析指确认造成系统质量问题的诸多因素中最为重要的几个因素。也称为8020法则。意思是，80%的问题经常是由于 20%的原因引起的。例如，用户抱怨应用系统问题有如下几方面：登录问题、系统上锁、系统太慢、系统难以使用、报 告不准确。经统计，第一、二类抱怨占总抱怨数的80% 。因此，应集中力量解决系统登录和系统上锁问题。( 2 ) 检 查检查包括度量、考察和测试。\n控制图可以用来监控任何形式的输出变量 ，它用得最为频繁 ，可用于监控进度和费用的变化 、范围变化的度量和 频率 、项 目说明中的错误以及其他管理结果 ，如图20.3所示。(4)统计样本 ( 5 ) 标 准 差标准差测量数据分布中存在多少偏差 。 一个小的标准差 (a)  意味着数据集中聚集在分布的中间，数据之间存在很小的变化，如图20.4所示。( 6 ) 流 图通常被用于项 目质量控制过程中 ，其主要的 目 的是分析问题产生的原因及要素间的关系。( 7)趋 势 分析趋势分析是应用数学的技术根据历史的数据预测项 目未来的发展 ，趋势分析通常被用来监控：","content_length":4877},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题五","score":15,"content":"试题五(15分)阅读下列说明 ， 回答问题1至问题3,将解答填入答题纸的对应栏内 【 说明 】某市拟建设网格化管理执法平台 ，建设内容包括平台软件开发 、手机终端APP 开发 、 网络设备采购 、终端采购、 基础软件及安全产品采购 、信息网络系统建设等内容 。手机终端覆盖全市网格化管理员。建设单位 、承建单位 、监理单位验共同分析了项 目 出现的主要质量风险因素 (见下表),要求监理单位就这些风险 因素制定对应的监理质量控制措施。\n【 问 题1】 ( 6 分 )第 6 章 质 量 控 制如果你是监理工程师 ，请为这些质量风险因素分别制定适当的质量控制措施。 【 问题 1 】参考答案：(1) 评 审 ( 2 ) 旁 站 ( 3 ) 抽 查 ( 4 ) 测 试【郑帅哥老师点评】 P89-P92  (小郑口诀：评测旁抽)6 .4 . 1  评 审 ：评审的主要目的是本着公正的原则检查项目的当前状态，项目评审一般是在主要的项目里程碑接近完成时 进行 ， 比如总体设计、产品设计、编码或测试完成的时候 。通过专家评审 ，可以及时发现重大问题，并给出处理意见。6.4.2测试： 测试是信息系统工程质量控制最重要的手段之一 ，这是由信息系统工程的特点所决定的 ，信息系统工程一 般由网络系统 、主机系统 、应用系统组成 ，而这些系统的质量到底如何 ， 只有通过实际的测试才能知道 ， 因  此测试结 果是判断信息系统工程质量最直接的依据。6.4.3 旁站： 在项目实施现场进行旁站监理工作是监理在信息系统工程质量控制方面的重要手段之一 。旁站监理是指监 理人员在施工现场对某些关键部位或关键工序的实施全过程现场跟班的监督活动 。旁站监理在总监理工程师的指导下， 由现场监理人员负责具体实施 。旁站监理时间可根据施工进度计划事先做好安排 ，待关键工序实施后再做具体安排 。 旁站的 目 的在于保证施工过程中的项 目标准的符合性 ，尽可能保证施工过程符合国家或国际相关标准。6.4.4抽查： 信息系统工程建设过程中的抽查主要针对计算机设备、 网络设备、软件产品以及其他外围设备的到货验收 检查 ， 以及对项 目实施过程有可能发生质量问题的环节随时进行检查 。\n【问 题2】 (4分 )默写题--第18章信息网络系统验收阶段的监理请写出本项 目所需的网络设备在验收时应检测的技术指标。 【 问题2】 参考答案：\n【郑帅哥老师点评】 P413-414  (  小郑口诀： 吞包燕北)( 1 )吞 吐 量    ( 2 )包 丢 失    ( 3 ) 延 时   (4)背 靠 背 性 能\n【 问题3】 (5分)\n判断题-超纲题-法律法规\n本系统作为国家政务信息化项 目 ，应遵从《国家政务信息化项 目建设管理办法》 ,请判断下列说法正误 。 (请将答案填 写在答题纸的对应栏内，正确的填写“ √ ”,错误的填写“ × ”(1)建设单位可以依托云服务资源开展集约化建设。 (   )(2)本项 目 已经纳入国家政务信息化建设规划 ， 因此可以直接编报可行性研究报告 ，不需要再编报项 目建议书 。 (  )(3)本项目不涉及新建土建工程 ，也不是高耗能项目， 因此可以不进行节能评估、规划选址、用地预审等审批 。 (   )(4)项目建成后，建设单位应当不定期开展网络安全检测与风险评估 ，保障信息系统安全稳定运行 。 (   )(5)项目建成半年后，建设单位应按照国家有关规定申请审批部门组织验收 。 (   ) 【 问题3】 参考答案：(1)V     (2)V   (3)×   (4)×(5)×\n【郑帅哥老师点评】(1)建设单位可以依托云服务资源开展集约化建设。 (V)(2)本项目 已经纳入国家政务信息化建设规划， 因此可以直接编报可行性研究报告，不需要再编报项目建议书 。 (V)(3)本项目不涉及新建土建工程 ，也不是高耗能项 目， 因此可以不进行节能评估  、规划选址、用地预审等审批。 (×)服务器也是耗能的。(4)项目建成后，建设单位应当不定期开展网络安全检测与风险评估，保障信息系统安全稳定运行。  )      过 程 。(5)项目建成半年后，建设单位应按照国家有关规定申请审批部门组织验收 。 (×)\n根据《国务院办公厅关于印发国家政务信息化项 目建设管理办法的通知》 (国办发〔2019〕57号)  (以下简称 “ 国办 发57号文 ”) 的要求 ， 国家政务信息化项 目建成后半 年 内  ，项 目建设单位应当按照国家有关规定申请审批部门组织验 收 ；  --- (5)× ,是内 ，不是后 。  项 目建设单位不能按期申请验收的 ，应当向项 目审批部门提出延期验收申请； 验收完 成后 ，项 目建设单位应当将验收报告等材料报项 目审批部门备案。测试工作 | 测试技术编码阶段，由有经验的程序设计人员阅读代码，发现软件错误和缺陷 | (1)不关注系统内部的实现过程，侧重系统的运行结果，对系统进行边界测 试、余量测试和强度测试 | (2)按照在线交流子系统的内部逻辑结构和编码结构，设计并执行测试用 例，并在程序运行过程中跟踪程序的执行路径 | (3)根据软件需求规格说明设计资源库学习子系统的测试用例，主要验证软 件功能和性能的正确性和符合性 | (4)序号 | 质量风险因素_ (1) | 业务对软件系统功能和性能要求高，需求分析及设计方案很可能难以满足业务需要_ (2) | 综合布线的外场施工环境复杂、有较多的关键过程或关键工序，容易发生质量事故(3) | 各种材料、设备到货量大(笔记本电脑及手机终端超过500台),到货时间集中， 难以保证材料和设备验收的质量(4) | 承建单位测试经验欠缺，测试能力有限，对关键功能和性能的测试能力不足\n三、2019-2022年 案例真题合集\n历年真题汇总\n三、2019-2022年 案例真题合集（含答案）","content_length":2435},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题一","score":20,"content":"试题一（20分）阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。【说明】某A信息系统集成商与建设单位达成合作，通过招投标确定A公司为中标人，该项目总投资金额为1200万元。【事件1】A公司对该项目极为重视，但是由于A公司还兼顾着其他项目项目的实施工作，为了不影响进度经过与公司上层领导沟通最后决定将该项目部分主体建设内容分包给B公司，并对B公司的资质、公司业绩等进行了严格的审核。【问题1】（6分）针对事件1，A公司的做法是否正确？为什么？答：1、不正确理由为：1、A公司未经建设单位同意不能转包或分包合同项目合同中未事先约定，A公司分包给B公司，违反合同约定A公司不得将实施项目的主体部分分包B公司的资质，业绩审查应该由监理单位执行\n【事件2】在施工的过程中，A公司向C供货商采购了一批设备，但是在设备运输的过程中，由于物流公司司机小王疲劳驾驶，发生车祸且设备全部损坏，因此造成设备不能按时进场，最终导致影响施工进度。A公司认为这是不可抗力的意外事故，并向建设单位提出了工期补偿申请。【问题2】（8分）针对事件2，司机小王的车祸事件符合项目管理中“不可抗力”因素的定义吗？A公司向甲方申请工期补偿，甲方是否应该同意？答：1、不符合项目管理中的“不可抗力”因素，理由如下：①不可抗力因素是指不能预见、不能避免且不能客服的客观情况②车祸是因为司机小王的疲劳驾驶属于人为因素，不符合“不可抗力”因素甲方不应该同意，理由如下①车祸不属于项目管理中的“不可抗力”，因此导致工期延误，不符合索赔规定②司机小王没能及时、详细的记录不可抗力发生时的现场情况③A公司人为造成的设备损坏及损失，应由A公司自行承担\n【事件3】项目实施后期，建设单位决定新增一批设备采购，费用为125万元，考虑到该项目是A公司一开始就负责实施，对项目建设比较熟悉，建设单位决定直接将新增的采购任务委托给A公司进行。【问题3】（6分）事件3中建设单位的做法是否正确？为什么？答：1、建设单位的做法不正确2、因为该项目投资总额为1200万，建设单位决定新增设备的采购金额为125，已超过原合同金额的10%，需要重新招标3、因为A公司小王人为因素导致设备损坏，项目进度延期，建设单位可以向A公司索赔，由A公司承担设备损失4、设备损坏不能进场，建设单位、承建单位、监理单位应当协调制定项目变更计划，分析变更影响，及时补充设备，而不是后期采购","content_length":1004},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题二","score":15,"content":"试题二（15分）阅读下列说明，回答问题1至问题2，将解答填入答题纸的对应栏内。【说明】监理公司具有甲级监理资质，在与建设单位签订监理合同时发生如下事件：【事件1】监理公司在中标后，安排公司总监李工负责编写监理大纲。但由于李工工作上的原因，李工安排该中标项目总监王工全权负责监理大纲的编制工作，王工重点对“下一步如何实施监理工作”进行了重点描述。【问题1】（6分）请说明公司总监李工的做法是否正确？监理大纲应该在什么时候由谁负责编制完成、提交？监理大纲应该对哪一部分内容进行重点描述？它的目的是什么？答：1、李工的做法不正确2、监理大纲是在建设单位选择合适的监理单位时，监理单位参与投标时完成提交3、监理大纲是项目监理阶段编制的项目监理方案性文件，应该由公司总监李工负责编制4、监理大纲重点描述“为什么”，而不是“如何做”5、监理大纲的目的是使建设单位信服，增强监理任务中标的可能性，承接监理项目【事件2】在完成了监理大纲、监理规划后，王工安排专业监理工程师刘工编制了监理细则，并对“监理工具与设施”进行了充分的说明。【问题2】（9分）针对事件二请指出错误的地方，并列出监理规划、监理细则的主要内容。答：1、王工安排刘工编制细则是错误的，监理细则应该是在监理规划的知道下，专业监理工程师主持编写，报送项目总监认可批准执行刘工对“监理工具与设施”进行充分说明的做法是错误的，这部分不属于“监理细则”的内容监理规划的主要内容是工程项目概况、监理范围、内容、目标、组织形式、人员配备计划、人员岗位职责、监理依据、工作程序、工作方法及措施、工作制度、监理工具及设施等监理细则的主要内容是工程专业的特点、监理流程、监理控制要点及目标、监理单位法及措施","content_length":719},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题三","score":10,"content":"试题三（10分）阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。【说明】某业主单位新建信息网络系统项目，通过招投标分别选定了监理单位与承建单位。监理单位协助建设单位开展招投标工作。【问题1】（3分）招标阶段的主要步骤是什么？答：招标阶段的主要步骤有：1、确定项目需求2、编制招标文件3、确定标底4、发布招标公告或发出投标邀请等（5、进行招投标资格预审6、通知投标单位参加投标并向其出售标书7、组织召开标前会议等）【问题2】（5分）承建单位A在投标时为了获取中标机会，私下串通其他投标人，并出具相关费用劝阻其他投标人正常投标，请问该承建单位A的做法属于“视为串通投标”，还是属于“属于串通投标”？请分别列出哪些行为视为串通投标，哪些行为是属于串通投标。答：承建单位A的行为是“属于串通投标”以下情况“属于串通投标”投标人私下协商投标文件和报价私下约定投标人私下约定部分投标人放弃投标、中标同一组织的投标人，按组织要求协同投标投标人为谋取中标，采取联合行为排斥某特定投标人以下情况是“视为串通投标”不同投标人的投标文件由同一单位进行编制不同投标人的投标文件异常一致、混装不同投标人委托同一单位办理投标事宜不同投标人的投标保证金由同一单位、账户转出【问题3】（2分）在评标阶段，由专家组成了评标委员会进行评标工作，请对以下情况进行判断：（1）与招标人有利害关系的人是可以进入评标委员会的。     （×）（2）与投标人有利害关系的人是可以进入评标委员会的。     （√）","content_length":640},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题四","score":15,"content":"试题四（15分）阅读下列说明，回答问题1至问题2，将解答填入答题纸的对应栏内。【说明】某软件开发项目有三套具体的方案，公司对这3套方案召开了内部会议：方案A：如果一切顺利，赢利30万元的概率为25％；正常条件下，赢利20万元的概率为30％；在全部风险都将发生的情况下，损失18万元的概率为10％。方案B：项目如果一切顺利，赢利28万元的概率为20％；正常条件下，赢利45万元的概率为40％；在全部风险都将发生的情况下，损失35万元的概率为20％。方案C：项目如果一切顺利，赢利35万元的概率为30％；正常条件下，赢利30万元的概率为50％；在全部风险都将发生的情况下，损失28万元的概率为15％。【问题1】（8分）请分别计算三套方案的预期价值是多少。1、A方案的 EMV=30x25%+20x30%+(-18x10%)=11.7（万元）2、B方案的\tEMV=28x20%+45x40%+(-35x20%)=16.7（万元）3、C方案的\tEMV=35x30%+30x50%+(-28x15%)=21.3(万元)【问题2】（7分）经过分析对比，公司应该选择哪一套方案？答：经过上述计算，对比后C方案EMV值更高，因此公司应该选择C方案","content_length":515},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题五","score":15,"content":"试题五（15分）【说明】某信息系统集成项目共有A、B、C、D、E、F六个活动，每个活动的工期为一个月，且各活动的施工顺序为A、D、F、E、C、B。在项目各活动资金估算的时候，A活动估算金额为12万元，B活动估算金额为20万元，C活动估算金额为36万元，D活动估算金额10万元，E活动估算金额为29万元，而F工作只预留了13万元。活动集成的费用为10万元，且A、D、F完成时集成一次，占总集成费用30％，E、C、B完成时集成一次，占总集成费用30％，所有活动完成时再集成一次，占总集成费用40％。该项目还设置了应急储备10万元，设置管理储备的金额为成本基准金额的10％。【问题1】（8分）计算该项目的总预算、成本基准分别是多少。1、项目成本基准=A+B+C+D+E+F+集成费用＋应急储备=12+20+36+10+29+13+10+10=140(万元)2、项目总预算＝成本基准＋管理储备\t=140+(140x10%)=154（万元）\n【问题2】（7分）项目在进行到第四个月初的时候，对项目进行检查，发现实际完成的工作为A、D、F、E，实际花费为100万元，请问此时项目成本是超支、持平还是节约？项目进度是提前、持平还是滞后？答：1、第四个月初时，实际花费的金额为100万元，即\tAC=100（AC即实际完成工作的实际花费）2、项目的PV：项目计划要进行的工作的预算）PV=A+D+F+第一次集成=12+36+13+(10x30%)=64（万元）3、项目的EV（EV：项目实际完成工作的预算）EV=A+D+F+E+第一次集成=12+36+13+29+(10x30%)=934、CV=EV-AC=93-100=-7\t因此项目成本超支5、由于目前只施工了三个月的时间，且每个活动的工期为一个月，因此按照正常的进度计划，在第四个月初，应该完成的活动为A、D、F与第一次集成工作。但是我们实际完成的活动有A、D、F、E与第一次集成工作。因此项目施工进度提前。2022年5月下午真题试题-（15分）阅读下列说明，同答【问题1】至【问题3】，将解答填入答题纸的对应栏内。【说明】某机场规划建设数字孪生系统，由于该系统运背时数据传输量大、时延及丢包率大，需要提前进行网络系统升级改造。机场通过招标选定A公司作为网络改造承建单位，选择B公司作为监理单位。【事件1】根据建设合同，A公司采购了网络设备和安全设备，设备到货当天，在设备到货验收现场和B公司准备接收设备，并告知接收地点。B公司现场项目负责人老吴检查了设备的数量、规格、出厂证，检查无误后将设备放到指定的存放地点，老吴提交了设备到货验收监理报告。【问题1】（6分）根据事件1的描述，请纠正各方在设备采购坏节存在的不当之处。答：1、设备验收未通知业主方2、未提前三天通知业主方和监理方B公司到货地点及时间3、接收设备未与合同进行对照4、接收设备未与工程清单对照5、未核对到货时间是否与合同一致6、未检查配套软件包7、未核对设备质量及完好性【事件2】A单位按照网络改造方案开始工程实施，过程中发生如下情况。·交付工程师依据经验将设备安装到机柜中；·机架和网络设备预留了1.2m的过道，便于设备检修：·安装路由器缺少一个固定螺丝，安装在机架后轻微晃动；·由于施工人员流失，A单位临时补充-名即将毕业的实习生。【问题2】（4分）根据事件2的描述，请纠正相关人员在设备安装中存在的不当之处。答：1、交付工程师应按照施工方案而不是经验进行施工为便于施工和维护，机架和网络设备前应预留1.5米的过道而不是1.2米各种螺丝必须拧紧，无松动、缺少和损坏，机架不能有晃动现象临时补充实习生不当，施工人员要具备相应的资质，持证上岗【问题3】（5分）信息系统网络系统工程实施阶段监理的主要工作。答：1、组织布线、网络和安全系统方案设计评审2、检查布线施工和布线测试情况3、进行布线系统的监理确认测试4、网络硬件设备和配套软件的监理确认测试","content_length":1626},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题二","score":12,"content":"试题二（12分）阅读下列说明，回答【问题1】至【问题3】，将解答填入答题纸的对应栏内。【说明】某大型企业拟为A1、自动驾驶、GIS、HPC、生命科学等新型应用提供算力和存储服务，考虑到这些场景对海量新模态小文件的存取要求，计划开发-套高性能数据存储软件。企业通过招标选定A公司作为软件开发单位，B公司作为监理单位。【事件1】由于新场景、新技术的引入，A公司不知道应该如何选择软件编码方法和工具，求助于监理工程师小崔。【问题1】（4分）针对事件1，监理工程师小崔应依据（(B)   D）\t(E)、（G）选择软件编码方法和工具。A.B公司标准软件过程C.是否获得发明专利授权E.可得到的培训\nB.项目定义的软件过程D.合同需求F.工具的价格G.使用的方便性试题解析 对备选方法和工具进行选择的依据是：①（软件承建）机构标准软件过程；②项目定义的软件过程；③现有的技术基础；④可得到的培训；⑤合同需求；⑥工具的能力；⑦使用的方便性和提供的服务。\n【事件2】小崔对A公司编码工程活动和产品进行了评审或审核，包括：软件编码工程任务的准备是否就绪、软件编码工程任务的完成准则是否得到满足、对设计的跟踪是否得以实施、软件产品提交前是否依据软件基线验证了管理和维护软件的文档。【问题2】（4分）针对事件2，请指出小崔还应对哪些软件编码工程活动和产品进行评审和审核还应进行的评审和审核有：①软件编码是否符合规定的标准和需求；②是否已完成所需的测试；③检测出的问题和缺陷是否已建立文档，并被跟踪和处理。试题解析 对软件编码工程活动和产品进行评审和（或）审核的内容，至少应包括：①软件编码工程任务的准备就绪和完成准则是否得到满足；②软件编码是否符合规定的标准和需求；③是否已完成所需的测试：④检测出的问题和缺陷是否已建立文档，并被跟踪和处理；⑤对设计的跟踪是否得以实施；⑥在软件产品提交前，是否依据软件基线验证了用来管理和维护软件的文档。【事件3】A公司完成编码及部分测试工作后，准备启动确认测试。小崔认为目前不满足确认测试进入条件，双方产生了纠纷。【问题3】（4分）针对事件3．请写出进入确认测试阶段的条件。进入确认测试的条件至少要包括：①软件完成了集成测试；②软件可运行；③所有软件代码都在配置管理控制下；④已经具备了合同规定的软件确认测试环境。","content_length":964},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题三","score":14,"content":"试题三（14分）阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。【说明】某网格化社区管理系统为贴合建设单位不同部门的需求，要求承建单位采取现场开发方式建设。平台开发完毕后，进入试运行阶段，按照合同约定，试运期为3个月。承建单位项目团队认为开发任务已完成，未对后续工作做出安排、向客户口头承诺如出现影响使用的严重问题随叫随到，撤离了用户现场。【事件1】项目按照系统测试计划完成测试，进入试运行阶段，建设单位收到基层人员大量投诉，包括：系统使用过程中反馈问题经常无入响应、修改bug的新版本迟迟不能发布、身份证扫描设备有时无法使用、很多功能找不到入口等。由于承建单位人员不在现场，建设单位不熟悉系统，问题越积越多，始终得不到解决。三个月后，建设单位拒绝终验，于是承建单位派资深工程师到用户现场，凭丰富的个人经验进行系统维护。【事件2】监理单位追溯时发现监理工程师在软件测试阶段对软件测试工程活动和产品进行评审时，进行的监理活动如下：①检查承建单位软件测试工程任务是否准备就绪：②审核承建单位是否完成所需测试。【问题1】（5分）请指出承建单位在试运行阶段的不当之处。不当之处：①未制订试运行计划；②未进行现场跟踪；③不应向用户口头承诺；④客户问题无专人受理、记录；⑤问题处理没有跟踪管理导致解决延迟或问题积累；⑥未制订维护方案，仅凭个人经验进行维护：⑦未对用户进行培训。【问题2】（4分）请写出软件系统测试计划应包括的内容。软件测试计划应包含的内容：①测试范围；②测试环境；③测试策略；④测试管理；⑤测试风险。【问题3】（5分）针对事件2，请补充监理工程师在软件测试阶段还应对哪些测试活动和产品进行评审或审核。对软件测试工程活动和产品进行评审的内容，至少还应包括：①软件测试是否符合规定的标准和需求；②检测出的问题和缺陷是否已建立文档，并被跟踪和处理；③通过软件测试，软件产品是否符合软件需求；④是否依据软件基线验证了用来管理和维护软件的文档。","content_length":826},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题四","score":18,"content":"试题四（18分）阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。【说明】某行交通管理部门拟扩建全省交警指挥信息应用系统，要新增车辆行为特征识别、非现场违法智能识别、驾驶人员特征识别等软件功能模块。建设单位通过招标选定A公司作为软件开发单位、B公司作为监理单位。由于项目规模大、安全性要求高，建设单位要求每个阶段结束时都要进行外部评审、每次评审邀请不同的软件专家。在实施阶段尾声，由B公司主持、A公司组织，成立了评审委员会。评审委员会由2名A公司人员，2名B公司人员、2名外部软件专家组成。评审委员会初步审查后，软件专家组进行了评审。在最后的评审过程中，评审委员会发现了重要问题。由于工期紧张，经协商同意先通过评审、承建单位进入验收准备阶段，但必须2周内解决问题，进行复审。【问题1】（7分）请纠正各方在外部评审环节存有的不当之处。各方在外部评审环节存在的不当之处有：①承建单位在本阶段工作完成并通过内部评审后，至少提前10天提出外部评审申请，同时将评审文档及资料交给软件专家组成员进行审查；②每次评审邀请不同的软件专家不当，参加同一个项目的软件专家组成员应相对稳定；③由B公司主持、A公司组织，成立了评审委员会不当，外部评审应由业主单位主持，承建单位组织，成立评审委员会：④评审委员会人员组成不当，评审委员会的组成人数应7人以上（单数），设主任一人、副主任若干人：⑤2名外部软件专家不当，软件专家组成员应占评审委员会总人数的50％以上；⑥评审委员初审软件专家组再审不当，应该软件专家组先审评审委员会再审；⑦B单位不能作为外部评审专家成员；⑧重要问题未解决通过评审不当。\n【问题2】（5分）请写出软件提交验收必须具备的条件、提交验收的软件项目必须具备以下条件；①已通过计算机软件确认测试评审；②已通过系统测试评审；③合同或合同附件规定的各类文档齐全；④软件产品已置于配置管理之下；⑤满足合同或合同附件规定的其他验收条件。\n【问题3】（6分）依据《国家政务信息化项目建设管理办法》，请判断下列说法是否正确（正确打了，错误打X）。（）各有关部门应按照“以保密建设为主，让水经济实效”的要求，加强对政务信息化项目的并联管列。\t\t\t\t（1）各有关部门按照职责分工，负责国家政务信息化项目审批、建设、运行和安全监管等相关工作，并按照“以统为主、统分结合、注重实效”的要求，加强对政务信息化项目的并联管理。( )（2）通过政府购买服务方式产生的国家政务信息化项目，应当按规定履行审批程序并向国家工业和信息化部备案\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t( )除报国家发展改革委员会审批或者国务院审批的项目以外，其他有关部门自行审批新建、改建、扩建，以及通过政府购买服务方式产生的国家政务信息化项目，应当按规定履行审批程序并向国家发展改革委员会备案。\n（3）项目建设单位应当对项目绩效对标执行情况进行评价，在建设期内每季度末向项目审批部门提交项目绩效评价报告。\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t()（3）项目建设单位应当对项目绩效目标执行情况进行评价，并征求有关项目使用单位和监理单位的意见，形成项目绩效评价报告，在建设期内每年年底前向项目审批部门提交。（4）可行性研究报告、初步设计方案均应当包括信息资源共享分析内容。（5）所有中央本级政务信息系统应当全口径纳入管理平台进行统一管理。\t\t\t\t\t( )（6）国家政务信息化建设管理应当坚持统筹规划、共建共享、业务协同、安全可靠的原则。","content_length":1441},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题五","score":16,"content":"试题五（16分）阅读下列说明，问答【问题1】至【问题3】．将解答填入答题纸的对应栏内。【说明】某单位进行机房改建升级工程，包括机房建设、综合布线、硬件系统集成等，通过公开招标选择了承建单位和监理单位分别承担项目的建设工作和监理工作，在项目建设过程中，发生如下事件：【事件1】在项目建设过程中承建单位将各种服务器等硬件设备已经运达指定位置，实施人员在设备安装完成后，立即进行网络系统通电及调试，致使防火墙被损坏。承建单位项目管理人员已承担责任并及时更换了该设备。【事件2】项目整体完成后，成立了由建设单位、监理单位和外聘专家组成的验收委员会。在验收过程中，总监理工程师安排监理工程师刘工带领其他几名工程师审查承建单位验收申请，由刘工组织监理人员进行验收，由总监理工程师签署验收文件等。【问题1】（5分）对于事件1，针对网络系统安装调试时出现的问题，请分别指出承建方存在的问题。承建方存在的问题：①无详细的系统配置计划；②无调试计划；③未搭建模拟调试环境及进行模拟环境调试；④未进行单机上电自检及调试；⑤未使用单机逐步接入并调试的策略。\n【问题2】（4分）请指出事件2中的不当之处。①验收委员会缺少承建单位代表；②验收申请的审查应由总监理工程师亲自完成，不属于可以委托的事项；③验收前总监理工程师应组织人员进行预验收；④竣工验收文件应由建设方签署，总监理工程师无权签署。\n【问题3】（7分）作为监理工程师，请判断以下的描述是否正确（正确的填✓，不正确的填写x）。（1）机房接地系统地线与零线之间所测得的交流电压应小于IV。\n( )（2）网络设备的接地系统不可与避雷装置共用，应各自独立，并且其间距应在15m以上。（2）网络设备的接地系统不可与避雷装置共用，应各自独立，并且其间距应在10m以上。（3）穿在管内的绝缘导线的额定电压不应高于380V。\t\t\t\t\t\t\t\t\t\t( )（3）穿在管内绝缘导线的额定电压不应高于500V。\n（4）不同系统线路不应穿同一根管内或线杷的同一孔槽内。\n( )（5）在弱电系统工程中使用的传输线路宜选择不同颜色的绝缘导线，以区分功能及正负极。（6）机房地板载重量必须大于400k400kg/㎡( )（6）地板载重量必须大于500kg／㎡。\n( )（7）线槽直埋长度超过4m或在线槽路由交叉、转变时宜设置拉线盒，以便于布放缆线和维修。（7）线槽直埋长度超过6m或在线槽路由交叉、转变时宜设置拉线盒，以便于布放缆线和维修。( )\n2021年11月下午真题","content_length":1036},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题一","score":15,"content":"试题一（15分）回答下列【问题1】至【问题3】，将解答填入答题纸对应栏内。【说明】为推进“互联网＋政务”工作，高效便捷地服务全国各类企业及公众，国家某部拟开发一套移动端App，动态实时推送企业信息，方便公众快速了解。建设单位将信息系统工程的开发及上线交给系统集成公司A，委托监理单位B监理全部建设过程，并分别签订了建设合同及监理合同。项目于2021年10月建成，组织了竣工验收工作。【事件1】项目批复概算总投资为4300万，验收时尚有部分设备节余、部分款项待收付。B单位汇总编制了项目竣工结算系列报表，竣工结算金额为5000万。【事件2】验收委员会由7人组成，包括建设单位代表、A单位代表、B单位代表以及邀请的技术专家，并成立了验收测试组和配置审核组进行验收前的检查工作。验收委员会对验收环境进行了审定，确认与系统开发环境相一致，且被验收软件符合需求规格说明书的要求，认为这两项符合验收条件：验收测试组结合原有测试结论，根据建设单位的要求增加了系统资源占用率的测试，验收测试中发现一些bug，但并未超过建设单位的限定值，于是验收测试组批准项目通过验收。【问题1】（3分）根据系统描述，请判断本项目是否应当实施监理，并请说明判断的理由。应当实施监理。因为根据信息产业部发布的“信部信［2002］570号”文件规定，下列信息系统工程应当实施监理：①国家级、省部级、地市级的信息系统工程；②使用国家政策性银行或者国有商业银行贷款，规定需要实施监理的信息系统工程；③使用国家财政性资金的信息系统工程；④涉及国家安全、生产安全的信息系统工程；⑤国家法律、法规规定应当实施监理的其他信息系统工程。本项目为省部级信息系统工程，所以应实施监理。\n【问题2】（7分）针对【事件1】，B单位的做法是否正确？为什么？（1）B 单位做法不正确。项目竣工结算应由建设单位汇总编制，项目竣工结算应内容完整、核对准确、真实可靠。（2）请指出本项目的项目竣工结算系列报表应包括哪些报表。（2）竣工结算报表一般包括：竣工工程概况表、竣工财务结算表、交付使用财产总表和明细表、结余设备明细表和应收应付款明细表等。\n【问题3】（5分）针对【事件2】，请指出各方的做法存在哪些错误，并说明原因。业主单位：本题未见验收方案。业主单位应与监理单位协调，审定承建单位提交验收方案，考查验收方案是否符合项目的相关要求，三方在协商基础上形成正式的验收方案。监理单位：验收工作的全过程必须详细记录，记录验收过程中验收委员会提出的所有问题与建议以及对被验收软件的评价；验收过程出现的问题应出具问题清单，并要求限期整改；验收工作结束后应出具验收报告。承建单位：承建单位将软件提交业主单位与监理单位进行验收测试之前，必须保证承建单位本身己经对软件的各方面进行了足够的正式测试；软件除了要符合软件需求规格说明书要求之外，还应满足设计要求、合同要求。验收委员会：应出具测试计划，测试中发现的Bug应整改，应出具测试报告，测试组无权决定项目通过验收；验收环境审定应由配置审核小组进行，且开发环境与验收环境一致不能说明符合验收条件。","content_length":1283},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题二","score":18,"content":"试题二（18分）阅读下列说明，回答【问题1】至【问题4】，将解答填入答题纸的对应栏内。【说明】某三级甲等医院拟建设医疗影像诊断系统，通过医疗影像识别算法将原来的放射科医生经验诊断升级为人工智能辅助诊断，希望将诊断时间由10-15分钟缩短为10-16秒、诊断准确率从约90％提升到大于99％。医院将系统建设交给系统集成公司A，委托监理单位B监理全部建设过程。为确保软件配置项的完整性和可跟踪性，A公司采用了配置管理工具，B单位监理工程师老黄认为专业工具能够充分实现软件配置管理监理的目标，于是将监理重点放到需求规格说明书及设计说明书的评审上，对设计说明书的功能、性能、接口、质量、限制、各种选择方案等方面设计了充分的检查点，并组织了同行评审。在项目测试过程中，测试团队发现了很多bug，老黄认为主要原因是编码不够规范，提出了一些整改要求，包括：（1）变量名称应完整表达变量含义，不得使用缩写；（2）代码文件不得注释，非代码行不得写入源程序；（3）数据说明的次序应当规范化，说明语句中变量安排应当有序化；（4）语句结构以执行效率为最高原则，语句越复杂说明程序员水平越高。【问题1】（5分）老黄为设计说明书设计的检查点不全面，请补充其他的检查点。还缺的检查点：可追溯性、风险、实用性、技术清晰度、可维护性。【问题2】（5分）请指出老黄对软件编码规范提出的整改要求中的不当之处，并说明原因。对软件编码规范提出的整改要求的不当之处如下：（1）名称不是越长越好，应当选择精炼的、意义明确的名称，必要时可使用缩写名称，但这时要注意缩写规则要一致，并且要给每一个名称加注释。（2）程序中的注释是程序员与日后的程序读者之间的重要沟通桥梁。一些正规的程序文本中注释行的数量占到整个源程序的三分之一或更多。注释分为序言性注释和功能性注释。（3）除非对效率有特殊的要求，程序编写要清晰第一，效率第二。【问题3】（4分）软件配置管理监理的目标包括哪些？软件配置管理监理的目标包括：①确保软件配置管理活动是有计划的；②确保所选择的软件工作产品（各阶段成果）是经过标识、受到控制并具有可用性的；③所标识的软件工作产品的更改是受控的；④可及时了解软件基线的状态和内容。【问题4】（4分）编制良好的需求规格说明书应满足一定的原则，请判断下列需求规格说明书的编制原则或相关描述是否正确。（正确打✓，错误打X）需求规格说明书中的“实现”应与“功能”分离，描述“怎样实现”而不是“做什么”。（）（1）需求规格说明书中的功能与实现分离，是指描述要“做什么”，而不是“怎样实现”。\n需求规格说明书应使用面向对象的规格说明语言。（ ）\n（2）需求规格说明书中就使用面向处理的规格说明语言，来说明来自环境的各种输入有可能会导致系统做出什么样的功能性反应，以此来定义出行为模型，从而得到“做什么”的规格说明。\n（3）对某信息系统的子系统，需要描述与其他子系统交互的方式。（）（4）需求规格说明书是对系统自身的需求描述，不需要包括系统运行的环境。（）（4）需求规格说明书中必须包括系统运行的环境。\n（5）需求规格说明书必须是一个认识的模型，而不是设计的模型。（）（6）需求规格说明书必须是可操作的，能够用它来判定已提出的实现方案是否能够满足规格说明（）（7）需求规格说明书应考虑周全，不允许存在不完备性。（）（7）需求规格说明书中必须容许不完备性并允许扩充。\n（8）需求规格说明书应松散地构造，以便能很容易地加入和删去一些段落。（）","content_length":1440},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题三","score":14,"content":"试题三（14分）阅读下列说明，回答【问题1】至【问题3】，将解答填入答题纸的对应栏内。【说明】某炼油化工厂计划建设一套智能监控系统。期望实现：按需智能巡视场所安全；智能识别仪器读数和开关位置；提升巡视频率和质量。由于系统对网络传输、数据仓库、数据挖掘要求较高，该厂准备先搭建一个性能卓越的信息网络系统。该厂选择A公司作为承建单位，委托监理单位B监理全部建设过程，在项目实施过程中，发生如下事件：【事件1】A公司在应用服务器选型时，考虑了如下内容：①服务器产品成熟，应以最低价中标方式招标：②应用系统的运算模型以OLAP为主；③应用服务器应支持串行数据库；可以采用MTBF值衡量系统可靠性；④主要参考服务器的TPC-C指标。【事件2】在机房电源系统设计时，监理工程师小刘建议电源规格应满足电压 180-264V，AC，频率47-63Hz，其他单一谐波不得高于5％。在计算电源稳压器的容量时，应为各设备总容量之和。为减少布线量和电源节点，机房电源与窗型冷气机、复印机等小型用电设备应共用同一地线，机房内设置的供维修人员使用的普通插座可以与机房电源系统共用电源。配电箱的位置应当注意安全，远离机房。【问题1】（4分）针对事件1，请指出A单位在应用服务器选型时考虑的内容中，哪两项是正确的（答案多于两项不得分）。应用系统的运算模型以OLAP为主；可以采用MTBF值衡量系统可靠性【问题2】（5分）针对事件2，请指出小刘对机房电源系统设计建议中的不当之处，并给出正确的做法。小刘对机房电源系统设计建议中的不正确之处有：①其他单一谐波不得高于5％，错误。应不得高于3％：②电源稳压器容量计算时应为各设备总容量之和，错误。应再加30％安全容量：③机房电源与窗型冷气机、复印机等小型用电设备应共用同一地线，错误。这些设备不得共用同一地线，以免互相干扰：④机房内设置的供维修人员使用的普通插座可以与机房电源系统共用电源，错误。维修用插座应该单独设置：⑤配电箱的位置应当注意安全，远离机房，错误。配电箱应尽量靠近机房，并且便于操作。【问题3】（5分）在进行信息网络系统的整体规划及设计评审时，小刘根据实际情况考虑了以下内容，请判断其是否正确。（正确打的✓，错误打的x）（1）网络设计方案应符合安全性原则，安全性是指设备、技术层次的安全。（）（2）网络设计方案的设计、规划、设备选型符合当前的需求即可。（）（3）网络系统设计和设备选型要兼顾先进性和实用性。（）（4）网络路由和交换设备兼容性是否良好，骨干网是否具备自愈能力。（\t)（5）IP地址规划应符合业主的组织结构，并能反映出组织上的从属关系。（）","content_length":1090},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题一","score":13,"content":"试题一（13分）阅读下列说明，回答【问题1】至【问题3】，将解答填入答题纸的对应栏内。【说明】某企业计划新建一个异地备份机房，用于备份企业的业务运营数据、信息资源服务数据、历史记录等信息，以确保业务的连续性。【问题1】（5分）除机房装修、机房屏蔽及防静电系统、机房安保／安防系统外，机房建设还应包括哪些子系统？【问题2】（5分）以下关于A级机房内温湿度控制要求的描述，请判断是否正确（正确打✓，错误打x）。（1）夏季开机温度应控制在21～25℃之间。\t\t\t\t( )（2）开机时湿度应控制在40％～80％之间。\t\t\t\t\t( )（3）温度变化率＜5℃／h并不得结露。\t\t\t\t\t\t\t()（4）常用记录介质库的温、湿度应与基本工作间相同。\t\t( )（5）主机房内的空气含尘浓度，在静态条件下测试，每升空气中大于或等于0.5μm的尘粒数应少于18000粒。\t\t\t\t\t\t\t\t\t\t\t\t\t\t( )【问题3】（3分）请将（1）～（3）的正确选项填写在答题纸的对应栏内。（1）当主机房与备份机房两地间距1500公里时，实现业务运营系统数据的实时复制，宜采用（）模式。A.同步数据复制\nB.异步数据复制\nC.定期复制（2）成本最低、系统恢复时间最长的灾难恢复方式是（）。C.数据备份系统（3）为进一步降低成本，监理工程师建议历史记录系统的灾备机房只设置用于信息处理的基础物理环境（如电线、空调、地板等），灾难发生时其它设备再运送到站点上，从基础开始安装。这种灾备站点的类型是（）。A.热站\nB.冷站\nC.温站","content_length":643},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题二","score":16,"content":"试题二（16分）阅读下列说明，回答【问题1】至【问题4】，将解答填入答题纸的对应栏内。【说明】某石油公司A拟建设高性能勘探计算管理平台，包括大数据智能分析、集群任务调度管理和并行文件管理等子系统，平台的功能、业务性能、存储方式等关键需求不明确，且数据分析子系统运用人工智能技术，预估采购活动相当复杂，A公司委托监理公司B协助招标，在招标阶段陆续发生如下事件：【事件1】A公司聘请专业咨询公司详细梳理并确定需求后，决定先对并行文件管理子系统进行招标，并编制了可行性研究报告作为招标依据。【事件2】B公司监理工程师根据招投标法，推荐了招标方式。【事件3】B公司建议招标审核资质时，重点审核投标单位是否具有质量管理体系、软件能力成熟度是否达到优化级（即能够持续不断地改进过程）。【事件4】A公司发布了招标公告，声明：项目于4月1日开标，开标地点为A公司总部，开标当日确定中标候选人。招标文件公示了投标资格、评标标准、评标委员会名单等内容。评标委员会共7人，包括A公司代表2人、B公司代表2人，其余为经济、技术专家。评标完成后，评标委员会确定C公司中标，4月4日发出了中标通知书。5月15日，A公司与中标人订立了书面合同。中标人经A公司同意，将其中部分功能模块分包给另一家单位，中标人告知分包单位务必保证开发质量，出了问题由分包单位向招标人负全责。【问题1】（4分）针对事件1，请说明可行性研究主要包含哪几个方面？【问题2】（5分）针对事件2，请给出监理工程师可以推荐的招标方式，并说明理由。【问题3】（2分）请将（1）、（2）的正确选项填写在答题纸的对应栏内。针对事件3，中标单位应具备质量管理体系（1）要求的认证，应达到软件能力成熟度（2）级别。A. ISO9001E. CMMI2\nB. ISO14001F. CMMI3\nC. ISO20001G. CMMI4\nD. ISO27001H. CMMI5【问题4】（5分）针对事件4，请指出招标过程中存在的问题。","content_length":828},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题四","score":17,"content":"试题四（17分）阅读下列说明，回答【问题1】至【问题3】，将解答填入答题纸的对应栏内。【说明】某大型物流公司A为优化实物快递网络，拟建立专业仿真系统，提供快递处理中心仿真服务。企业通过招标确定了监理公司B和软件公司C，要求B公司对软件生命周期进行全过程监理，帮助用户建设一个高质量的、具有可持续生命力的软件系统。【事件1】在软件开发进行前，C公司编制了《质量保证计划》，内容如下：（1）工程必要的背景说明，包括编写目的、背景、定义、参考资料等。（2）规定了所要进行的技术和管理两方面的评审和检查工作，编制了评审和检查规程，制定了通过与否的检查标准。（3）指明了用以支持特定软件项目质量保证工作的工具、技术、方法。（4）包含了对子项目承建单位的控制说明。B公司监理工程师审查《质量保证计划》后，认为其符合ISO／IEC20000-1的要求，内容充分详实，判定审查通过。【事件2】在软件开发阶段后期，C公司申请系统验收，监理工程师收到C公司提交的验收标准、验收方案后，立即着手实施验收工作。验收完成后，监理工程师收集了测试报告、系统验收报告，完成了本阶段的监理工作。【事件3】进入项目验收阶段，A公司与B公司协调成立了专门的验收委员会及验收测试组。验收测试组的验收原则如下：（1）原有测试和审核结果凡可用的就利用，不必重做该项测试或审核。（2）B公司负责制定验收测试计划，验收测试组负责测试实施。（3）验收测试组的任务是验证软件功能和接口与设计文档具有一致性。（4）验收测试和配置审核是验收评审前必须完成的两项主要检查工作。【问题1】（8分）（1）针对事件1，请判断监理工程师针对质量保证计划“内容充分详实”的审查结论是否正确，如不正确请补充说明。（2）针对事件1，请判断监理工程师审查过程是否合理，并说明理由。【问题2】（5分）针对事件2，请指出监理工程师的监理工作是否完整，并说明理由。【问题3】（4分）针对事件3，请判断验收测试组的验收原则是否正确。（正确打✓，错误打x）","content_length":837},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题五","score":15,"content":"试题五（15分）阅读下列说明，回答【问题1】至【问题3】，将解答填入答题纸的对应栏内。【说明】某天体物理中心A委托承建单位C建立分布式高性能计算系统，对宇宙辐射进行大规模数值模拟及分析，要求监理公司B在各测试阶段务必加强监理力度，确保系统性能。【问题1】（4分）网络铺设完成后，在光纤测试中C单位选择的测试方法可以包括（）。（将正确的4个选项填写在答题纸的对应栏内）A.连通性测试E.端-端损耗测试\nB.特性阻抗F.反射损耗测试\nC.收发功率测试G.回波损耗\nD.接线图H.电缆近端串扰【问题2】（6分）考虑到系统需要采用可靠、稳定的高性能服务器，B公司的监理工程师小李在服务器安装时全程旁站，重点监理了以下内容，请判断该监理做法是否正确。（正确打、错误打x）（1）机架、服务器的排列位置和设备朝向都应按机房管理员要求安装。\t\t\t\t( )（2）机架和设备前应预留1米的过道，以便施工和维护。\n( )（3）金属钢管、槽道与地线连接处的接地垫圈必须一次装好，不得将已装过的垫圈取下重复使用。（4）接线头必须进行焊锡处理，保证接线端接触良好，不易氧化。\n( )( )（5）监视器安装位置应保证屏幕获得充分光照，便于管理员查看。\t\t\t\t\t( )（6）采用屏蔽结构的缆线时，应剥除屏蔽层，按设计做好接地。【问题3】（5分）软件测试穿插在软件开发全过程中，请将下列（1）～（5）对应的所属开发阶段选项填入答题纸对应栏内。（1）完成软件集成测试计划\t\t\t( )（2）完成软件单元测试计划\n( )（3）完成确认测试计划\t\t\t\t( )（4）完成系统测试计划\t\t\t\t( )（5）执行软件单元测试\t\t\t)A.需求分析阶段D.编码阶段\nB.概要设计阶段E.测试阶段\nC.详细设计阶段\n2020年11月份下午真题","content_length":743},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题一","score":20,"content":"试题一（20分）阅读下列说明，回答【问题1】至【问题4】，将解答填入答题纸的对应栏内。【说明】某国有企业集团公司希望进行XX信息系统项目工程建设，包括网络建设、机房系统建设、软件开发等多个项目，为此通过公开招标的方式与承建单位签订了项目建设合同，并发生了如下事件。【事件1】为了方便沟通并且节省资金，总公司领导直接指定了本企业下属某监理公司来担任本次项目的监理工作，同时，安排了该公司老王担任本次监理单位的总监理工程师，在施工过程中老王将系统开发单位的商业秘密在饭桌上谈论，认为都是本单位同事，相互交流更有利于工作的开展。为了体现自己的价值，保证项目质量，同时得到公司领导的赏识，老王亲自带领监理人员开展测试工作，并在系统实施过程中多次偏袒甲方单位，引起系统集成承建商的不满，最终项目在多种冲突中完成。【事件2】在系统设计过程中，老王组织现场监理工程师对系统集成承建单位编制的工程项目总进度计划进行了评审，对系统设计方案进行了签认，承建单位将主要设备，材料清单报于监理单位进行审核。【事件3】下表为施工过程中，承建方提交的截止到6月时的绩效报告。【事件4】由于集团公司的要求，项目实施过程中，软件开发需求一变再变，为了保证项目的顺利开展，三方一致决定严格按照变更流程来进行控制。【问题1】（5分）针对【事件1】，从监理单位和监理人员的权利和义务两方面分别指出信息系统实施过程中存在的问题有哪些？【问题2】（6分）请根据【事件2】说明在设计阶段监理工作的主要内容有哪些？【问题3】（4分）请根据【事件3】的绩效报告中的CPI数据，分析项目当前的绩效情况，并说出原因。【问题4】（5分）根据【事件4】，请写出变更控制的原则有哪些？","content_length":713},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题二","score":15,"content":"试题二（15分）某建设单位为了提高公司整体运行效率，拟进行XX服务平台的升级改造工作，通过公开招标的方式选择了监理方与承建方，在项目开发的过程中发生了如下事件：【事件1】在准备验收时，承建单位完成了如下工作后进行验收：·项目大部分建设项目按照批准的设计方案的要求建成并可以使用。·部分分项工程初验合格。·技术文档和相关资料基本完备。·采购的操作系统、数据库、应用软件等符合相关政策的要求。·各种设备加电试运行正常。【事件2】在项目开发的过程中监理方与承建方对确认验收的内容出现了分歧，双方各执一词，争论不休。【事件3】因本项目实施时间非常紧张，为了追赶进度，建设方与监理方多次讨论验收方案，并最终确认了大致能满足项目要求的验收方案，按这个方案执行可以大幅减少返工率，达到快速完成项目的要求。【问题1】（5分）请根据上述内容，填写下表，承建单位是否满足网络系统验收的条件，并简要写出原因。【问题2】（4分）作为监理工程师的你请写出确认验收的基本条件具体包括哪些内容？【问题3】（3分）针对【事件3】，请指出在验收方案的制定方面存在哪些问题？【问题4】（3分）请写出验收阶段监理需要审核的内容有哪些？","content_length":498},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题一","score":20,"content":"试题一（20分）阅读下列说明，回答问题1至问题4，将解答填入答题纸的对应栏内。【说明】为提升金融机构现金处理效率，降低现金综合运营成本，某省级银行拟建设区域现金中心管理系统，以实现现金处理集约化、数据集中化和监管全程化。建设单位与承建单位A签订了建设合同，与监理单位B签订了监理合同。在项目建设过程中发生了如下事件：【事件1】系统需求分析阶段结束后，承建单位A向监理工程师提交了项目需求小组编制并签章的《应用软件系统开发计划（初稿）》、《软件需求规格说明（初稿）》、《软件质量保证计划》、《软件配置管理计划》、《测试计划（初步）》、《用户使用说明（初稿）》，申请进入系统设计阶段。【事件2】建设单位对项目的成本控制特别关心，要求在成本、技术、进度三者之间综合平衡，保证各项工作在各自的预算范围内进行。【事件3】为提高代码质量，承建单位A的开发小组编制了《软件编码规范》，内容包括：（1）变量名称应完全体现变量用途，需使用英文完整单词，不得缩写。（2）为提高程序运行效率，不要在程序中写注释。（3）程序中数据说明的次序与语法无关，可以是任意的。（4）为了体现项目的编程水平，程序编写要做到效率第一，清晰第二。（5）输入输出的方式、格式应尽可能方便用户使用。（6）对所有的输入数据都要进行检验，保证每个数据的有效性。【事件4】数据报表子系统预计代码规模500000行。开发人员完成250000行代码时，承建单位A项目负责人上报该子系统开发进度完成50％。【问题1】（3分）对事件1，如果你是监理工程师，请依据分析阶段的监理控制要点，向承建单位提出你在监理过程中发现的问题。【问题2】（6分）针对事件2，作为监理工程师，你认为成本控制内容包括哪些方面？【问题3】（6分）针对事件3，作为监理工程师，请逐一指出这份《软件编码规范》的要求是否正确，不正确的请写出正确的做法。【问题4】（5分）针对事件4，作为监理工程师，你认为A单位的进度评估是否合理，为什么？","content_length":825},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题二","score":15,"content":"试题二（15分）阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。【说明】为推进“互联网＋政务服务”，某建设单位拟建设省级政务服务平台，要求平台能够支撑一网通办、汇聚数据信息、实现交换共享、强化动态监管。该单位通过公开招标，确定了承建单位和监理单位。在准备验收时，承建单位完成了如下工作：（1）采购了操作系统、数据库、应用软件等，均符合相关政策法规要求。（2）采购的设备已全部到货，经加电运行，状态正常。（3）项目大部分建设内容已按照批准的设计方案建设完成。（4）技术文档和验收资料基本完备。在项目验收阶段：（1）建设单位和监理单位共同确定了项目的验收方案。（2）建设单位和监理单位根据验收方案组建了验收组。（3）验收组按照验收工作程序完成初步验收，提交了正式的竣工验收申请。（4）验收组按照分项工程成立了测试（复核）小组、资料文档评审小组和工程质量鉴定小组。【问题1】（6分）针对案例中承建单位已完成的工作内容，请指出其不满足验收前提条件的地方。\n【问题2】（3分）基于以上案例，请问验收过程中的哪些做法是不正确的？【问题3】（6分）作为监理工程师，请指出各验收小组的具体工作内容。","content_length":498},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题三","score":15,"content":"试题三（15分）阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。【说明】某市拟建设城市供水全过程监管大数据平台，利用城市供水行业各企业及机构现存的海量信息，通过大数据手段进行分析预测、辅助决策，帮助政府部门实现城市供水全过程智慧化监管。建设单位委托承建单位A负责该系统的建设，委托监理单位B负责监理工作。【问题1】（4分）为了安全高效地存储、备份海量数据，请根据建设单位的系统需求（如下表所示），选择合适的存储及恢复技术类型（请将正确选项填写在答题纸的对应栏内）。【问题2】（6分）针对下列工作内容，请填写适合的监理方法（请将下面1～4处的答案填写在答题纸的对应栏内）。【问题3】（5分）作为监理工程师，请判断下列内容是否正确（填写在答题纸的对应栏内，正确的选项填写“✓”，不正确的选项填写“x”）（1）主机房设计容纳设备20台，设备尚未选型，主机房的面积是100平米。（2）开机时，主机房夏季设计适宜温度为26℃，湿度是50。（3）敷设的光缆在室内布线时要走线槽，拐弯半径35cm。（4）有一处管道设计在沼泽地处，设计方法选择是现场浇灌水泥管道。（5）管理间、设备间的接地设计为：单个设备接地是1Ω，整个系统接地小于4Ω。","content_length":519},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题四","score":15,"content":"试题四（15分）阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。【说明】某省计划2020年初步建成信息共享的生态环境监测网络。通过招标，建设单位确认了A单位为承建单位，B单位为监理单位。随着项目建设任务的推进，B单位根据项目建设的总体进度计划，要求A单位在合同规定的时间节点，按监理要求提交正式的文档或软件，并根据相关标准审查文件。在项目实施过程中，发生了如下事件：【事件1】由于项目工期比较紧，A单位在需求调研没有全部完成且未与用户进行确认的情况下，开始了系统开发工作。监理工程师给A单位发了监理通知单，要求A单位尽快整改。【事件2】为了实现项目建设目标，当发现事件1所述的问题后，A单位邀请监理工程师担任工程承保人或保证人帮助监督实施质量。【问题1】（4分）在项目实施过程中，质量控制的方法包含哪些（请选择4个正确选项填写在答题纸的对应栏内）？A.挣值E.控制图\nB.帕累托图F.趋势分析\nC.香蕉图G.网络图\nD.决策树H.统计分析【问题2】（7分）（1）针对事件1，监理单位的做法是否合理？为什么？（2）针对世界2，A单位的想法是否可行，为什么？（3）结合事件2，你认为在项目中监理的责任范围是什么？【问题3】（4分）写出监理工作的主要内容。","content_length":532},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题五","score":10,"content":"试题五（10分）阅读下列说明，回答问题1至问题2，将解答填入答题纸的对应栏内。【说明】为了保证某信息化平台建设项目的实施质量，通过招标，建设单位确定了监理单位和承建单位。在实施过程中，监理单位配合完成了相关工作。【问题1】（6分）请判断如下监理相关工作是否合理。（填写在答题纸的对应栏内，正确的选项填写“✓”，不正确的选项填写“x”）（1）部分设备的配件不合格，监理督促承建单位与供货厂商联系更换。（）（2）监理在测试阶段对承建单位进行检查，确认承建单位是否按照设计中规定的测试规范与计划进行测试。（）（3）监理监督承建单位根据项目需求，对软件测试进行开发、维护、建立文档等。（）（4）监理监督承建单位依据项目定义的软件过程、计划确认测试。（）（5）从承建单位抽调开发人员与监理人员共同组成测试小组，共同计划和准备所需的测试用例和测试规程。（）（6）根据实际工作需要，监理对软件测试活动进行跟踪、审查和评估。（）【问题2】（4分）按照测试阶段的划分，软件测试由（1）测试、\t（2）测试、（3）测试、（4）测试组成。（请将（1）～（4）处的答案填写在答题纸的对应栏内）。2019年5月下午真题","content_length":495},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题一","score":20,"content":"试题一（20分）阅读下列说明，回答问题1至问题4，将解答填入答题纸（答题纸略）的对应栏内。【说明】南方X省试点建设重大自然灾害监测预警信息系统，计划部署50个PC监控终端和500个电子标签（RFID）。建设单位与承建单位签订了项目建设合同，与监理单位签订了项目监理合同。项目要求次年八月结束，在项目实施过程中发生如下事件：【事件1】由于项目的试点试验性，承建单位从3个厂商采购了不同型号的电子标签。电子标签全部到货后，监理工程师抽取了其中50个逐一检查，抽检比例、检查内容符合质量控制计划。监理工程师检查合格，在进货清单上签署“同意”后设备入库。一周后，承建单位又补充采购了10个电子标签。监理工程师按照抽检比例抽查了其中1个，检查合格后同意入库。【事件2】为有效掌握工程的实际进度，及时发现计划与实际的偏差，监理工程师小周在项目建设过程中绘制了下图。其中，曲线A是最早时间计划，曲线B是最迟时间计划，曲线N1是网络工程实际进度，曲线N2是软件开发实际进度。整个项目建设期间，小周始终严格记录并保管监理日志。\n【事件3】由于经费紧张，该项目要求严格控制成本。建设单位提出可以裁剪设计评审活动、减少专家支出、设备采购采取最低价中标策略；承建单位提出可以减少人员投入，延长工期到次年九月：监理单位提出谁实施谁负责，投资控制应由承建单位负全责。三方各执己见。【事件4】该项目完成系统设计后，南方几省突然发生严重冰灾。承建单位发现需要增加“极端气候”预警监控子系统，项目经理马上通过电话向监理工程师小周提出需求变更。小周感到事态严重，当即同意变更。项目经理立即组织人马加班加点全力投入研发工作。项目出现新增子系统与其他几个子系统不兼容的问题，最终超支并延期。【问题1】（6分）请指出事件1中监理工程师工作的疏漏之处，并给出正确做法。【问题2】（4分）针对事件2：（1）请给出监理工程师采用的进度控制方法，并分析七月时的项目进展情况。（2）如果你是监理工程师，请在小周的工作基础上进行补充完善。【问题3】（5分）针对事件3：（1）请写出监理在投资控制过程中应遵循的基本原则。（2）结合以上原则，三方的投资控制建议分别违反了哪一项？【问题4】（5分）作为项目监理工程师，如何对事件4进行变更控制？","content_length":942},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题二","score":15,"content":"试题二（15分）阅读下列说明，回答问题1至问题3，将解答填入答题纸的对应栏内。【说明】某单位进行大型电子政务信息系统工程建设，总投资5000万元。建设单位分别与承建单位、监理单位签订了实施合同和监理合同。【事件1】承建单位在合同时间范围内完成了业务应用系统的代码开发工作，将软件源代码及编译配置说明文档提交建设单位和监理单位，准备验收工作。【事件2】承建单位向监理单位提交了验收申请。监理单位首先需要对其验收计划和验收方案进行审查。【事件3】建设单位准备组织验收委员会进行测试、验收。【问题1】（5分）针对事件1：（1）承建单位的做法是否合理？为什么？（2）验收准备工作前，承建单位需要补充提交给建设单位和监理单位的资料有哪些？【问题2】（5分）针对事件2，请指出监理单位对承建单位验收计划和验收方案进行审查的主要内容。【问题3】（5分）针对事件3，请从候选答案中选择一个正确选项，将该选项编号填入答题纸（答题纸略）对应栏内。D.控制流分析（2）软件集成测试由＿组织，软件开发组和软件测试组联合实施测试。D.第三方测试单位D.第三方测试单位D.验收测试（5）＿的目的在于通过与系统的需求定义做比较，发现软件与系统定义不符合的地方。A.单元测试\nB.集成测试\nC.系统测试\nD.验收测试","content_length":542},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题三","score":15,"content":"试题三（15分）阅读下列说明，回答问题1至问题3，蒋解答填入答题纸的对应栏内。【说明】某市卫生部门拟建立“基于人工智能的医学影像诊断云平台”。该平台每天从10家三级甲等医院获取病人的临床数据，智能分析后生成医学影像诊断知识库，共享给本市所有医疗机构。因病例数据涉及患者隐私，建设单位委托承建单位A为云平台搭建一个星型拓扑结构的专有信息网络系统，委托监理单位B承担信息网络系统的监理工作。【事件1】在对信息网络系统进行招标时，监理工程师协助建设单位制定了技术方案投标评分标准。【事件2】监理工程师应当了解《智能建筑设计标准》的要求，并据此监理综合布线系统的设计方案。【事件3】信息网络系统实施完成后，监理工程师协助建设单位对网络安全和网络管理平台组织了严格的测试验收。【问题1】（6分）针对事件1，请判断监理工程师设置的下列评分项或评分方法是否正确（正确的选项填写“✓”，不正确的选项填写“x”）（1）选用的技术路线（包括网络架构、网络安全体系、服务器）应当是主流的。（）（2）主要设备的价格应与当前的市场行情相符。（）（3）防火墙和入侵检测系统应相互独立，不具有联动性。（）（4）应重点考虑总体技术方案的适用性，把实际需求放第一位。（）（5）应当提供定性化的系统规划方法，确保网络交换机、服务器、存储系统、备份系统的配置规划合理。（）（6）对于某些新技术领域，选择的产品应当得到实践验证。（）【问题2】（3分）针对事件2，请将下列综合布线设计要点补充完整（请从候选答案中选择一个正确选项，将该选项编号填入答题纸对应栏内）。（1）工作区子系统设计的基本链路长度设计为＿是合理的。C．96米（2）工作区子系统中共设计了60个信息点，需要＿个RJ45。\nD．100米D.300（3）系统中心机房的室外电缆采用直埋＋架空方式连接到建设单位的另一楼字。当＿情况存在时，电缆一般不会遭到雷击。A．本地区年平均雷暴日为5天，且大地电阻率约为90Ω·mB．本地区年平均雷暴日为6天，且大地电阻率约为80Ω·mC．建筑物的直埋电缆为50米，且电缆的连续屏蔽层两端都接地D．建筑物的直埋电缆为45米，且电缆的连续屏蔽层近地端接地【问题3】（6分）针对事件3，请问网络安全平台验收主要针对哪些设备或系统？","content_length":941},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题四","score":15,"content":"试题四（15分）阅读下列说明，回答问题1至问题3，将解答填入答题纸（答题纸略）的对应栏内。【说明】某制造集团制定了智能制造战略目标，要求2019年9月之前上线“高品制造信息应用系统”，协助集团实现汽车生产线的工况在线感知、智能决策控制和装备自律执行，以达到提升装备性能、提高复杂零件制造品质的目的。集团委托监理单位A承担监理工作。项目建设过程中，发生如下事件。【事件1】在软件工程招标过程中，集团要求投标方拥有完善的质量管理体系，能够对产品和过程建立起定量的质量目标，同时在开发过程中具备明确的连续度量能力。评标过程要特别关注投标方质量能力及按时交付能力。监理单位据此在招标书中要求投标单位拥有CMMI 2级资质、通过GB／T27001认证。由集团战略总监、集团项目总监、总监理工程师、质量体系认证专家、技术专家、经济专家各1人组成评标小组，其中3名专家从事相关领域工作满6年，均具有高级职称。【事件2】软件公司B与集团签订了建设合同，承诺保证质量、按时交付。B的需求小组进行了认真细致的需求调研与分析工作，编制的需求说明书内容完善，将系统分为3个功能子系统和1个工作流子系统，既包含了充分的功能点也细致描述了实现方法。需求说明书通过评审后，项目经理安排设计小组制定系统运行环境方案，以便及时交付建设单位进行采购；安排测试小组制定软件检验标准，务必满足建设单位的严格要求。经建设单位和监理单位同意后，B将1个功能子系统分包给了软件公司C，要求C在2019年底前完成开发及测试。C要求了解系统总体及其他子系统情况，以便编写需求说明书，B以保密为由拒绝了。【事件3】软件研发进入实施阶段的尾声，各软件单元分别完成开发，B公司准备进行集成测试。【问题1】（5分）针对事件1，请指出监理单位在招标过程中的不正确之处。【问题2】（5分）针对事件2，作为监理工程师，请指出存在的问题并说明理由。【问题3】（5分）针对事件3，作为监理工程师，请给出集成测试的进入条件。","content_length":827},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题五","score":10,"content":"试题五（10分）阅读下列说明，回答问题1至问题2，将解答填入答题纸（答题纸略）的对应栏内。【说明】某省政府根据整体战略规划部署，拟建设统一身份认证系统。该系统为用户提供注册、实名验证、身份鉴别等服务，实现可信注册、实名验证以及安全登录等功能，支撑政务服务的有序运行。完成开发任务后，项目进入系统测试阶段。【问题1】（5分）请判断如下说法是否正确（正确的选项填写“✓”，不正确的选项填写“x”）。（1）监理单位在测试阶段检查了承建单位是否按照设计中制定的规范与计划进行测试。（）（2）监理单位组织进行了单元测试、集成测试，并取代了开发方的内部测试。（）（3）可与客户和最终用户一同参与开发和评审测试准则。（）（4）每当被测试软件或软件环境发生变化时，则在各有关的测试级别上适当进行回归测试。（）（5）由软件开发小组兼职系统测试工作，计划和准备所需的测试用例和测试规程。（）【问题2】（5分）请简述系统测试阶段监理的主要活动。\n设备名称 | 系统安全功能及要求(1) | 需要部署在市局内部办公网中，用于自动检测远程或本地主机的安全性弱点，发现所维护的系统所存在的安全隐患(2) | 需要部署在市局内部办公网中，对关键网络节点进行信息收集并分析，以便从中发现网络或系统中是否有违反安全策略的行为和被攻击的迹象(3) | 需要部署在视频专网和市局内部办公网的边界处，作为不同网络安全域之间信息的唯一出入口，根据市局的安全策略控制出入网络的信息流，且应当具有较强的抗攻击能力场景 | 软件测试技术测试负责人根据软件需求规格说明书设计测试用例，并按照测试用例的要求测试相应程序，验证软件功能和性能的正确性 | (1)测试组长按照程序内部的逻辑结构和编码结构设计并执行测试用例，使程序中每个语句、条件分支、控制路径都在测试中受到检验 | (2)软件开发人员完成了编码，在编译前，开发负责人根据软件设计文档，检查源程序和设计的一致性 | (3)开发工程师不使用专门的测试工具和设备，自行检查代码逻辑表达的正确性和完整性 | (4)资深开发工程师通过计算机辅助程序对开发完的计算机程序进行控制流分析、数据流分析、接口分析、表达式分析 | (5)| 3月时的CPI | 6月时的CPI机房工程 | 1.0 | 0.7系统集成 | 0.89 | 1.03软件开发 | 0.7 | 1.0完成的工作 | 是否满足验收条件 | 原因项目大部分建设项目按照批准设计方案要求建成并可以使用 |  |部分分项工程初验合格 |  |技术文档和相关资料基本完备 |  |采购的操作系统、数据库、应用软件等符合相关政策的要求 |  |各种设备加电试运行正常 |  |序号 | 测试内容 | 测试类别(1) | 频谱带宽 |(2) | 电缆接地是否良好 |(3) | 误码率 |(4) | 电缆交调干扰情况 |(5) | 电缆有无开路或短路 |(6) | 电缆衰减情况 |序号 | 网络安全措施 | 安全层次编号(1) | 保障动力系统可靠运行 |(2) | 人员培训及身份验证 |(3) | 业务软件的程序安全性测试 |(4) | 操作系统漏洞监测 |序号 | 选型内容 | 系统需求 | 可选范围（单选）(1) | 存储技术 | 需要将分布、独立的供水机构数据整合为大型集中化管理的数据中心，采用TCP／IP协议，支持长距离的小数据块传输，对距离的限制少，易于部署和管理。 | A. SANB. SASC. NASD. DAS(2) | 灾后恢复的数据复制模式 | 要求主站点数据能够迅速实时地复制到第二站点，需要达到秒级或微秒级，适应长距离写操作密集的系统，且不需要附加的存储。 | A.同步数据复制B.异步数据复制C.定期复制D.人工复制(3) | 灾难恢复方式 | 要求恢复系统安全性非常好，不会因为服务器损坏而发生误切换，恢复时间不能太长，可以接受一段时间的应用中断。 | A.全自动恢复方式B.手动恢复方式C.数据备份系统D.磁盘备份系统(4) | 灾难恢复站点类型 | 要求服务器数据应用程序与主服务器随时同步进行，恢复过程快到难以令人察觉。 | A.热站B.冷站C.温站D.寒站监理内容 | 监理方法依据信息系统工程项目的总体需求和网络设备的指标，判断网络设备是否能够满足信息系统工程建设要求。 | (1)网络工程涉及范围较大，检查部分网络综合布线的连通性和通信质量。 | (2)在网络施工过程中，对网络综合布线现场施工方式进行质量控制。 | (3)模拟真实网络应用场景，验证承建单位的网络设计方案是否满足业主方的要求。 | (4)\n参考答案\n全国计算机技术与软件专业技术资格考试信息系统监理师命题密卷 下午试卷解析试题一 解答要点【问题1】A公司做法不正确。原因：签订分包合同，应具备最基本的两个条件是：（1）总承建单位只能将自己承包的部分项目分包给具有相应资质条件的分承建单位。（2）分包项目必须经过建设单位同意。【问题2】不可抗力是指不能预见、不能避免并且不能克服的客观情况。不可抗力可以是自然原因酿成的，也可以是人为的、社会因素引起的。前者如地震、水灾、旱灾等，后者如战争、政府禁令、罢工等。综上所述车祸不属于不可抗力。由于车祸导致设备不能第一时间到货、进场而延误了工期，A公司向建设单位申请工期补偿。建设单位不同意A公司的申请。【问题3】建设单位做法不正确。题目中描述新增的设备采购金额为125万元，已经超出原合同总金额10％，要重新招标。试题二 解答要点【问题1】李工的做法不正确。监理大纲是在建设单位选择合适的监理单位时，监理单位为了获得监理任务，在项目监理招标阶段编制的项目监理方案性文件。监理大纲应该由该监理机构公司总监李工负责编制。监理大纲重点描述“为什么”，而不是“如何做”。目的：要使建设单位信服，采用本监理单位制定的监理方案，能够圆满实现建设单位的投资目标和建设意图，进而赢得竞争投标的胜利。【问题2】刘工在编制监理细则时重点描述了“监理工具与设施”的做法是错误的，这一部分属于监理规划，而不属于监理细则。试题三 解答要点【问题1】招标的步骤主要有：①确定项目需求；②编制招标文件；③确定标底；④发布招标公告或发出投标邀请；⑤进行投标资格预审；⑥通知投标单位参加投标并向其出售标书；⑦组织召开标前会议等。【问题2】承建单位A的行为是“属于串通投标”。以下情况是“属于串通投标”：（1）投标人私下协商投标文件、投标报价。（2）投标人之间私下约定投标人。（3）私下约定部分投标人放弃投标、中标。（4）同一组织的投标人，按组织要求协同投标。（5）投标人为谋取中标，采取联合行为排斥某特定投标人。以下情况是“视为串通投标”：（1）不同投标人的投标文件由同一单位进行编制。（2）不同投标人的投标文件异常一致、混装。（3）不同投标人委托同一单位办理投标事宜。（4）不同投标人的投标保证金由同一单位、账户转出。【问题3】    (1)x (2)✓试题四 解答要点【问题1］本题涉及的知识点是EMV的计算。EMV：预期货币价值，是风险定量分析工具，决策树常用的一种计算预期货币价值分析。EMV=30x25%+20x30%+(-18x10%)=11.7(A方案的B方案的\tEMV=28x20%+45x40%+(-35x20%)=16.7(万（万元）C方案的\tEMV=35x30%+30x50%+(-28x15%)=21.3(万元)（万元）【问题2】经过对比，显然C方案的EMV值更高，因此C方案更值得去做。试题五 解答要点【问题1】项目成本基\t准=A+B+C+D+E+F+集成费用＋应急储备=12+20+36+10+29+13+10+10=140(万元)项目总预算＝成本基准＋管理储备\t=140+(140x10%)=154\t（万元）【问题2】第四个月初对项目进行检查（说明是针对头三个月的工作进行检查），发现实际花费的金额为100万元，即\tAC=100\t\t：即实际完成工作的实际花费）项目的\t\t：项目计划要进行的工作的预算）PV=A+D+F+第一次集\t成=12+36+13+(10x30%)=64\t（万元）项目的EV（EV：项目实际完成工作的预算）EV=A+D+F+E+＋第一次集\t成=12+36+13+29+(10x30%)=93CV=EV-AC=93-100=-7\t因此项目成本超支由于目前只施工了三个月的时间，且每个活动的工期为一个月，因此按照正常的进度计划，在第四个月初，应该完成的活动为A、D、F与第一次集成工作。但是我们实际完成的活动有A、D、F、E与第一次集成工作。因此项目施工进度提前。全国计算机技术与软件专业技术资格考试2022年上半年 信息系统监理师 下午试卷参考答案／解析试题一【问题1】参考答案设备采购环节的不当之处：①设备验收未通知业主方；②未提前3天通知业主和B公司到货地点及时间；③接收设备未与合同进行对照；④接收设备未与工程量清单对照；⑤未核对到货时间是否与合同一致；⑥未检查配套软件包；⑦未核对设备质量及完好性。试题解析 本题考查监理在设备采购过程的重点工作以及监理流程。监理设备采购的重点工作包括：①设备是否与工程量清单所规定的设备（系统）规格相符；②设备是否与合同所规定的设备（系统）清单相符；③设备合格证明、规格、供应商保证等证明文件是否齐全；④设备系统要按照合同规定准时到货；⑤配套软件包（系统）是不是成熟的、满足规范的。监理设备采购的流程为：①承建商提前三天通知业主和监理方设备到达时间和地点，并提交交货清单；②监理方协助业主做好设备到货验收准备；③监理方协助业主进行设备验收，并做好记录，包括对规格、数量、质量；④进行核实，以及检查合格证、出厂证、供应商保证书及规定需要的各种证；⑤明文件是否齐全，在必要时利用测试工具进行评估和测试，评估上述设备能否满足信息网络建设的需求；⑥发现短缺或破损，要求设备提供商补发或免费更换；⑦提交设备到货验收监理报告。【问题2】参考答案设备安装过程的不当之处：①应按照施工方案而不是经验进行施工，安装步骤要依据《工程计划书》，设备的配置步骤应依据《网络系统详细设计说明书》；②网络设备应置于机架中，而不是在机架和设备之间预留过道；③各种螺丝必须拧紧，无松动、缺少和损坏，机架不能有晃动现象；④A临时补充实习生不当，施工人员应具备相应的资质，持证上岗。试题解析 本题主要考查机房工程监理的重点及参数要求。机房工程监理重点包括：①审查好承建方的工程实施组织方案，尤其要重点审查是否有保证施工质量的措施；②控制好施工人员的资质，坚持持证上岗；③认真贯彻《建筑智能化系统工程实施及验收规范》，及时发现并纠正违反规范的做法；④深入现场落实“随装随测”的要求，以保证施工质量，加快施工进度。机房环境参数要求（部分）：面对面布置的机架间，应预留不小于1.2m的过道；靠墙的机架，与墙之间应预留不小于1m的过道；主过道预留应不小于1.5m。【问题3】参考答案信息系统网络系统工程实施阶段监理主要工作：①组织布线、网络和安全系统方案设计评审；②检查布线施工和布线测试情况；③进行布线系统的监理确认测试；④网络硬件设备和配套软件的监理确认测试。试题二【问题1】参考答案B、D、E、G试题解析 对备选方法和工具进行选择的依据是：①（软件承建）机构标准软件过程；②项目定义的软件过程；③现有的技术基础；④可得到的培训；⑤合同需求；⑥工具的能力；⑦使用的方便性和提供的服务。【问题2】参考答案还应进行的评审和审核有：①软件编码是否符合规定的标准和需求；②是否已完成所需的测试；③检测出的问题和缺陷是否已建立文档，并被跟踪和处理。试题解析 对软件编码工程活动和产品进行评审和（或）审核的内容，至少应包括：①软件编码工程任务的准备就绪和完成准则是否得到满足；②软件编码是否符合规定的标准和需求；③是否已完成所需的测试：④检测出的问题和缺陷是否已建立文档，并被跟踪和处理；⑤对设计的跟踪是否得以实施；⑥在软件产品提交前，是否依据软件基线验证了用来管理和维护软件的文档。【问题3】进入确认测试的条件至少要包括：①软件完成了集成测试；②软件可运行；③所有软件代码都在配置管理控制下；④已经具备了合同规定的软件确认测试环境。试题三【问题1】参考答案不当之处：①未制订试运行计划；②未进行现场跟踪；③不应向用户口头承诺；④客户问题无专人受理、记录；⑤问题处理没有跟踪管理导致解决延迟或问题积累；⑥未制订维护方案，仅凭个人经验进行维护：⑦未对用户进行培训。【问题2】参考答案软件测试计划应包含的内容：①测试范围；②测试环境；③测试策略；④测试管理；⑤测试风险。【问题3】参考答案对软件测试工程活动和产品进行评审的内容，至少还应包括：①软件测试是否符合规定的标准和需求；②检测出的问题和缺陷是否已建立文档，并被跟踪和处理；③通过软件测试，软件产品是否符合软件需求；④是否依据软件基线验证了用来管理和维护软件的文档。试题四【问题1】参考答案各方在外部评审环节存在的不当之处有：①承建单位在本阶段工作完成并通过内部评审后，至少提前10提出外部评审申请，同时将评审文档及资料交给软件专家组成员进行审查；②每次评审应邀请不同的软件专家不当，参加同一个项目的软件专家组成员应相对稳定；③由B公司主持、A公司组织，成立了评审委员会不当，外部评审应由业主单位主持，承建单位组织，成立评审委员会：④评审委员会人员组成不当，评审委员会的组成人数应7人以上（单数），设主任一人、副主任若干人：⑤2名外部软件专家不当，软件专家组成员应占评审委员会总人数的50％以上；⑥评审委员初审软件专家组再审不当，应软件专家组先审评审委员会再审；⑦B单位不能作为外部评审专家成员；⑧重要问题未解决不通过评审不当。【问题2】参考答案提交验收的软件项目必须具备以下条件；①已通过计算机软件确认测试评审；②已通过系统测试评审；③合同或合同附件规定的各类文档齐全；④软件产品已置于配置管理之下；⑤满足合同或合同附件规定的其他验收条件。【问题3】参考答案(6)✓试题解析（1）各有关部门按照职责分工，负责国家政务信息化项目审批、建设、运行和安全监管等相关工作，并按照“以统为主、统分结合、注重实效”的要求，加强对政务信息化项目的并联管理。（2）除报国家发展改革委员会审批或者国务院审批的项目以外，其他有关部门自行审批新建、改建、扩建，以及通过政府购买服务方式产生的国家政务信息化项目，应当按规定履行审批程序并向国家发展改革委员会备案。（3）项目建设单位应当对项目绩效目标执行情况进行评价，并征求有关项目使用单位和监理单位的意见，形成项目绩效评价报告，在建设期内每年年底前向项目审批部门提交。试题五【问题1】参考答案承建方存在的问题：①无详细的系统配置计划；②无调试计划；③未搭建模拟调试环境及进行模拟环境调试；④未进行单机上电自检及调试；⑤未使用单机逐步接入并调试的策略。【问题2】参考答案事件2中的不当之处有：①验收委员会缺少承建单位代表；②验收申请的审查应由总监理工程师亲自完成，不属于可以委托的事项；③验收前总监理工程师应组织人员进行预验收；④竣工验收文件应由建设方签署，总监理工程师无权签署。【问题3】参考答案(1)✓(2)x\t\t(3)x\t\t(4)✓\t\t(5)✓\t\t(6)x\t\t(7)x试题解析（2）网络设备的接地系统不可与避雷装置共用，应各自独立，并且其间距应在10m以上。（3）穿在管内绝缘导线的额定电压不应高于500V。（6）地板载重量必须大于500kg／㎡。（7）线槽直埋长度超过6m或在线槽路由交叉、转变时宜设置拉线盒，以便于布放缆线和维修。\n全国计算机技术与软件专业技术资格考试2021年下半年 信息系统监理师 下午试卷解析／参考答案","content_length":6465},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题一","score":15,"content":"试题一（15分）【问题1】参考答案应当实施监理。因为根据信息产业部发布的“信部信［2002］570号”文件规定，下列信息系统工程应当实施监理：①国家级、省部级、地市级的信息系统工程；②使用国家政策性银行或者国有商业银行贷款，规定需要实施监理的信息系统工程；③使用国家财政性资金的信息系统工程；④涉及国家安全、生产安全的信息系统工程；⑤国家法律、法规规定应当实施监理的其他信息系统工程。本项目为省部级信息系统工程，所以应实施监理。【问题2】参考答案（1）B 单位做法不正确。项目竣工结算应由建设单位汇总编制，项目竣工结算应内容完整、核对准确、真实可靠。（2）竣工结算报表一般包括：竣工工程概况表、竣工财务结算表、交付使用财产总表和明细表、结余设备明细表和应收应付款明细表等。【问题3】参考答案业主单位：本题未见验收方案。业主单位应与监理单位协调，审定承建单位提交验收方案，考查验收方案是否符合项目的相关要求，三方在协商基础上形成正式的验收方案。监理单位：验收工作的全过程必须详细记录，记录验收过程中验收委员会提出的所有问题与建议以及对被验收软件的评价；验收过程出现的问题应出具问题清单，并要求限期整改；验收工作结束后应出具验收报告。承建单位：承建单位将软件提交业主单位与监理单位进行验收测试之前，必须保证承建单位本身己经对软件的各方面进行了足够的正式测试；软件除了要符合软件需求规格说明书要求之外，还应满足设计要求、合同要求。验收委员会：应出具测试计划，测试中发现的Bug应整改，应出具测试报告，测试组无权决定项目通过验收；验收环境审定应由配置审核小组进行，且开发环境与验收环境一致不能说明符合验收条件。","content_length":701},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题二","score":18,"content":"试题二（18分）【问题1】参考答案还缺的检查点：可追溯性、风险、实用性、技术清晰度、可维护性。【问题2】参考答案对软件编码规范提出的整改要求的不当之处如下：（1）名称不是越长越好，应当选择精炼的、意义明确的名称，必要时可使用缩写名称，但这时要注意缩写规则要一致，并且要给每一个名称加注释。（2）程序中的注释是程序员与日后的程序读者之间的重要沟通桥梁。一些正规的程序文本中注释行的数量占到整个源程序的三分之一或更多。注释分为序言性注释和功能性注释。（3）除非对效率有特殊的要求，程序编写要清晰第一，效率第二。【问题3】参考答案软件配置管理监理的目标包括：①确保软件配置管理活动是有计划的；②确保所选择的软件工作产品（各阶段成果）是经过标识、受到控制并具有可用性的；③所标识的软件工作产品的更改是受控的；④可及时了解软件基线的状态和内容。【问题4】参考答案(1)\t\t\t(2)\t\t(3)✓\t\t(4)\t\t(5)✓\t\t(6)✓\t\t(7)x\t\t(8)✓试题解析 本题考查需求规格说明书的编制原则。（1）需求规格说明书中的功能与实现分离，是指描述要“做什么”，而不是“怎样实现”。（2）需求规格说明书中就使用面向处理的规格说明语言，来说明来自环境的各种输入有可能会导致系统做出什么样的功能性反应，以此来定义出行为模型，从而得到“做什么”的规格说明。（4）需求规格说明书中必须包括系统运行的环境。（7）需求规格说明书中必须容许不完备性并允许扩充。","content_length":615},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题三","score":14,"content":"试题三（14分）【问题1】参考答案应用系统的运算模型以OLAP为主；可以采用MTBF值衡量系统可靠性【问题2】参考答案小刘对机房电源系统设计建议中的不正确之处有：①其他单一谐波不得高于5％，错误。应不得高于3％：②电源稳压器容量计算时应为各设备总容量之和，错误。应再加30％安全容量：③机房电源与窗型冷气机、复印机等小型用电设备应共用同一地线，错误。这些设备不得共用同一地线，以免互相干扰：④机房内设置的供维修人员使用的普通插座可以与机房电源系统共用电源，错误。维修用插座应该单独设置：⑤配电箱的位置应当注意安全，远离机房，错误。配电箱应尽量靠近机房，并且便于操作。【问题3】参考答案(1)x(2)x(3)✓(4)✓ (5)✓试题解析 对设计方案评审的基本原则：①标准化原则，标准化是保证项目质量的关键，同时也是信息安全、知识产权得以确保的重要手段；②先进性和实用性原则，系统设计和设备选型既要在生命周期中保持一定的先进性，还要从用户的实际需求出发，保证系统规划、实施方案的可行性：③可靠性和稳定性原则：④可扩展性原则；⑤安全性原则，这既包括设备、技术层次的安全性，也包括制度、体系、人员方面的安全性；⑥可管理性原则；⑦对原有设备、资源合理整合的原则：⑧经济和效益性原则。在对网络系统整体规划进行评审需考虑的内容：①在网络架构方面，对联网方式、信息传送方式、IP地址规划、QoS策略等关键技术方案进行严格审核；②在审核系统规划时应从设备可靠性、通用性、技术扩展性、设备投资、长期运营费用等方面综合考虑：③审核骨干网的自愈能力和措施是否合理；④网络路由和交换设备之间的兼容性是否良好；⑤某些网络设备的功能和技术指标是否会造成网络整体性能的瓶颈；⑥是否采取了有效的IP地址规划策略，IP地址规划兼顾效率和质量，应符合业主的组织结构，并能反映出组织上的从属关系，还应充分考虑每个业务单位的扩一展因素，既要保持技术上的先进性，又要考虑工程的可实施性；⑦主要设备是否具有良好的扩展性；⑧如果工程要求建设多业务网络或提供增值服务，，还应考虑 VoIP、视频会议网关（Gateway）和关守（Gatekeeper）之间的兼容性是否良好，网络是否支持分层分级管理，是否支持严格的服务质量和服务等级（QoS／CoS）的划分，信令和语音通道是否具有链路容错能力，是否支持MGCP多媒体通信协议和SIP协议：⑨网络应区分不同业务类型的数据。","content_length":1009},{"source":"信息系统监理师_案例分析合集.docx","category":"案例合集","time_label":"综合","title":"试题五","score":15,"content":"试题五（15分）【问题1】参考答案在集成测试阶段，监理单位的主要监理工作包括：①评审项目验收大纲及各子系统测试报告；②评审承建方应交付的各类文档；③组织计算机系统和网络系统的集成测试；④组织网络系统的连通性测试；⑤组织软件系统集成测试等。【问题2】参考答案(1)D\n(2)C\n(3)B\n(4)B\n(5)A试题解析代码审查（包括代码评审和走查）主要依靠有经验的程序设计人员根据软件设计文档，通过阅读程序，发现软件错误和缺陷。代码审查一般按代码审查单阅读程序，查找错误。代码审查的内容包括：①检查代码和设计的一致性；②检查代码的标准性、可读性：③检查代码逻辑表达的正确性和完整性；④检查代码结构的合理性等。代码审查虽然在发现程序错误上有一定的局限性，但它不需要专门的测试工具和设备，一旦发现错误就能定位错误，且一次可发现一批错误。静态分析主要对程序进行控制流分析、数据流分析、接口分析和表达式分析。静态分析一般由计算机辅助完成。静态分析的对象是计算机程序，程序设计语言不同，收相应的静态分析工具也不同。目前具备静态分析功能的软件测试工具有很多，如Purify，Macabe等。白盒测试是一种按照程序内部的逻辑结构和编码结构设计并执行测试用例的测试方法。采用这种测试方法，测试者需要掌握被测程序的内部结构。白盒测试通常根据覆盖原则设计测试用例，以使程序中的每个语句、每个条件分支、每个控制路径都在测试中受到检验。白盒测试需要运行程序，并在运行过程中跟踪程序的执行路径。软件人员使用白盒测试方法，主要对模块进行如下的检查：①对程序模块的所有独立执行路径至少测试一次；②对所有的逻辑判定，取“真”与取“假”的两种情况都至少测试一次；③在循环的边界和运行界限内执行循环体；④测试内部数据结构的有效性等。黑盒测试从软件需求出发，根据软件需求规格说明设计测试用例，并按照测试用例的要求运行被测程序。它侧重于程序的执行结果，将被测程序看成是不可见的黑盒子，较少关心程序内部的实现过程，因此被称为黑盒测试。黑盒测试着重于验证软件功能和性能的正确性，它的典型测试项目包括功能测试、性能测试、边界测试、余量测试和强度测试等。【问题3】参考答案(1)x\n(2)x\n(3)✓\n(4)✓\n(5)✓试题解析接口。（1）组装测试（也称系统测试、整体测试）提供了构造软件模块结构的手段，同时测试其功能和单元测试（也称模块测试）检查每一单独的模块部件的功能和性能。\n全国计算机技术与软件专业技术资格考试2021年上半年 信息系统监理师 下午试卷答案／解析试题一 参考答案／解析【问题1】机房建设还应包括空调系统、电气系统、接地与防雷系统、消防系统和环境监控系统。【问题2】(1)✓(2)x解析：分级机房温湿度指标如下表所示。开机时计算机机房的温、湿度(3)✓(4)x解析：常用记录介质库的温、湿度应与主机房相同，其他记录介质库的温湿度要求如下表。(5)✓【问题3】(1)B解析：数据复制的快慢决定于数据复制模式，复制模式影响复制技术的选择，根据不同的情况，通常采用以下几种复制模式。同步数据复制：这一复制模式通过网络镜像数据，数据卷保持一致，主系统上的写操作不会提交直至它们被成功地复制到第二个系统。由于网络响应影响写性能，此模式不适于长距离的、写操作密集型的复制，距离为数百或数千公里时通常不被采用。异步数据复制：异步复制可以让主站点在复制到第二站点以前提交数据，因此第二站点可能滞后于主站点，但它是比较典型的秒级或微秒级解决方案。这种模式可提供实时和长距离复制。定期复制：这种模式从主节点到第二节点周期性地复制数据。当灾难出现时，第二站点的数据可能是旧的，或者数据变成不一致，或者在重新同步中坏掉。为避免数据不一致，这些方案需要附加的存储。(2)C解析：灾难恢复系统可根据操作方式分为以下三种。全自动恢复系统：它配合区域集群等高可靠性软件，可在灾害发生时自动实现把主应用端的应用或数据切换到远程的副应用端，在主应用端修复后，再把在副应用端运行的应用或数据返回到主应用端，操作非常简单。在灾害发生时全自动恢复系统可达到不中断响应的切换，很好地保证了重要应用的连续性。其优点是大大地减少了系统管理员在灾害发生后的工作量。缺点是一些次要因素如服务器死机、通信联络中断等，也随时有可能引发主生产系统切换到副应用端的操作。手动恢复系统：在这种应用中，如果主应用端全部被破坏，在副应用端利用手动方法把应用加载到服务器上，并且手动完成将主应用端的数据切换到远程的副应用端的操作，以继续开展业务处理，这种方法的优点是整个系统的安全性非常好，不会因为服务器或网卡损坏而发生误切换，缺点是会产生一段时间的应用中断。数据备份系统：在这种系统中，系统将主应用端的数据实时地备份到远地的存储器中。这样，一旦主应用端的存储设备遭到损坏时，远程的存储器中会保留事故发生前写入本地存储器的所有数据，使丢失数据造成的损失降到最低点。当主应用端的存储器恢复正常，并将远地存储器的数据回装入本地存储器之后，应用可恢复到故障前的状态。这个时间差异取决于服务器的缓存中丢失了多少数据。与上述两种方式相比，本方式系统恢复所需时间最长，但成本最低。(3)B解析：灾难恢复站点分热站、冷站与温站三种类型。热站（Hot Site）：在恢复站点，服务器、数据与应用程序与主服务器随时同步（镜像）运行，这种方式的灾难恢复过程非常快，几乎难于察觉，但软硬件的重复投资使得这种方案投资高昂。冷站（Cold Site）：冷站只具备了用于信息处理的基础物理环境（如电线、空调、地板等），灾难发生时，所有设备都必须运送到站点上从基础开始安装，因此故障恢复时间可能会很长。温站（Warm Site）：在温站中，配置了用于信息处理的网络连接和一些外围设备，但主要的计算机系统没有备份。温站比冷站投入使用速度快，同时，还比热站的建设费用低。试题二 参考答案／解析【问题1】可行性研究包括四个方面的内容：①经济可行性-进行成本／效益分析，从经济角度判断系统开发是否“合算”；②技术可行性-进行技术风险评价，从建设技术、问题的复杂性等出发，判断系统开发在时间、费用等限制条件下成功的可能性；③法律可行性-确定系统开发可能导致的任何侵权、妨碍和责任；④方案的选择-评价系统或产品开发的几个可能候选方案，最后给出结论意见。【问题2】对于题目所述的情况，监理工程师只可以推荐公开招标，理由如下。招标分为公开招标和邀请招标。公开招标是指招标人以招标公告的方式邀请不特定的法人或者其他组织投标；邀请招标是指招标人以投标邀请书的方式邀请特定的法人或者其他组织投标。此题不选邀请招标的原因是，有下列情形之一的，才可以邀请招标：①技术复杂、有特殊要求或者受自然环境限制，只有少数潜在投标人可供选择；②采用公开招标方式的费用占项目合同金额的比例过大；③只有少量供应商可以选择。题干所描述的条件，不符合邀请招标的要求。【问题3】(1)A\n(2)H解析：成熟度级别1级（初始级）：处于此级别时，过程通常是随意且混乱的，组织往往不能提供一个稳定的环境来支持过程，其组织的特征是具有过度承诺的倾向，他们在危机情况下会舍弃他们的过程，而且没有能力去复制他们的成功。成熟度级别2级（已管理级）：处于此级别时，项目确保其过程按照方针得到计划与执行，项目雇用有技能的人，具备充分的资源以产生受控的输出，相关干系人参与其中。成熟度级别3级（已定义级）：处于此级别时，过程得到清晰的说明与理解并以标准、规程、工具与方法的形式进行描述。本级别与成熟度级别2的关键区别在于标准、过程描述与规程的范围。成熟度级别4级（量化管理级）：处于此级别时，组织与项目建立了质量与过程性能的量化目标并将其用作管理项目的准则，量化目标基于客户、最终用户、组织、过程实施人员的需要，质量与过程性能以统计术语的形式得到理解，并在项目的整个生命期内得到管理。成熟度级别5级（优化级）：处于本级别时，组织基于对其业务目标与绩效的量化理解，不断改进其过程，组织使用量化的方法来理解过程中固有的偏差与过程结果的原因。【问题4】招标过程中存在的主要问题有：①评标委员会名单在中标结果确定前不能公开；②评标委员会中技术、经济专家只有3人，未达到评标委员会人员总数的2／3；③招标人根据评标委员会提出的书面评标报告和推荐的中标候选人确定中标人，在未得到招标人以授权的情况下，评标委员无权直接确定中标人；④招标人和中标人应当自中标通知书发出之日起30日内，按照招标文件和中标人的投标文件订立书面合同，题目中订立书面合同的日期离中标通知书发出之日已经超过了30日；⑤承包单位无权要求分包单位向招标单位负全责，只有承包单位应对招标单位负全责。试题三 参考答案／解析【问题1】（1）错误，信息座要设计在距离地面30cm以上。（2）错误，信息座与计算机设备的距离保持在5m以内。（3）正确。（4）正确。（5）正确。（6）正确。【问题2】工程验收必须要符合下列要求：①所有建设项目按照批准设计方案要求全部建成，并满足使用要求；③各种技术文档和验收资料完备，符合集成合同的内容；④系统建设和数据处理符合信息安全的要求；⑤外购的操作系统、数据库、中间件、应用软件和开发工具符合知识产权相关政策法规的要求；⑥\t\t\t\t\t\t\t\t\t\t\t\t\t（灰色部分无需写在答案中）【问题3】网络设备采购的监理重点：①设备是否与工程量清单所规定的数量及规格相符；②设备是否与采购合同所规定的设备清单相符；③设备合格证明、规格、供应商保证等证明文件是否齐全：④设备要按照合同规定准时到货；⑤配套软件包是否是成熟的、满足规范的。试题四 参考答案／解析【问题1】（1）不正确（以下灰色部分为题干中已经提到的内容，仅回答题干中没有提到的任意四点即可），补充说明如下：①②是否包含对负责软件质量保证的机构、任务及其有关职责的描述；③是否包含对开发过程中的文档进行评审与检查的准则，包括软件需求说明书、软件设计说明书、软件测试规范、项目进展报表、项目阶段评审报表等基本文档；④是否列出软件开发过程中要用到的标准、条例和约定，并列出监督和保证执行的措施；⑤⑥是否包含了有关软件配置管理的条款，如是否规定了用于标识软件产品、控制和实现软件的修改、记录和报告修改实现的状态、评审和检查配置管理工作这四方面的活动，以及是否规定了维护和存储软件受控版本的方法和设施，是否规定了对所发现的软件问题进行报告、追踪和解决的步骤；⑦⑧是否指出保护计算机程序物理媒体的方法和设施；⑨⑩是否指明了需要保存的软件质量保证活动的记录，是否指出了保存和维护这些记录的方法、设施和保存期限。（2）不合理。鉴于《质量保证计划》的内容还不够充分详实，因此监理工程师不应让审查通过，而是应该按照如下过程开展工作：①质量监理组提出审查意见；②必要时，总监理工程师组织专家进行评审，提出评审意见；③监理单位与业主和承建单位共同探讨，综合三方建议；④承建单位根据评审意见和建议完善自身的质量保证体系，并再次提交监理单位；⑤监理单位再次审查，并向业主提交最终评审意见，业主根据评审意见对承建单位工作做出整改决定。【问题2】不完整。完整的验收监理审查过程如下。1．对软件的验收条件进行审查：①已通过计算机软件确认测试评审；②已通过系统测试评审；③合同或合同附件规定的各类文档齐全；④软件产品已置于配置管理之下；⑤合同或合同附件规定的其他验收条件。2．对验收依据进行审查软件验收的依据是合同及合同附件、有关技术说明文件及适用的标准。3．对验收过程进行审查。验收工作步骤如下：①提出验收申请；②制定验收计划；③成立验收委员会；④进行验收测试和配星审计；⑤进行验收评审；⑥形成验收报告；⑦移交产品。4．对文档的移交、系统及产品的移交和售后服务相关工作进行审查。【问题3】(1)✓解析：原有测试和审核结果凡可用的就利用，不必重做该项测试或审核。同时可根据业主单位的要求临时增加一些测试和审核内容。(2)x解析：测试组在认真审查需求规格说明、确认测试和系统测试计划与分析结论的基础上制订验收测试计划。(3)x解析：测试组在完成验收测试的同时，完成功能配置审核，即验证软件功能和接口与“合同”的一致性。(4)✓解析：验收测试和配置审核是验收评审前必须完成的两项主要检查工作，由验收委员会主持。试题五 参考答案／解析【问题1】A、C、E、F解析：通常对光缆的测试方法有：连通性测试、端-端损耗测试、收发功率测试和反射损耗测试四种。连通性测试：连通性测试是最简单的测试方法，只需在光纤一端导入光线（如手电光），在光纤的另外一端看看是否有光闪即可。连通性测试的目的是为了确定光纤中是否存在断点。端-端的损耗测试：端-端的损耗测试采取插入式测试方法，使用一台功率测量仪和一个光源，先在被测光纤的某个位置作为参考点，测试出参考功率值，然后再进行端-端测试并记录信号增益值，两者之差即为实际端到端的损耗值，用该值与FDDI标准值相比就可确定这段光缆的连接是否有效。收发功率测试：收发功率测试是测定布线系统光纤链路的有效方法，使用的设备主要是光纤功率测试仪和一段跳接线。在实际应用中，链路的两端可能相距很远，但只要测得发送端和接收端的光功率，即可判定光纤链路的状况。损耗衰减测试：OLTS／OPM（光损耗测试仪／光功率计）可用来测试光纤及其元件／部件（衰减器、分离器、跳线等）或光纤路径的衰减／损耗。【问题2】(1)x(2)x\t\t(3)✓ (4)✓\t(5)x (6)x解析：（1）机架、设备的排列位置和设备朝向都应按设计安装，并符合实际测定后的机房平面布置图的要求。（2）为便于施工和维护，机架和设备前应预留1.5m的过道，其背面距墙面应大于0.8m。相邻机架和设备应互相靠近，机架表面排列平齐。（3）机架设备、金属钢管和槽道的接地装置应符合设计施工及验收标准规定，要求有良好的电气连接，所有与地线连接处应使用接地垫圈，垫圈尖角应对向铁件，刺破其涂层，必须一次装好，不得将已装过的垫圈取下重复使用。（4）接线头必须进行焊锡处理，保证接线端接触良好，不易氧化。（5）监视器安装位置应使屏幕不受外来光直射，当有不可避免的光时，应加遮光罩遮挡。（6）缆线与接续模块等接插部件连接时，应按工艺要求标准长度剥除缆线护套，并按线对顺序正确连接。如采用屏蔽结构的缆线时，必须注意将屏蔽层连接妥当，不应中断，并按设计要求做好接地。【问题3】(1)B\t\t(2)C\t\t(3)A\t\t(4)A\t\t(5)D解析：不同的开发阶段对应的测试如下表所示。\n全国计算机技术与软件专业技术资格考试2020年下半年 信息系统监理师 下午试卷解析试题一 参考答案／解答要点【问题1】监理单位的权利和义务：①应按照“守法，公平，公正，独立”的原则，开展信息系统工程监理工作，维护建设单位与承建单位的合法权益。本例中监理单位偏袒甲方不妥；②监理单位要保护承建单位的技术秘密和商业秘密。监理人员的权利和义务：①保守承建单位的技术秘密和商业秘密。老王在饭桌上谈论建设单位的商业秘密不妥；②不得同时从事与被监理项目相关的技术和业务活动。老王带领监理人员开展测试工作不妥。【问题2】根据事件2，在设计阶段监理工作的主要内容包括：①结合信息工程项目特点，收集设计所需的技术经济资料；②对设计单位对的系统设计方案进行评审；③参与主要设备、材料的选型工作；④审核方案中主要设备、材料清单；⑤协助业主对工程建设周期总目标进行分析评审；⑥审核承建方编制的工程项目总进度计划。【问题3】CPI（Cost Performance Index，成本绩效指标），它是EV（Earned Value，挣值）与AC（Actual Cost） 的比值，即CCPI=EV/ACV／AC。CPI如果小于1，说明EV＞AC，即实际完成工作的计划价值大于实际完成工作的实际价值，那么，说明实际完成的工作节余了，反之则是超支了。因此，根据题目中给出的绩效报告表中的CPI数据，可得出各项目在6月时的绩效情况如下：机房工程\tCPI=0.7<1，成本超支，原因是EEV<AC系统集成\tCPI=1.03>1，成本节约，原因是EEV>AC软件开发\tCPI=1，成本持平，原因是\tEV=AC【问题4】变更控制的原则包括：①对变更申请快速响应；②任何变更都要得到三方确认；③明确项目变更的目标；④明确界定项目变更的范围；⑤三方都有权提出变更；⑥加强变更风险以及变更效果的评估；⑦及时公布变更信息；⑧选择冲击最小的方案。试题二 参考答案／解答要点【问题1】\n【问题2】确认验收的基本条件包括：①是否符合工程设计和合同约定的各项内容；②技术文档和工程实施管理资料是否完备；③工程涉及的主要设备、材料的进场和检验报告是否完备：④各单项工程的设计、实施、工程监理等单位分别签署的质量合格文件是否完备；⑤承建方的售后服务和培训计划是否完备。【问题3】验收方案制定方面存在的问题：①在信息系统完工前，建设单位、承建方和监理方三方共同确定验收方案，而不是建设方与监理方确认验收方案；②验收方案应具备全面性和业务符合性，不应因为追赶进度而降低验收标准【问题4】验收阶段监理需审核的内容主要包括：·验收标准。检查承建单位提交的验收标准是否符合合同及有关标准。·验收方案。审核业主和承建单位制定的系统验收方案，并审查验收方案的全面性和业务符合性。·验收准备工作。监督合同各方做好验收准备工作，按规定准备技术资料，要求数据准确、种类齐全、文字精练。审核业主制定的验收测试方案，审查承建单位提交的测试大纲，督促其做好竣工前的验收测试准备工作。测试、检验必须根据有关规范和规定进行，不得擅自修改、减少测试大纲和测试项目，不得擅自修改、伪造和事后补做测试记录。验收实施。监控系统验收组执行系统验收工作，必要时采取测试方法检验系统是否达到设计要求。·验收报告。监理工程师审查提交的测试报告、初验报告和正式验收报告，审查验收工作是否完成合同书中各项内容，是否满足需求书中提出的各项应用指标，并经过系统试运行的用户认可。试题三 参考答案／解答要点【问题1】监理单位采用的是帕累托分析的方法，该方法认为80％的问题经常是由于20％的原因引起的，因此也称80-20法则。本方法主要用于找出造成多数问题的少数原因。【问题2】检查，控制图，趋势分析，统计样本，流程图，趋势图。【问题3】组织措施，技术措施，经济措施，合同措施，管理措施。【问题4】监理单位对进度进行控制的要点：·明确监理方负责进度控制的责任人、职责及分工。（有人负责）·明确进度控制的目标及工作人务。（目标明确）·建立进度计划审核及分析制度。（措施到位）·加强对来自各方面信息的综合、协调和督促。（实现控制）试题四 参考答案／解答要点【问题1】不正确；验收委员会应由5人以上单数组成，设主任1人。验收组织机构及人员组成：业主单位与监理单位协调成立专门的验收委员会，作为验收的组织机构。委员会一般不少于5人（单数）组成，设主任1人，委员若干人，并成立验收测试组和配置审核组，委员可分别参与这两个组的工作。另外还需要测试员、配置审核员和记录员若干人。验收委员会由业主单位代表，监理单位代表，承建单位代表以及邀请的技术专家组成。【问题2】不满足。提交验收的软件项目必须具备以下条件：·已通过确认测试评审。·\t已通过系统测试评审。·\t合同或合同附件规定的各类文档齐全。软件产品已置于配置管理之下。合同或合同附件规定的其他验收条件。【问题3】信息应用系统验收工作流程：①提出验收申请；②制定验收计划；③成立验收委员会；④进行验收测试和配置审计；⑤进行验收评审；⑥形成验收报告；⑦移交产品。试题五 参考答案／解答要点【问题1】【问题2】\n全国计算机技术与软件专业技术资格考试2019年下半年 信息系统监理师 下午试卷解析试题一 答案及解析【问题1】（3分）试题分析 本题考查的是软件需求分析阶段监理的主要任务。需求分析阶段监理的要点分为四个部分。一是需求获取阶段，此阶段的重点监理工作是审核需求获取计划、参与需求获取过程、审核需求获取结果；二是需求分析的相关规格说明书的编制，重点监理工作是审查需求分析的方法是否合理，以及相关的规格说明书模板是否齐全；三是需求验证，重点监理工作是协助用户对需求进行验证，如需求的完整性、准确性、可测试性及文档的齐全性；四是需求管理，主要是审核变更的控制过程、CCB的建立、变更的影响分析、跟踪、检查等工作。参考答案 根据监理控制要点在监理过程中发现的问题如下：1）需求获取阶段没有经过监理单位的审核、参与及确认。2）需求分析阶段产生的相关的说明书不齐全，如数据库说明书、信息系统安全方案、培训及运维计划等。3）需求未经过用户的验证。【问题2】（6分）试题分析 本题考查的是监理在项目成本控制中的主要工作内容。成本控制主要关心的是对成本改变产生影响的各种因素，以及确定成本是否改变以及管理和调整实际的改变。参考答案 成本控制的内容包括：1）项目实际成本不超过项目计划投资。2）应十分重视项目前期和设计阶段的成本控制工作。3）以动态控制原理为指导进行投资计划值与实际值的比较。4）可采取组织、技术、经济、管理、合同措施。5）有必要进行计算机辅助投资控制。【问题3】（6分）试题分析 本题考查的是《软件编码规范》的内容。参考答案（1）错误。名称不易过长，变量名称精简明确，缩写要规范一致并加上注释，程序中变量名要唯一，只能用作一种用途。（2）错误。程序中要注意添加必要的注释。（3）错误。数据说明要按照统一的次序，以便于索引及定位。（4）错误。不能仅为了体现编程水平，而只顾效率不顾代码的清晰明确。（5）正确（6）正确【问题4】（5分）试题分析 本题考查的是软件开发中项目代码开发数量与项目进度的关系。参考答案 不合理。不能认为完成了一半的代码工作量就是完成了整个项目进度的50％。原因：①对整个软件的代码行的估计可能不准确；②已写完的代码可能相对容易；③如果代码没有通过测试，就不能算完成。试题二 答案及解析【问题1】（6分）试题分析 本题考查的是工程验收的准备工作的相关内容。工程验收前必须满足的条件：所有建设项目都已按批准的准设计方案的要求全部建成，并满足使用要求。各个分项工程全部初验合格。各种技术文档和验收资料完备，符合集成合同的内容。系统建设和数据处理符合信息安全的要求。外购的操作系统、数据库、中间件、应用软件和开发工具符合知识产权相关政策法规的要求。各种设备经加电试运行后，状态正常。经过用户同意。参考答案1）未对采购的软件进行配置审核。2）项目的大部建设内容完成，说明不是全部的内容建设已完成。3）技术文档和验收资料基本完备，说明还不完备。4）系统未经过试运行。5）电子政务项目的验收需邀请项目审批单位人员参加，而其并且没有邀请。6）缺少业主方的认可。【问题2】（3分）试题分析 本题考查的是项目初步验收和正式验收的内容及注意事项。初步验收是在承建方自检的基础上，由业主方、承建方、监理方组成项目初验小组，对工程各项工作进行全面检查，合格后提出正式的竣工验收申请。正式验收是上级主管部门或负责验收的单位收到竣工验收申请和竣工验收报告后，经过评审、确认符合竣工验收条件和标准，即可组织正式验收。参考答案（1）不正确。应至少是建设单位、承建单位和监理单位三方确定验收方案。（2）不正确。验收组至少应由建设单位、承建单位和监理单位三方共同组建。（3）不正确。完成初步验收后，一般需形成初验报告，初验收报告经评审通过后进入试运行阶段。【问题3】（6分）试题分析 本题考查的是验收过程中各相关验收小组的具体工作内容。参考答案 测试（复核）小组的工作内容：1）根据承建方提交的验收测试报告和数据，通过仪器设备或某种方法，对关键点进行复测，验证其功能或数据的正确性。2）根据分项工程的具体情况，按照合同、有关标准、规范等规定的验收要求进行复测。资料文档评审小组的工作内容：根据合同要求乙方提供有关资料进行评审，资料要齐全，需要评审的资料主要包括项目的基础资料和工程竣工资料。工程质量鉴定小组的工作内容；1）听取业主、承建方、监理方对工程建设情况的介绍。2）组织现场复查验收。3）听取验收测试小组的工作汇报、资料评审小组的工作汇报，用户试用情况的汇报。4）起草工程验收的评语。试题三 答案及解析【问题1】（4分）试题分析（1）考查DAS、NAS、SAN四种存储方式的定义及特点。DAS（Direct-Attached Storage），直连式存储，存储设备通过电缆（通常是SCSI接口电缆）直接挂到服务器总线上，服务器故障会导致其挂载DAS存储设备不能存取，可挂载的设备数量有限，易形成IO瓶颈；NAS（Network Attached Storage），网络附属存储，基于标准网络协议实现数据传输，每个设备都有一个IP地址，适合于将分布、独立的数据整合为大型、集中化管理的数据中心，对距离没有限制，易于部署和管理：SAN（Storage AreaNetwork），存储区域网络，是一种专门用于网络存储的专业网络，可通过交换机连接，可以实现网络服务器与存储设备之间的多对多连接。对于高并发、随机小块I／O环境（小数据块传输）或者共享访问文件的环境，NAS比SAN的相对性能要高得多。可见，选C最合适。（2）考查灾难恢复的相关数据复制技术。根据系统需求描述，“实时”、“秒级或微秒级”这几个关键字，决定了异步数据复制、定期复制、人工复制这三种复制方式都是不可行的。（3）考查灾难恢复系统的类型及特点。根据操作方式不同，灾难恢复系统可分为全自动恢复系统、手动恢复系统、数据备份系统三钟，其效果各有不同，这首先就排除了D。全自动恢复系统的优点是大大地减少了系统管理员在灾害发生后的工作量，缺点是对于一些次要因素，如服务器死机、通信联络中断等，随时有可能引发主生产系统向副系统的切换。手动恢复系统的优点是整个系统的安全性非常好，不会因为服务器或网卡损坏而发生误切换，缺点是会产生一段时间的应用中断。数据备份系统所需的恢复时间最长，但成本最低。可见，B最合适。（4）考查灾难恢复站点类型及其特点。恢复地点的选择对任何灾难恢复计划都极为重要，大多数灾难恢复计划的核心是物理隔离，即数据（常常包括服务器）在异地保存，存储这些设备的地点一般被称为恢复站点。站点一般分为热站、冷站和温站，这首先就排除了D选项。热站（Hot Site）的特点是，在恢复站点，服务器、数据与应用程序与主服务器随时同步（镜像）运行，这种方式的灾难恢复过程非常快速，几乎难于察觉，但这种方案一般投资较高。冷站（Cold Site）指用于信息处理的基础物理环境
